[package]
name = "xtask"
description = "Host-side build, image and QEMU driver for Ferrix"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Nothing from crates.io, deliberately. This is the program that builds the
# operating system, and a build tool that cannot be built is a bad day; the
# FAT32 writer and the argument parser it would otherwise pull in are a few
# hundred lines each.
#
# The one dependency is the tree's own ELF reader, for the ARMv7-A loader's
# conversion to PE32. It is already fuzzed and host-tested, and the alternative
# was a second ELF reader here that nothing fuzzes.
ferrix-elf.workspace = true
# The tree's own header formats, for the host-side network gateway in
# `gateway/`. The alternative was a second Ethernet, ARP, IPv4, ICMP, UDP and
# TCP parser in the build tool, disagreeing with the kernel's about a length
# field at the worst possible moment; this one is already fuzzed.
ferrix-netwire.workspace = true
# The vdagent protocol, so that the clipboard gate speaks the host's half
# with the same encoder and decoder the guest's agent uses. The crate is
# bytes and nothing else -- it owns no clipboard and no state -- so a gate
# built on it still asserts what the guest did, on the far side of a device.
ferrix-vdagent.workspace = true

[dev-dependencies]
# The kernel's own cpio reader, so the archive `initramfs.rs` writes is tested
# against the code that will read it rather than against a second opinion.
ferrix-cpio.workspace = true

[lints]
workspace = true
