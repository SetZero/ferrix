<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 194 2856" width="194" height="2856" role="img" aria-label="Flow diagram: Kernel bring up. 34 nodes, 33 edges. Main path: start then validateHandoff then initConsole then reportHandoff then stage1SelfCheck then installTraps then initPhysicalMemory then initVmapArena then stage2SelfCheck then stage3TrapCheck then initInterrupts then initTimer."><title>Kernel bring up</title><style>
svg{
  --surface:#fff; --surface-2:#f6f7f8; --sunk:#e4e7ea;
  --ink:#16191d; --ink-2:#3b434c; --muted:#6a737e;
  --rule:#d2d7dc; --rule-strong:#b3bbc3;
  --implemented:#2c6e4e; --implemented-bg:#dceae2;
  --inProgress:#2a5f8f; --inProgress-bg:#dae5f0;
  --writtenAhead:#6b4fa0; --writtenAhead-bg:#e5dff0;
  --planned:#6a737e; --planned-bg:#e4e7ea;
  --deferred:#87600b; --deferred-bg:#f3e8ce;
}
@media (prefers-color-scheme:dark){svg{
  --surface:#1a1e22; --surface-2:#21262b; --sunk:#0e1113;
  --ink:#e7eaed; --ink-2:#bfc6cd; --muted:#8d97a1;
  --rule:#2c3238; --rule-strong:#5a646e;
  --implemented:#6abf92; --implemented-bg:#16301f;
  --inProgress:#74acdb; --inProgress-bg:#122639;
  --writtenAhead:#a98fd8; --writtenAhead-bg:#241c38;
  --planned:#8d97a1; --planned-bg:#262b31;
  --deferred:#d9a83e; --deferred-bg:#2e2511;
}}

figure.diagram{margin:22px 0 26px; padding:0}
figure.diagram svg{display:block; max-width:100%; height:auto;
  background:var(--surface); border:1px solid var(--rule); border-radius:3px}
figure.diagram figcaption{margin-top:9px; font-size:13px; color:var(--muted); max-width:74ch}
figure.diagram figcaption .figname{color:var(--ink-2); font-weight:600}
.dg-text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:var(--ink)}
.dg-sub{fill:var(--muted)}
.dg-stereo{fill:var(--muted); letter-spacing:.02em}
.dg-row{fill:var(--ink-2)}
.dg-shape{fill:var(--surface-2); stroke:var(--rule-strong); stroke-width:1.1}
.dg-terminal{fill:var(--sunk); stroke:var(--rule-strong)}
.dg-note{fill:var(--surface-2); stroke:var(--rule); stroke-dasharray:3 2}
.dg-rule{stroke:var(--rule-strong); stroke-width:1}
.dg-cluster{fill:none; stroke:var(--rule); stroke-width:1; stroke-dasharray:4 3}
.dg-cluster-label{fill:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dg-edge{fill:none; stroke:var(--rule-strong); stroke-width:1.4}
.dg-edge-trace{stroke-dasharray:5 4}
.dg-edge-label{fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dg-edge-label-bg{fill:var(--surface); stroke:none}
.dg-head{fill:var(--rule-strong); stroke:none}
.dg-head-hollow{fill:var(--surface); stroke:var(--rule-strong); stroke-width:1.1}
.dg-legend{fill:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dg-mat-implemented{fill:var(--implemented-bg); stroke:var(--implemented)}
.dg-mat-inProgress{fill:var(--inProgress-bg); stroke:var(--inProgress)}
.dg-mat-writtenAhead{fill:var(--writtenAhead-bg); stroke:var(--writtenAhead)}
.dg-mat-planned{fill:var(--planned-bg); stroke:var(--planned)}
.dg-mat-deferred{fill:var(--deferred-bg); stroke:var(--deferred)}
a.dg-link{text-decoration:none}
</style><rect width="194" height="2856" fill="var(--surface)"/><defs><marker id="dg-ferrix-boot-kernel-bring-up-arrow" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-head" d="M0,0 L9,3.5 L0,7 L1.6,3.5 z"/></marker><marker id="dg-ferrix-boot-kernel-bring-up-open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-edge" d="M0.5,0.5 L9,4 L0.5,7.5"/></marker><marker id="dg-ferrix-boot-kernel-bring-up-hollow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-head-hollow" d="M0.5,0.5 L11,5 L0.5,9.5 z"/></marker><marker id="dg-ferrix-boot-kernel-bring-up-diamond" markerWidth="14" markerHeight="9" refX="0.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-head" d="M0.5,4.5 L7,0.5 L13.5,4.5 L7,8.5 z"/></marker></defs><path class="dg-edge" d="M90.3,48 L90.3,94" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M90.3,128 L90.3,174" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M90.3,208 L90.5,254" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M90.5,288 L90.7,334" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M90.7,368 L91,414" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M91,448 L91.3,494" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M91.3,528 L91.6,574" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M91.6,608 L91.7,654" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M91.7,688 L92,734" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M92,768 L92.3,814" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M92.3,848 L92.9,894" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M92.9,928 L93.7,974" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M93.7,1008 L94.7,1054" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M94.7,1088 L95.7,1134" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M95.7,1168 L96.5,1214" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M96.5,1248 L96.9,1294" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M96.9,1342 L97,1388" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M97,1436 L96.7,1482" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M96.7,1530 L96.3,1576" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M96.3,1624 L96,1670" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M96,1704 L95.9,1750" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M95.9,1798 L95.8,1844" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M95.8,1892 L95.5,1938" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M95.5,1986 L95,2032" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M95,2080 L94.1,2126" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M94.1,2174 L92.7,2220" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M92.7,2268 L90.8,2314" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M90.8,2362 L88.5,2408" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M88.5,2442 L85.9,2488" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M85.9,2522 L83.3,2568" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M83.3,2602 L81,2648" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M81,2682 L79.2,2728" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M79.2,2762 L78.2,2808" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><g><rect class="dg-shape dg-terminal" x="53.3" y="14" width="74" height="34" rx="17"/><text class="dg-text" x="90.3" y="35" text-anchor="middle" font-size="12">start</text></g><g><rect class="dg-shape" x="25.3" y="94" width="130" height="34" rx="4"/><text class="dg-text" x="90.3" y="115" text-anchor="middle" font-size="12">validateHandoff</text><title>Magic, version, arch and layout constants.</title></g><g><rect class="dg-shape" x="39.7" y="174" width="101.2" height="34" rx="4"/><text class="dg-text" x="90.3" y="195" text-anchor="middle" font-size="12">initConsole</text></g><g><rect class="dg-shape" x="32.7" y="254" width="115.6" height="34" rx="4"/><text class="dg-text" x="90.5" y="275" text-anchor="middle" font-size="12">reportHandoff</text></g><g><rect class="dg-shape" x="25.7" y="334" width="130" height="34" rx="4"/><text class="dg-text" x="90.7" y="355" text-anchor="middle" font-size="12">stage1SelfCheck</text></g><g><rect class="dg-shape" x="36.8" y="414" width="108.4" height="34" rx="4"/><text class="dg-text" x="91" y="435" text-anchor="middle" font-size="12">installTraps</text><title>Before anything can fault: until this runs the CPU still points at firmware&#x27;s handlers, which stopped existing at ExitBootServices.</title></g><g><rect class="dg-shape" x="15.5" y="494" width="151.6" height="34" rx="4"/><text class="dg-text" x="91.3" y="515" text-anchor="middle" font-size="12">initPhysicalMemory</text><title>mm::init: carve the per-frame array from the largest usable region inside the direct map, hand every usable frame to the buddy, start the heap.</title></g><g><rect class="dg-shape" x="33.8" y="574" width="115.6" height="34" rx="4"/><text class="dg-text" x="91.6" y="595" text-anchor="middle" font-size="12">initVmapArena</text></g><g><rect class="dg-shape" x="26.7" y="654" width="130" height="34" rx="4"/><text class="dg-text" x="91.7" y="675" text-anchor="middle" font-size="12">stage2SelfCheck</text></g><g><rect class="dg-shape" x="27" y="734" width="130" height="34" rx="4"/><text class="dg-text" x="92" y="755" text-anchor="middle" font-size="12">stage3TrapCheck</text></g><g><rect class="dg-shape" x="30.9" y="814" width="122.8" height="34" rx="4"/><text class="dg-text" x="92.3" y="835" text-anchor="middle" font-size="12">initInterrupts</text><title>arch::init_interrupts: controller and clocks, reported as &quot;clock&quot; and &quot;irqs&quot; lines.</title></g><g><rect class="dg-shape" x="49.5" y="894" width="86.8" height="34" rx="4"/><text class="dg-text" x="92.9" y="915" text-anchor="middle" font-size="12">initTimer</text></g><g><rect class="dg-shape" x="25.1" y="974" width="137.2" height="34" rx="4"/><text class="dg-text" x="93.7" y="995" text-anchor="middle" font-size="12">enableInterrupts</text></g><g><rect class="dg-shape" x="26.1" y="1054" width="137.2" height="34" rx="4"/><text class="dg-text" x="94.7" y="1075" text-anchor="middle" font-size="12">stage3TimerCheck</text></g><g><rect class="dg-shape" x="27.1" y="1134" width="137.2" height="34" rx="4"/><text class="dg-text" x="95.7" y="1155" text-anchor="middle" font-size="12">stage4Processors</text></g><g><rect class="dg-shape" x="31.5" y="1214" width="130" height="34" rx="4"/><text class="dg-text" x="96.5" y="1235" text-anchor="middle" font-size="12">stage5Scheduler</text><title>After stage 4 because it needs every processor it will schedule on, before finishMemory because the task stacks it takes and gives back are mappings the sweep has to see settled.</title></g><g><rect class="dg-shape" x="17.5" y="1294" width="158.8" height="48" rx="4"/><text class="dg-text" x="96.9" y="1315" text-anchor="middle" font-size="12">stage6MemoryObjects</text><text class="dg-text dg-sub" x="96.9" y="1329" text-anchor="middle" font-size="10.5">stage 6</text><title>check_user_memory: the memory objects a process is built from, and a processor translating through one of them.</title></g><g><rect class="dg-shape" x="14" y="1388" width="166" height="48" rx="4"/><text class="dg-text" x="97" y="1409" text-anchor="middle" font-size="12">stage8RootFilesystem</text><text class="dg-text dg-sub" x="97" y="1423" text-anchor="middle" font-size="10.5">stage 8</text><title>check_filesystems: the root built from the initramfs and required to be what the build wrote, then tmpfs over VMO pages and a page source, pipes, a shared file mapping, devfs, procfs and /proc/stat.</title></g><g><rect class="dg-shape" x="35.3" y="1482" width="122.8" height="48" rx="4"/><text class="dg-text" x="96.7" y="1503" text-anchor="middle" font-size="12">stage7Syscalls</text><text class="dg-text dg-sub" x="96.7" y="1517" text-anchor="middle" font-size="10.5">stage 7</text><title>check_syscalls: every number through dispatch, getpid answering this architecture&#x27;s own number, the user copy layer, and then programs in user mode -- turns on one processor, a kill, fork, execve, futex, signals, thread…</title></g><g><rect class="dg-shape" x="27.7" y="1576" width="137.2" height="48" rx="4"/><text class="dg-text" x="96.3" y="1597" text-anchor="middle" font-size="12">stage6ReverseMap</text><text class="dg-text dg-sub" x="96.3" y="1611" text-anchor="middle" font-size="10.5">stage 6</text><title>check_reverse_map: a shared object&#x27;s page decommitted, replaced and held under two processes on two processors, which must never reach a frame the object gave back.</title></g><g><rect class="dg-shape" x="49" y="1670" width="94" height="34" rx="4"/><text class="dg-text" x="96" y="1691" text-anchor="middle" font-size="12">entryPaths</text><title>check_entry_paths: a trap flag a program set, which SYSCALL must mask, then the exceptions nothing masks, which must find the kernel&#x27;s GS wherever they land.</title></g><g><rect class="dg-shape" x="30.9" y="1750" width="130" height="48" rx="4"/><text class="dg-text" x="95.9" y="1771" text-anchor="middle" font-size="12">stage8PathCalls</text><text class="dg-text dg-sub" x="95.9" y="1785" text-anchor="middle" font-size="10.5">stage 8</text><title>check_path_calls: the calls that take a path, by number, against the real namespace under /tmp.</title></g><g><rect class="dg-shape" x="16.4" y="1844" width="158.8" height="48" rx="4"/><text class="dg-text" x="95.8" y="1865" text-anchor="middle" font-size="12">stage9NativeObjects</text><text class="dg-text dg-sub" x="95.8" y="1879" text-anchor="middle" font-size="10.5">stage 9</text><title>check_native_objects: the native ABI&#x27;s objects driven through their handlers by two processes the check builds, before any program can make a native call.</title></g><g><rect class="dg-shape" x="34.1" y="1938" width="122.8" height="48" rx="4"/><text class="dg-text" x="95.5" y="1959" text-anchor="middle" font-size="12">stage10Devices</text><text class="dg-text dg-sub" x="95.5" y="1973" text-anchor="middle" font-size="10.5">stage 10</text><title>iommu::bring_up programs the units firmware describes; check_pci finds every PCI function, sizes its BARs and walks its capabilities; check_devices publishes the device nodes, requiring each to hand out exactly the aper…</title></g><g><rect class="dg-shape" x="15.6" y="2032" width="158.8" height="48" rx="4"/><text class="dg-text" x="95" y="2053" text-anchor="middle" font-size="12">stage9DeviceObjects</text><text class="dg-text dg-sub" x="95" y="2067" text-anchor="middle" font-size="10.5">stage 9</text><title>check_device_objects: I/O mappings and interrupts minted from the nodes just published.</title></g><g><rect class="dg-shape" x="32.7" y="2126" width="122.8" height="48" rx="4"/><text class="dg-text" x="94.1" y="2147" text-anchor="middle" font-size="12">stage10Drivers</text><text class="dg-text dg-sub" x="94.1" y="2161" text-anchor="middle" font-size="10.5">stage 10</text><title>check_block_ring: the block ring&#x27;s control plane driven from a process, then devmgr started with every device and driver image, and sectors read through the disks its drivers serve.</title></g><g><rect class="dg-shape" x="24.1" y="2220" width="137.2" height="48" rx="4"/><text class="dg-text" x="92.7" y="2241" text-anchor="middle" font-size="12">stage11BtrfsRead</text><text class="dg-text dg-sub" x="92.7" y="2255" text-anchor="middle" font-size="10.5">stage 11</text><title>check_btrfs_disk: the mkfs.btrfs fixture on the second disk mounted at /mnt and read back against its manifest, file by file.</title></g><g><rect class="dg-shape" x="18.6" y="2314" width="144.4" height="48" rx="4"/><text class="dg-text" x="90.8" y="2335" text-anchor="middle" font-size="12">stage12BtrfsWrite</text><text class="dg-text dg-sub" x="90.8" y="2349" text-anchor="middle" font-size="10.5">stage 12</text><title>check_btrfs_write: a blank volume on the third disk mounted writable, written, unmounted, mounted again and read back.</title></g><g><rect class="dg-shape" x="23.5" y="2408" width="130" height="34" rx="4"/><text class="dg-text" x="88.5" y="2429" text-anchor="middle" font-size="12">networkingCheck</text><title>check_net: the net core over the loopback in both families, then the net ring played from both ends and netlink&#x27;s dumps and changes.</title></g><g><rect class="dg-shape" x="31.7" y="2488" width="108.4" height="34" rx="4"/><text class="dg-text" x="85.9" y="2509" text-anchor="middle" font-size="12">finishMemory</text></g><g><rect class="dg-shape" x="25.5" y="2568" width="115.6" height="34" rx="4"/><text class="dg-text" x="83.3" y="2589" text-anchor="middle" font-size="12">reportSuccess</text></g><g><rect class="dg-shape" x="37.6" y="2648" width="86.8" height="34" rx="4"/><text class="dg-text" x="81" y="2669" text-anchor="middle" font-size="12">startInit</text><title>init::run (kernel/src/init.rs), after the marker on purpose: cargo xtask test-boot stops QEMU at the marker, so the boot test is the same whether or not a program is built in.</title></g><g><rect class="dg-shape" x="39.4" y="2728" width="79.6" height="34" rx="4"/><text class="dg-text" x="79.2" y="2749" text-anchor="middle" font-size="12">shutdown</text></g><g><rect class="dg-shape dg-terminal" x="41.2" y="2808" width="74" height="34" rx="17"/><text class="dg-text" x="78.2" y="2829" text-anchor="middle" font-size="12">done</text></g></svg>