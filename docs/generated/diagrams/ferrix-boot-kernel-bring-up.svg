<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 186.8 1676" width="186.8" height="1676" role="img" aria-label="Flow diagram: Kernel bring up. 21 nodes, 20 edges. Main path: start then validateHandoff then initConsole then reportHandoff then stage1SelfCheck then installTraps then initPhysicalMemory then initVmapArena then stage2SelfCheck then stage3TrapCheck then initInterrupts then initTimer."><title>Kernel bring up</title><style>
svg{
  --surface:#fff; --surface-2:#f6f7f8; --sunk:#e4e7ea;
  --ink:#16191d; --ink-2:#3b434c; --muted:#6a737e;
  --rule:#d2d7dc; --rule-strong:#b3bbc3;
  --implemented:#2c6e4e; --implemented-bg:#dceae2;
  --inProgress:#2a5f8f; --inProgress-bg:#dae5f0;
  --writtenAhead:#6b4fa0; --writtenAhead-bg:#e5dff0;
  --planned:#6a737e; --planned-bg:#e4e7ea;
  --deferred:#87600b; --deferred-bg:#f3e8ce;
}
@media (prefers-color-scheme:dark){svg{
  --surface:#1a1e22; --surface-2:#21262b; --sunk:#0e1113;
  --ink:#e7eaed; --ink-2:#bfc6cd; --muted:#8d97a1;
  --rule:#2c3238; --rule-strong:#5a646e;
  --implemented:#6abf92; --implemented-bg:#16301f;
  --inProgress:#74acdb; --inProgress-bg:#122639;
  --writtenAhead:#a98fd8; --writtenAhead-bg:#241c38;
  --planned:#8d97a1; --planned-bg:#262b31;
  --deferred:#d9a83e; --deferred-bg:#2e2511;
}}

figure.diagram{margin:22px 0 26px; padding:0}
figure.diagram svg{display:block; max-width:100%; height:auto;
  background:var(--surface); border:1px solid var(--rule); border-radius:3px}
figure.diagram figcaption{margin-top:9px; font-size:13px; color:var(--muted); max-width:74ch}
figure.diagram figcaption .figname{color:var(--ink-2); font-weight:600}
.dg-text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:var(--ink)}
.dg-sub{fill:var(--muted)}
.dg-stereo{fill:var(--muted); letter-spacing:.02em}
.dg-row{fill:var(--ink-2)}
.dg-shape{fill:var(--surface-2); stroke:var(--rule-strong); stroke-width:1.1}
.dg-terminal{fill:var(--sunk); stroke:var(--rule-strong)}
.dg-note{fill:var(--surface-2); stroke:var(--rule); stroke-dasharray:3 2}
.dg-rule{stroke:var(--rule-strong); stroke-width:1}
.dg-cluster{fill:none; stroke:var(--rule); stroke-width:1; stroke-dasharray:4 3}
.dg-cluster-label{fill:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dg-edge{fill:none; stroke:var(--rule-strong); stroke-width:1.4}
.dg-edge-trace{stroke-dasharray:5 4}
.dg-edge-label{fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dg-edge-label-bg{fill:var(--surface); stroke:none}
.dg-head{fill:var(--rule-strong); stroke:none}
.dg-head-hollow{fill:var(--surface); stroke:var(--rule-strong); stroke-width:1.1}
.dg-legend{fill:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dg-mat-implemented{fill:var(--implemented-bg); stroke:var(--implemented)}
.dg-mat-inProgress{fill:var(--inProgress-bg); stroke:var(--inProgress)}
.dg-mat-writtenAhead{fill:var(--writtenAhead-bg); stroke:var(--writtenAhead)}
.dg-mat-planned{fill:var(--planned-bg); stroke:var(--planned)}
.dg-mat-deferred{fill:var(--deferred-bg); stroke:var(--deferred)}
a.dg-link{text-decoration:none}
</style><rect width="186.8" height="1676" fill="var(--surface)"/><defs><marker id="dg-ferrix-boot-kernel-bring-up-arrow" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-head" d="M0,0 L9,3.5 L0,7 L1.6,3.5 z"/></marker><marker id="dg-ferrix-boot-kernel-bring-up-open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-edge" d="M0.5,0.5 L9,4 L0.5,7.5"/></marker><marker id="dg-ferrix-boot-kernel-bring-up-hollow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-head-hollow" d="M0.5,0.5 L11,5 L0.5,9.5 z"/></marker><marker id="dg-ferrix-boot-kernel-bring-up-diamond" markerWidth="14" markerHeight="9" refX="0.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-head" d="M0.5,4.5 L7,0.5 L13.5,4.5 L7,8.5 z"/></marker></defs><path class="dg-edge" d="M95.2,48 L95.2,94" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M95.2,128 L95.2,174" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M95.2,208 L95.4,254" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M95.4,288 L95.6,334" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M95.6,368 L95.9,414" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M95.9,448 L96.1,494" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M96.1,528 L96.2,574" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M96.2,608 L96.3,654" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M96.3,688 L96.2,734" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M96.2,768 L96.2,814" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M96.2,848 L96.2,894" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M96.2,928 L96.3,974" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M96.3,1008 L96.3,1054" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M96.3,1088 L95.8,1134" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M95.8,1168 L94.9,1214" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M94.9,1248 L93.4,1294" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M93.4,1342 L91.5,1388" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M91.5,1422 L89.5,1468" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M89.5,1502 L87.8,1548" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><path class="dg-edge" d="M87.8,1582 L86.9,1628" marker-end="url(#dg-ferrix-boot-kernel-bring-up-arrow)"/><g><rect class="dg-shape dg-terminal" x="58.2" y="14" width="74" height="34" rx="17"/><text class="dg-text" x="95.2" y="35" text-anchor="middle" font-size="12">start</text></g><g><rect class="dg-shape" x="30.2" y="94" width="130" height="34" rx="4"/><text class="dg-text" x="95.2" y="115" text-anchor="middle" font-size="12">validateHandoff</text><title>Magic, version, arch and layout constants.</title></g><g><rect class="dg-shape" x="44.6" y="174" width="101.2" height="34" rx="4"/><text class="dg-text" x="95.2" y="195" text-anchor="middle" font-size="12">initConsole</text></g><g><rect class="dg-shape" x="37.6" y="254" width="115.6" height="34" rx="4"/><text class="dg-text" x="95.4" y="275" text-anchor="middle" font-size="12">reportHandoff</text></g><g><rect class="dg-shape" x="30.6" y="334" width="130" height="34" rx="4"/><text class="dg-text" x="95.6" y="355" text-anchor="middle" font-size="12">stage1SelfCheck</text></g><g><rect class="dg-shape" x="41.7" y="414" width="108.4" height="34" rx="4"/><text class="dg-text" x="95.9" y="435" text-anchor="middle" font-size="12">installTraps</text><title>Before anything can fault: until this runs the CPU still points at firmware&#x27;s handlers, which stopped existing at ExitBootServices.</title></g><g><rect class="dg-shape" x="20.3" y="494" width="151.6" height="34" rx="4"/><text class="dg-text" x="96.1" y="515" text-anchor="middle" font-size="12">initPhysicalMemory</text><title>mm::init: carve the per-frame array from the largest usable region inside the direct map, hand every usable frame to the buddy, start the heap.</title></g><g><rect class="dg-shape" x="38.4" y="574" width="115.6" height="34" rx="4"/><text class="dg-text" x="96.2" y="595" text-anchor="middle" font-size="12">initVmapArena</text></g><g><rect class="dg-shape" x="31.3" y="654" width="130" height="34" rx="4"/><text class="dg-text" x="96.3" y="675" text-anchor="middle" font-size="12">stage2SelfCheck</text></g><g><rect class="dg-shape" x="31.2" y="734" width="130" height="34" rx="4"/><text class="dg-text" x="96.2" y="755" text-anchor="middle" font-size="12">stage3TrapCheck</text></g><g><rect class="dg-shape" x="34.8" y="814" width="122.8" height="34" rx="4"/><text class="dg-text" x="96.2" y="835" text-anchor="middle" font-size="12">initInterrupts</text><title>arch::init_interrupts: controller and clocks, reported as &quot;clock&quot; and &quot;irqs&quot; lines.</title></g><g><rect class="dg-shape" x="52.8" y="894" width="86.8" height="34" rx="4"/><text class="dg-text" x="96.2" y="915" text-anchor="middle" font-size="12">initTimer</text></g><g><rect class="dg-shape" x="27.7" y="974" width="137.2" height="34" rx="4"/><text class="dg-text" x="96.3" y="995" text-anchor="middle" font-size="12">enableInterrupts</text></g><g><rect class="dg-shape" x="27.7" y="1054" width="137.2" height="34" rx="4"/><text class="dg-text" x="96.3" y="1075" text-anchor="middle" font-size="12">stage3TimerCheck</text></g><g><rect class="dg-shape" x="27.2" y="1134" width="137.2" height="34" rx="4"/><text class="dg-text" x="95.8" y="1155" text-anchor="middle" font-size="12">stage4Processors</text></g><g><rect class="dg-shape" x="29.9" y="1214" width="130" height="34" rx="4"/><text class="dg-text" x="94.9" y="1235" text-anchor="middle" font-size="12">stage5Scheduler</text><title>After stage 4 because it needs every processor it will schedule on, before finishMemory because the task stacks it takes and gives back are mappings the sweep has to see settled.</title></g><g><rect class="dg-shape" x="14" y="1294" width="158.8" height="48" rx="4"/><text class="dg-text" x="93.4" y="1315" text-anchor="middle" font-size="12">stage6MemoryObjects</text><text class="dg-text dg-sub" x="93.4" y="1329" text-anchor="middle" font-size="10.5">stage 6</text><title>Stage 6 so far: a reservation costs nothing until it is touched, and every frame an object was given comes back when it is dropped — the leak that would otherwise kill the machine an hour into a rustc build.</title></g><g><rect class="dg-shape" x="37.3" y="1388" width="108.4" height="34" rx="4"/><text class="dg-text" x="91.5" y="1409" text-anchor="middle" font-size="12">finishMemory</text></g><g><rect class="dg-shape" x="31.7" y="1468" width="115.6" height="34" rx="4"/><text class="dg-text" x="89.5" y="1489" text-anchor="middle" font-size="12">reportSuccess</text></g><g><rect class="dg-shape" x="48" y="1548" width="79.6" height="34" rx="4"/><text class="dg-text" x="87.8" y="1569" text-anchor="middle" font-size="12">shutdown</text></g><g><rect class="dg-shape dg-terminal" x="49.9" y="1628" width="74" height="34" rx="17"/><text class="dg-text" x="86.9" y="1649" text-anchor="middle" font-size="12">done</text></g></svg>