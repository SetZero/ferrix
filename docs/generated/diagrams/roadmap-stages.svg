<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 650.8 1956" width="650.8" height="1956" role="img" aria-label="Dependency diagram: The roadmap, stage by stage. 19 nodes, 19 edges. Most connected: S14  Stage 14 real time (3), S3  Stage 3 traps interrupts time (3), S4  Stage 4 SMP (3)."><title>The roadmap, stage by stage</title><style>
svg{
  --surface:#fff; --surface-2:#f6f7f8; --sunk:#e4e7ea;
  --ink:#16191d; --ink-2:#3b434c; --muted:#6a737e;
  --rule:#d2d7dc; --rule-strong:#b3bbc3;
  --implemented:#2c6e4e; --implemented-bg:#dceae2;
  --inProgress:#2a5f8f; --inProgress-bg:#dae5f0;
  --writtenAhead:#6b4fa0; --writtenAhead-bg:#e5dff0;
  --planned:#6a737e; --planned-bg:#e4e7ea;
  --deferred:#87600b; --deferred-bg:#f3e8ce;
}
@media (prefers-color-scheme:dark){svg{
  --surface:#1a1e22; --surface-2:#21262b; --sunk:#0e1113;
  --ink:#e7eaed; --ink-2:#bfc6cd; --muted:#8d97a1;
  --rule:#2c3238; --rule-strong:#5a646e;
  --implemented:#6abf92; --implemented-bg:#16301f;
  --inProgress:#74acdb; --inProgress-bg:#122639;
  --writtenAhead:#a98fd8; --writtenAhead-bg:#241c38;
  --planned:#8d97a1; --planned-bg:#262b31;
  --deferred:#d9a83e; --deferred-bg:#2e2511;
}}

figure.diagram{margin:22px 0 26px; padding:0}
figure.diagram svg{display:block; max-width:100%; height:auto;
  background:var(--surface); border:1px solid var(--rule); border-radius:3px}
figure.diagram figcaption{margin-top:9px; font-size:13px; color:var(--muted); max-width:74ch}
figure.diagram figcaption .figname{color:var(--ink-2); font-weight:600}
.dg-text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:var(--ink)}
.dg-sub{fill:var(--muted)}
.dg-stereo{fill:var(--muted); letter-spacing:.02em}
.dg-row{fill:var(--ink-2)}
.dg-shape{fill:var(--surface-2); stroke:var(--rule-strong); stroke-width:1.1}
.dg-terminal{fill:var(--sunk); stroke:var(--rule-strong)}
.dg-note{fill:var(--surface-2); stroke:var(--rule); stroke-dasharray:3 2}
.dg-rule{stroke:var(--rule-strong); stroke-width:1}
.dg-cluster{fill:none; stroke:var(--rule); stroke-width:1; stroke-dasharray:4 3}
.dg-cluster-label{fill:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dg-edge{fill:none; stroke:var(--rule-strong); stroke-width:1.4}
.dg-edge-trace{stroke-dasharray:5 4}
.dg-edge-label{fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dg-edge-label-bg{fill:var(--surface); stroke:none}
.dg-head{fill:var(--rule-strong); stroke:none}
.dg-head-hollow{fill:var(--surface); stroke:var(--rule-strong); stroke-width:1.1}
.dg-legend{fill:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dg-mat-implemented{fill:var(--implemented-bg); stroke:var(--implemented)}
.dg-mat-inProgress{fill:var(--inProgress-bg); stroke:var(--inProgress)}
.dg-mat-writtenAhead{fill:var(--writtenAhead-bg); stroke:var(--writtenAhead)}
.dg-mat-planned{fill:var(--planned-bg); stroke:var(--planned)}
.dg-mat-deferred{fill:var(--deferred-bg); stroke:var(--deferred)}
a.dg-link{text-decoration:none}
</style><rect width="650.8" height="1956" fill="var(--surface)"/><defs><marker id="dg-roadmap-stages-arrow" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-head" d="M0,0 L9,3.5 L0,7 L1.6,3.5 z"/></marker><marker id="dg-roadmap-stages-open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-edge" d="M0.5,0.5 L9,4 L0.5,7.5"/></marker><marker id="dg-roadmap-stages-hollow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-head-hollow" d="M0.5,0.5 L11,5 L0.5,9.5 z"/></marker><marker id="dg-roadmap-stages-diamond" markerWidth="14" markerHeight="9" refX="0.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-head" d="M0.5,4.5 L7,0.5 L13.5,4.5 L7,8.5 z"/></marker></defs><path class="dg-edge dg-edge-trace" d="M336.4,76 L336.4,122" marker-end="url(#dg-roadmap-stages-open)"/><path class="dg-edge dg-edge-trace" d="M336.4,184 L315.7,230" marker-end="url(#dg-roadmap-stages-open)"/><path class="dg-edge dg-edge-trace" d="M315.7,292 L281.3,338" marker-end="url(#dg-roadmap-stages-open)"/><path class="dg-edge dg-edge-trace" d="M281.3,400 L185.8,446" marker-end="url(#dg-roadmap-stages-open)"/><path class="dg-edge dg-edge-trace" d="M185.8,508 L142.7,554" marker-end="url(#dg-roadmap-stages-open)"/><path class="dg-edge dg-edge-trace" d="M142.7,616 L168.7,662" marker-end="url(#dg-roadmap-stages-open)"/><path class="dg-edge dg-edge-trace" d="M281.3,400 L267.6,468.2 Q265.8,477 264.1,485.8 L246.1,576.2 Q244.3,585 238,591.4 L168.7,662" marker-end="url(#dg-roadmap-stages-open)"/><path class="dg-edge dg-edge-trace" d="M168.7,724 L166.1,770" marker-end="url(#dg-roadmap-stages-open)"/><path class="dg-edge dg-edge-trace" d="M166.1,832 L175.7,878" marker-end="url(#dg-roadmap-stages-open)"/><path class="dg-edge dg-edge-trace" d="M175.7,940 L161.2,986" marker-end="url(#dg-roadmap-stages-open)"/><path class="dg-edge dg-edge-trace" d="M161.2,1048 L136.6,1094" marker-end="url(#dg-roadmap-stages-open)"/><path class="dg-edge dg-edge-trace" d="M136.6,1156 L152.9,1202" marker-end="url(#dg-roadmap-stages-open)"/><path class="dg-edge dg-edge-trace" d="M152.9,1264 L158.2,1310" marker-end="url(#dg-roadmap-stages-open)"/><path class="dg-edge dg-edge-trace" d="M158.2,1372 L170.2,1418" marker-end="url(#dg-roadmap-stages-open)"/><path class="dg-edge dg-edge-trace" d="M170.2,1480 L278.6,1526" marker-end="url(#dg-roadmap-stages-open)"/><path class="dg-edge dg-edge-trace" d="M185.8,508 L246.5,578.2 Q252.3,585 253.8,593.9 L268.9,684.1 Q270.3,693 270.1,702 L267.9,792 Q267.7,801 266.7,809.9 L256.7,900.1 Q255.7,909 256.6,918 L265.5,1008 Q266.4,1017 267.1,1026 L273.6,1116 Q274.2,1125 273.5,1134 L266,1224 Q265.3,1233 266,1242 L273.4,1332 Q274.2,1341 274.6,1350 L278.6,1440 Q279,1449 279,1458 L278.6,1526" marker-end="url(#dg-roadmap-stages-open)"/><path class="dg-edge dg-edge-trace" d="M278.6,1588 L332.5,1634" marker-end="url(#dg-roadmap-stages-open)"/><path class="dg-edge dg-edge-trace" d="M332.5,1696 L353.3,1742" marker-end="url(#dg-roadmap-stages-open)"/><path class="dg-edge dg-edge-trace" d="M353.3,1804 L362.8,1850" marker-end="url(#dg-roadmap-stages-open)"/><g><rect class="dg-shape dg-mat-implemented" x="246.2" y="14" width="180.4" height="62" rx="4"/><text class="dg-text dg-stereo" x="336.4" y="33" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="336.4" y="49" text-anchor="middle" font-size="12">S0  Stage 0 foundation</text><text class="dg-text dg-sub" x="336.4" y="63" text-anchor="middle" font-size="10.5">Done · weekend</text><title>Workspace, the quality gates ported from Starling, CI, the first host-testable libraries.</title></g><g><rect class="dg-shape dg-mat-implemented" x="499.6" y="14" width="137.2" height="62" rx="4"/><text class="dg-text dg-stereo" x="568.2" y="33" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="568.2" y="49" text-anchor="middle" font-size="12">SA  ARMv7-A port</text><text class="dg-text dg-sub" x="568.2" y="63" text-anchor="middle" font-size="10.5">Done · month</text><title>The third architecture, joined after stage 3 and brought through stage 4: the same loader converted ELF to PE32, a 32-bit layout argued rather than shrunk, LPAE as a paging geometry, device tree only, traps without mode stacks.</title></g><g><rect class="dg-shape dg-mat-implemented" x="267.8" y="122" width="137.2" height="62" rx="4"/><text class="dg-text dg-stereo" x="336.4" y="141" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="336.4" y="157" text-anchor="middle" font-size="12">S1  Stage 1 boot</text><text class="dg-text dg-sub" x="336.4" y="171" text-anchor="middle" font-size="10.5">Done · week</text><title>UEFI loader in Rust to a kernel Rust entry point, zero bootstrap assembly.</title></g><g><rect class="dg-shape dg-mat-implemented" x="239.9" y="230" width="151.6" height="62" rx="4"/><text class="dg-text dg-stereo" x="315.7" y="249" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="315.7" y="265" text-anchor="middle" font-size="12">S2  Stage 2 memory</text><text class="dg-text dg-sub" x="315.7" y="279" text-anchor="middle" font-size="10.5">Done · week</text><title>Buddy allocator, heap, vmap arena with guard pages and stacks, identity map dropped, W^X sweep, boot memory reclaimed, empty slab pages returned.</title></g><g><rect class="dg-shape dg-mat-implemented" x="151.5" y="338" width="259.6" height="62" rx="4"/><text class="dg-text dg-stereo" x="281.3" y="357" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="281.3" y="373" text-anchor="middle" font-size="12">S3  Stage 3 traps interrupts time</text><text class="dg-text dg-sub" x="281.3" y="387" text-anchor="middle" font-size="10.5">Done · week</text><title>Vectors on every architecture, one dispatch above them; LAPIC, I/O APIC, HPET (TSC/PIT fallback); GICv2 and the architected virtual timer; the facade&#x27;s irq::register, timer::after and trap::Frame.</title></g><g><rect class="dg-shape dg-mat-implemented" x="120.8" y="446" width="130" height="62" rx="4"/><text class="dg-text dg-stereo" x="185.8" y="465" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="185.8" y="481" text-anchor="middle" font-size="12">S4  Stage 4 SMP</text><text class="dg-text dg-sub" x="185.8" y="495" text-anchor="middle" font-size="10.5">Done · week</text><title>Every processor online: INIT-SIPI-SIPI and a real-mode trampoline, PSCI CPU_ON through an identity map of the entry; a record per processor; every &quot;one CPU&quot; global now a lock; IPIs; TLB shootdown where hardware does not broadcast; grace periods.</title></g><g><rect class="dg-shape dg-mat-implemented" x="56.1" y="554" width="173.2" height="62" rx="4"/><text class="dg-text dg-stereo" x="142.7" y="573" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="142.7" y="589" text-anchor="middle" font-size="12">S5  Stage 5 scheduler</text><text class="dg-text dg-sub" x="142.7" y="603" text-anchor="middle" font-size="10.5">Done · week</text><title>Task, kernel stacks, context switch, per-CPU runqueues, the class stack, EEVDF in libs/sched.</title></g><g><rect class="dg-shape dg-mat-implemented" x="82.1" y="662" width="173.2" height="62" rx="4"/><text class="dg-text dg-stereo" x="168.7" y="681" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="168.7" y="697" text-anchor="middle" font-size="12">S6  Stage 6 user mode</text><text class="dg-text dg-sub" x="168.7" y="711" text-anchor="middle" font-size="10.5">Done · week</text><title>AddressSpace, VMOs, the VMA tree as a process map, demand paging, copy-on-write, the ELF loader, the ring-3/EL0/USR transition.</title></g><g><rect class="dg-shape dg-mat-implemented" x="79.5" y="770" width="173.2" height="62" rx="4"/><text class="dg-text dg-stereo" x="166.1" y="789" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="166.1" y="805" text-anchor="middle" font-size="12">S7  Stage 7 Linux ABI</text><text class="dg-text dg-sub" x="166.1" y="819" text-anchor="middle" font-size="10.5">Done · month</text><title>Syscall entry on every architecture, the dispatch table, the core surface: memory, files, process, threads and futex, signals with sigaltstack and rt_sigreturn, time, identity.</title></g><g><rect class="dg-shape dg-mat-planned" x="110.7" y="878" width="130" height="62" rx="4"/><text class="dg-text dg-stereo" x="175.7" y="897" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="175.7" y="913" text-anchor="middle" font-size="12">S8  Stage 8 VFS</text><text class="dg-text dg-sub" x="175.7" y="927" text-anchor="middle" font-size="10.5">Planned · month</text><title>Inode and dentry caches, the mount table, fd sharing rules, tmpfs, devfs, procfs, cpio initramfs.</title></g><g><rect class="dg-shape dg-mat-inProgress" x="71" y="986" width="180.4" height="62" rx="4"/><text class="dg-text dg-stereo" x="161.2" y="1005" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="161.2" y="1021" text-anchor="middle" font-size="12">S9  Stage 9 native ABI</text><text class="dg-text dg-sub" x="161.2" y="1035" text-anchor="middle" font-size="10.5">InProgress · week</text><title>Handle tables, Channel with handle passing, Port, Interrupt, IoMapping, Job; the 0x1000 syscalls.</title></g><g><rect class="dg-shape dg-mat-planned" x="14" y="1094" width="245.2" height="62" rx="4"/><text class="dg-text dg-stereo" x="136.6" y="1113" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="136.6" y="1129" text-anchor="middle" font-size="12">S10  Stage 10 userspace drivers</text><text class="dg-text dg-sub" x="136.6" y="1143" text-anchor="middle" font-size="10.5">Planned · month</text><title>Enumeration, IOMMU domains, devmgr, the shared-ring block protocol, virtio-blk as a user process.</title></g><g><rect class="dg-shape dg-mat-planned" x="55.5" y="1202" width="194.8" height="62" rx="4"/><text class="dg-text dg-stereo" x="152.9" y="1221" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="152.9" y="1237" text-anchor="middle" font-size="12">S11  Stage 11 btrfs read</text><text class="dg-text dg-sub" x="152.9" y="1251" text-anchor="middle" font-size="10.5">Planned · month</text><title>Block core, then btrfs stage A.</title></g><g><rect class="dg-shape dg-mat-planned" x="57.2" y="1310" width="202" height="62" rx="4"/><text class="dg-text dg-stereo" x="158.2" y="1329" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="158.2" y="1345" text-anchor="middle" font-size="12">S12  Stage 12 btrfs write</text><text class="dg-text dg-sub" x="158.2" y="1359" text-anchor="middle" font-size="10.5">Planned · longer</text><title>btrfs stage B.</title></g><g><rect class="dg-shape dg-mat-planned" x="76.4" y="1418" width="187.6" height="62" rx="4"/><text class="dg-text dg-stereo" x="170.2" y="1437" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="170.2" y="1453" text-anchor="middle" font-size="12">S13  Stage 13 isolation</text><text class="dg-text dg-sub" x="170.2" y="1467" text-anchor="middle" font-size="10.5">Planned · month</text><title>All eight namespaces, the unified cgroup hierarchy with cpu, memory, io and pids, cgroupfs, classic-BPF seccomp with the interpreter in libs/.</title></g><g><rect class="dg-shape dg-mat-planned" x="184.8" y="1526" width="187.6" height="62" rx="4"/><text class="dg-text dg-stereo" x="278.6" y="1545" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="278.6" y="1561" text-anchor="middle" font-size="12">S14  Stage 14 real time</text><text class="dg-text dg-sub" x="278.6" y="1575" text-anchor="middle" font-size="10.5">Planned · month</text><title>SoftRt and HardRt: FIFO/RR, threaded interrupts, PI mutexes, EDF with CBS admission, the runtime mode switch with its quiescence protocol.</title></g><g><rect class="dg-shape dg-mat-planned" x="242.3" y="1634" width="180.4" height="62" rx="4"/><text class="dg-text dg-stereo" x="332.5" y="1653" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="332.5" y="1669" text-anchor="middle" font-size="12">S15  Stage 15 userland</text><text class="dg-text dg-sub" x="332.5" y="1683" text-anchor="middle" font-size="10.5">Planned · week</text><title>Static musl busybox as /bin, a working init, job control, ttys, pipes.</title></g><g><rect class="dg-shape dg-mat-planned" x="273.9" y="1742" width="158.8" height="62" rx="4"/><text class="dg-text dg-stereo" x="353.3" y="1761" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="353.3" y="1777" text-anchor="middle" font-size="12">S16  Stage 16 rustc</text><text class="dg-text dg-sub" x="353.3" y="1791" text-anchor="middle" font-size="10.5">Planned · the goal</text><title>The remaining syscall surface, the memory scale, the spawn path for rust-lld, a sysroot on btrfs.</title></g><g><rect class="dg-shape dg-mat-planned" x="258.2" y="1850" width="209.2" height="62" rx="4"/><text class="dg-text dg-stereo" x="362.8" y="1869" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="362.8" y="1885" text-anchor="middle" font-size="12">S17  Stage 17 self hosting</text><text class="dg-text dg-sub" x="362.8" y="1899" text-anchor="middle" font-size="10.5">Planned · longer</text><title>Build Ferrix on Ferrix; the image the hosted compiler produces boots and passes every test above.</title></g><rect class="dg-shape dg-mat-implemented" x="14" y="1934" width="11" height="11" rx="2"/><text class="dg-text dg-legend" x="30" y="1943.5" font-size="10">implemented</text><rect class="dg-shape dg-mat-planned" x="112" y="1934" width="11" height="11" rx="2"/><text class="dg-text dg-legend" x="128" y="1943.5" font-size="10">planned</text><rect class="dg-shape dg-mat-inProgress" x="186" y="1934" width="11" height="11" rx="2"/><text class="dg-text dg-legend" x="202" y="1943.5" font-size="10">in progress</text></svg>