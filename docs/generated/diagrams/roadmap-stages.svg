<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 771.3 1956" width="771.3" height="1956" role="img" aria-label="Dependency diagram: The roadmap, stage by stage. 20 nodes, 21 edges. Most connected: S10  Stage 10 userspace drivers (3), S11  Stage 11 btrfs read (3), S14  Stage 14 real time (3)."><title>The roadmap, stage by stage</title><style>
svg{
  --surface:#fff; --surface-2:#f6f7f8; --sunk:#e4e7ea;
  --ink:#16191d; --ink-2:#3b434c; --muted:#6a737e;
  --rule:#d2d7dc; --rule-strong:#b3bbc3;
  --implemented:#2c6e4e; --implemented-bg:#dceae2;
  --inProgress:#2a5f8f; --inProgress-bg:#dae5f0;
  --writtenAhead:#6b4fa0; --writtenAhead-bg:#e5dff0;
  --planned:#6a737e; --planned-bg:#e4e7ea;
  --deferred:#87600b; --deferred-bg:#f3e8ce;
}
@media (prefers-color-scheme:dark){svg{
  --surface:#1a1e22; --surface-2:#21262b; --sunk:#0e1113;
  --ink:#e7eaed; --ink-2:#bfc6cd; --muted:#8d97a1;
  --rule:#2c3238; --rule-strong:#5a646e;
  --implemented:#6abf92; --implemented-bg:#16301f;
  --inProgress:#74acdb; --inProgress-bg:#122639;
  --writtenAhead:#a98fd8; --writtenAhead-bg:#241c38;
  --planned:#8d97a1; --planned-bg:#262b31;
  --deferred:#d9a83e; --deferred-bg:#2e2511;
}}

figure.diagram{margin:22px 0 26px; padding:0}
figure.diagram svg{display:block; max-width:100%; height:auto;
  background:var(--surface); border:1px solid var(--rule); border-radius:3px}
figure.diagram figcaption{margin-top:9px; font-size:13px; color:var(--muted); max-width:74ch}
figure.diagram figcaption .figname{color:var(--ink-2); font-weight:600}
.dg-text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:var(--ink)}
.dg-sub{fill:var(--muted)}
.dg-stereo{fill:var(--muted); letter-spacing:.02em}
.dg-row{fill:var(--ink-2)}
.dg-shape{fill:var(--surface-2); stroke:var(--rule-strong); stroke-width:1.1}
.dg-terminal{fill:var(--sunk); stroke:var(--rule-strong)}
.dg-note{fill:var(--surface-2); stroke:var(--rule); stroke-dasharray:3 2}
.dg-rule{stroke:var(--rule-strong); stroke-width:1}
.dg-cluster{fill:none; stroke:var(--rule); stroke-width:1; stroke-dasharray:4 3}
.dg-cluster-label{fill:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dg-edge{fill:none; stroke:var(--rule-strong); stroke-width:1.4}
.dg-edge-trace{stroke-dasharray:5 4}
.dg-edge-label{fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dg-edge-label-bg{fill:var(--surface); stroke:none}
.dg-head{fill:var(--rule-strong); stroke:none}
.dg-head-hollow{fill:var(--surface); stroke:var(--rule-strong); stroke-width:1.1}
.dg-legend{fill:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dg-mat-implemented{fill:var(--implemented-bg); stroke:var(--implemented)}
.dg-mat-inProgress{fill:var(--inProgress-bg); stroke:var(--inProgress)}
.dg-mat-writtenAhead{fill:var(--writtenAhead-bg); stroke:var(--writtenAhead)}
.dg-mat-planned{fill:var(--planned-bg); stroke:var(--planned)}
.dg-mat-deferred{fill:var(--deferred-bg); stroke:var(--deferred)}
a.dg-link{text-decoration:none}
</style><rect width="771.3" height="1956" fill="var(--surface)"/><defs><marker id="dg-roadmap-stages-arrow" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-head" d="M0,0 L9,3.5 L0,7 L1.6,3.5 z"/></marker><marker id="dg-roadmap-stages-open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-edge" d="M0.5,0.5 L9,4 L0.5,7.5"/></marker><marker id="dg-roadmap-stages-hollow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-head-hollow" d="M0.5,0.5 L11,5 L0.5,9.5 z"/></marker><marker id="dg-roadmap-stages-diamond" markerWidth="14" markerHeight="9" refX="0.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-head" d="M0.5,4.5 L7,0.5 L13.5,4.5 L7,8.5 z"/></marker></defs><path class="dg-edge dg-edge-trace" d="M456.3,76 L456.3,122" marker-end="url(#dg-roadmap-stages-open)"/><path class="dg-edge dg-edge-trace" d="M456.3,184 L434.8,230" marker-end="url(#dg-roadmap-stages-open)"/><path class="dg-edge dg-edge-trace" d="M434.8,292 L398.7,338" marker-end="url(#dg-roadmap-stages-open)"/><path class="dg-edge dg-edge-trace" d="M398.7,400 L300.8,446" marker-end="url(#dg-roadmap-stages-open)"/><path class="dg-edge dg-edge-trace" d="M300.8,508 L252.2,554" marker-end="url(#dg-roadmap-stages-open)"/><path class="dg-edge dg-edge-trace" d="M252.2,616 L274.3,662" marker-end="url(#dg-roadmap-stages-open)"/><path class="dg-edge dg-edge-trace" d="M398.7,400 L382.8,468.2 Q380.8,477 378.6,485.7 L356,576.3 Q353.8,585 347.3,591.3 L274.3,662" marker-end="url(#dg-roadmap-stages-open)"/><path class="dg-edge dg-edge-trace" d="M274.3,724 L271.1,770" marker-end="url(#dg-roadmap-stages-open)"/><path class="dg-edge dg-edge-trace" d="M271.1,832 L281.1,878" marker-end="url(#dg-roadmap-stages-open)"/><path class="dg-edge dg-edge-trace" d="M281.1,940 L267.5,986" marker-end="url(#dg-roadmap-stages-open)"/><path class="dg-edge dg-edge-trace" d="M267.5,1048 L244.5,1094" marker-end="url(#dg-roadmap-stages-open)"/><path class="dg-edge dg-edge-trace" d="M244.5,1156 L235.7,1202" marker-end="url(#dg-roadmap-stages-open)"/><path class="dg-edge dg-edge-trace" d="M235.7,1264 L321,1310" marker-end="url(#dg-roadmap-stages-open)"/><path class="dg-edge dg-edge-trace" d="M244.5,1156 L340.9,1227.6 Q348.1,1233 345.1,1241.5 L321,1310" marker-end="url(#dg-roadmap-stages-open)"/><path class="dg-edge dg-edge-trace" d="M235.7,1264 L115,1310" marker-end="url(#dg-roadmap-stages-open)"/><path class="dg-edge dg-edge-trace" d="M115,1372 L244.5,1418" marker-end="url(#dg-roadmap-stages-open)"/><path class="dg-edge dg-edge-trace" d="M244.5,1480 L364.4,1526" marker-end="url(#dg-roadmap-stages-open)"/><path class="dg-edge dg-edge-trace" d="M300.8,508 L356.2,577.9 Q361.8,585 363,593.9 L374.8,684.1 Q375.9,693 375.7,702 L372.9,792 Q372.7,801 371.7,809.9 L362,900.1 Q361.1,909 362,917.9 L371.7,1008.1 Q372.7,1017 373.4,1026 L381.3,1116 Q382.1,1125 380,1133.8 L358.2,1224.2 Q356.1,1233 360.6,1240.8 L414.5,1333.2 Q419,1341 414.3,1348.7 L358,1441.3 Q353.3,1449 354.6,1457.9 L364.4,1526" marker-end="url(#dg-roadmap-stages-open)"/><path class="dg-edge dg-edge-trace" d="M364.4,1588 L429.2,1634" marker-end="url(#dg-roadmap-stages-open)"/><path class="dg-edge dg-edge-trace" d="M429.2,1696 L457.9,1742" marker-end="url(#dg-roadmap-stages-open)"/><path class="dg-edge dg-edge-trace" d="M457.9,1804 L471.1,1850" marker-end="url(#dg-roadmap-stages-open)"/><g><rect class="dg-shape dg-mat-implemented" x="366.1" y="14" width="180.4" height="62" rx="4"/><text class="dg-text dg-stereo" x="456.3" y="33" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="456.3" y="49" text-anchor="middle" font-size="12">S0  Stage 0 foundation</text><text class="dg-text dg-sub" x="456.3" y="63" text-anchor="middle" font-size="10.5">Done · weekend</text><title>Workspace, the quality gates ported from Starling, CI, the first host-testable libraries.</title></g><g><rect class="dg-shape dg-mat-implemented" x="620.1" y="14" width="137.2" height="62" rx="4"/><text class="dg-text dg-stereo" x="688.7" y="33" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="688.7" y="49" text-anchor="middle" font-size="12">SA  ARMv7-A port</text><text class="dg-text dg-sub" x="688.7" y="63" text-anchor="middle" font-size="10.5">Done · month</text><title>The third architecture, joined after stage 3 and brought through stage 4: the same loader converted ELF to PE32, a 32-bit layout argued rather than shrunk, LPAE as a paging geometry, device tree only, traps without mode stacks.</title></g><g><rect class="dg-shape dg-mat-implemented" x="387.7" y="122" width="137.2" height="62" rx="4"/><text class="dg-text dg-stereo" x="456.3" y="141" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="456.3" y="157" text-anchor="middle" font-size="12">S1  Stage 1 boot</text><text class="dg-text dg-sub" x="456.3" y="171" text-anchor="middle" font-size="10.5">Done · week</text><title>UEFI loader in Rust to a kernel Rust entry point, zero bootstrap assembly.</title></g><g><rect class="dg-shape dg-mat-implemented" x="359" y="230" width="151.6" height="62" rx="4"/><text class="dg-text dg-stereo" x="434.8" y="249" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="434.8" y="265" text-anchor="middle" font-size="12">S2  Stage 2 memory</text><text class="dg-text dg-sub" x="434.8" y="279" text-anchor="middle" font-size="10.5">Done · week</text><title>Buddy allocator, heap, vmap arena with guard pages and stacks, identity map dropped, W^X sweep, boot memory reclaimed, empty slab pages returned.</title></g><g><rect class="dg-shape dg-mat-implemented" x="268.9" y="338" width="259.6" height="62" rx="4"/><text class="dg-text dg-stereo" x="398.7" y="357" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="398.7" y="373" text-anchor="middle" font-size="12">S3  Stage 3 traps interrupts time</text><text class="dg-text dg-sub" x="398.7" y="387" text-anchor="middle" font-size="10.5">Done · week</text><title>Vectors on every architecture, one dispatch above them; LAPIC, I/O APIC, HPET (TSC/PIT fallback); GICv2 and the architected virtual timer; the facade&#x27;s irq::register, timer::after and trap::Frame.</title></g><g><rect class="dg-shape dg-mat-implemented" x="235.8" y="446" width="130" height="62" rx="4"/><text class="dg-text dg-stereo" x="300.8" y="465" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="300.8" y="481" text-anchor="middle" font-size="12">S4  Stage 4 SMP</text><text class="dg-text dg-sub" x="300.8" y="495" text-anchor="middle" font-size="10.5">Done · week</text><title>Every processor online: INIT-SIPI-SIPI and a real-mode trampoline, PSCI CPU_ON through an identity map of the entry; a record per processor; every &quot;one CPU&quot; global now a lock; IPIs; TLB shootdown where hardware does not broadcast; grace periods.</title></g><g><rect class="dg-shape dg-mat-implemented" x="165.6" y="554" width="173.2" height="62" rx="4"/><text class="dg-text dg-stereo" x="252.2" y="573" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="252.2" y="589" text-anchor="middle" font-size="12">S5  Stage 5 scheduler</text><text class="dg-text dg-sub" x="252.2" y="603" text-anchor="middle" font-size="10.5">Done · week</text><title>Task, kernel stacks, context switch, per-CPU runqueues, the class stack, EEVDF in libs/sched.</title></g><g><rect class="dg-shape dg-mat-implemented" x="187.7" y="662" width="173.2" height="62" rx="4"/><text class="dg-text dg-stereo" x="274.3" y="681" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="274.3" y="697" text-anchor="middle" font-size="12">S6  Stage 6 user mode</text><text class="dg-text dg-sub" x="274.3" y="711" text-anchor="middle" font-size="10.5">Done · week</text><title>AddressSpace, VMOs, the VMA tree as a process map, demand paging, copy-on-write, the ELF loader, the ring-3/EL0/USR transition.</title></g><g><rect class="dg-shape dg-mat-implemented" x="184.5" y="770" width="173.2" height="62" rx="4"/><text class="dg-text dg-stereo" x="271.1" y="789" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="271.1" y="805" text-anchor="middle" font-size="12">S7  Stage 7 Linux ABI</text><text class="dg-text dg-sub" x="271.1" y="819" text-anchor="middle" font-size="10.5">Done · month</text><title>Syscall entry on every architecture, the dispatch table, the core surface: memory, files, process, threads and futex, signals with sigaltstack and rt_sigreturn, time, identity.</title></g><g><rect class="dg-shape dg-mat-implemented" x="216.1" y="878" width="130" height="62" rx="4"/><text class="dg-text dg-stereo" x="281.1" y="897" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="281.1" y="913" text-anchor="middle" font-size="12">S8  Stage 8 VFS</text><text class="dg-text dg-sub" x="281.1" y="927" text-anchor="middle" font-size="10.5">Done · month</text><title>Inode and dentry caches, the mount table, fd sharing rules, tmpfs, devfs, procfs, cpio initramfs.</title></g><g><rect class="dg-shape dg-mat-implemented" x="177.3" y="986" width="180.4" height="62" rx="4"/><text class="dg-text dg-stereo" x="267.5" y="1005" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="267.5" y="1021" text-anchor="middle" font-size="12">S9  Stage 9 native ABI</text><text class="dg-text dg-sub" x="267.5" y="1035" text-anchor="middle" font-size="10.5">Done · week</text><title>Handle tables, Channel with handle passing, Port, Interrupt, IoMapping, Job; the 0x1000 syscalls.</title></g><g><rect class="dg-shape dg-mat-inProgress" x="121.9" y="1094" width="245.2" height="62" rx="4"/><text class="dg-text dg-stereo" x="244.5" y="1113" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="244.5" y="1129" text-anchor="middle" font-size="12">S10  Stage 10 userspace drivers</text><text class="dg-text dg-sub" x="244.5" y="1143" text-anchor="middle" font-size="10.5">InProgress · month</text><title>Enumeration, IOMMU domains, devmgr, the shared-ring block protocol, virtio-blk as a user process.</title></g><g><rect class="dg-shape dg-mat-planned" x="138.3" y="1202" width="194.8" height="62" rx="4"/><text class="dg-text dg-stereo" x="235.7" y="1221" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="235.7" y="1237" text-anchor="middle" font-size="12">S11  Stage 11 btrfs read</text><text class="dg-text dg-sub" x="235.7" y="1251" text-anchor="middle" font-size="10.5">Planned · month</text><title>Block core, then btrfs stage A.</title></g><g><rect class="dg-shape dg-mat-planned" x="14" y="1310" width="202" height="62" rx="4"/><text class="dg-text dg-stereo" x="115" y="1329" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="115" y="1345" text-anchor="middle" font-size="12">S12  Stage 12 btrfs write</text><text class="dg-text dg-sub" x="115" y="1359" text-anchor="middle" font-size="10.5">Planned · longer</text><title>btrfs stage B.</title></g><g><rect class="dg-shape dg-mat-planned" x="238" y="1310" width="166" height="62" rx="4"/><text class="dg-text dg-stereo" x="321" y="1329" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="321" y="1345" text-anchor="middle" font-size="12">SN  Stage networking</text><text class="dg-text dg-sub" x="321" y="1359" text-anchor="middle" font-size="10.5">Planned · month</text><title>Placed after stage 11 without a number of its own, as the ARMv7-A port sits after stage 4.</title></g><g><rect class="dg-shape dg-mat-planned" x="150.7" y="1418" width="187.6" height="62" rx="4"/><text class="dg-text dg-stereo" x="244.5" y="1437" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="244.5" y="1453" text-anchor="middle" font-size="12">S13  Stage 13 isolation</text><text class="dg-text dg-sub" x="244.5" y="1467" text-anchor="middle" font-size="10.5">Planned · month</text><title>All eight namespaces, the unified cgroup hierarchy with cpu, memory, io and pids, cgroupfs, classic-BPF seccomp with the interpreter in libs/.</title></g><g><rect class="dg-shape dg-mat-planned" x="270.6" y="1526" width="187.6" height="62" rx="4"/><text class="dg-text dg-stereo" x="364.4" y="1545" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="364.4" y="1561" text-anchor="middle" font-size="12">S14  Stage 14 real time</text><text class="dg-text dg-sub" x="364.4" y="1575" text-anchor="middle" font-size="10.5">Planned · month</text><title>SoftRt and HardRt: FIFO/RR, threaded interrupts, PI mutexes, EDF with CBS admission, the runtime mode switch with its quiescence protocol.</title></g><g><rect class="dg-shape dg-mat-planned" x="339" y="1634" width="180.4" height="62" rx="4"/><text class="dg-text dg-stereo" x="429.2" y="1653" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="429.2" y="1669" text-anchor="middle" font-size="12">S15  Stage 15 userland</text><text class="dg-text dg-sub" x="429.2" y="1683" text-anchor="middle" font-size="10.5">Planned · week</text><title>Static musl busybox as /bin, a working init, job control, ttys, pipes.</title></g><g><rect class="dg-shape dg-mat-planned" x="378.5" y="1742" width="158.8" height="62" rx="4"/><text class="dg-text dg-stereo" x="457.9" y="1761" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="457.9" y="1777" text-anchor="middle" font-size="12">S16  Stage 16 rustc</text><text class="dg-text dg-sub" x="457.9" y="1791" text-anchor="middle" font-size="10.5">Planned · the goal</text><title>The remaining syscall surface, the memory scale, the spawn path for rust-lld, a sysroot on btrfs.</title></g><g><rect class="dg-shape dg-mat-planned" x="366.5" y="1850" width="209.2" height="62" rx="4"/><text class="dg-text dg-stereo" x="471.1" y="1869" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="471.1" y="1885" text-anchor="middle" font-size="12">S17  Stage 17 self hosting</text><text class="dg-text dg-sub" x="471.1" y="1899" text-anchor="middle" font-size="10.5">Planned · longer</text><title>Build Ferrix on Ferrix; the image the hosted compiler produces boots and passes every test above.</title></g><rect class="dg-shape dg-mat-implemented" x="14" y="1934" width="11" height="11" rx="2"/><text class="dg-text dg-legend" x="30" y="1943.5" font-size="10">implemented</text><rect class="dg-shape dg-mat-inProgress" x="112" y="1934" width="11" height="11" rx="2"/><text class="dg-text dg-legend" x="128" y="1943.5" font-size="10">in progress</text><rect class="dg-shape dg-mat-planned" x="210" y="1934" width="11" height="11" rx="2"/><text class="dg-text dg-legend" x="226" y="1943.5" font-size="10">planned</text></svg>