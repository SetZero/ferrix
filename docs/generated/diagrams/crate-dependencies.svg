<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 438 1203.1" width="438" height="1203.1" role="img" aria-label="Dependency diagram: The crate graph. 23 nodes, 15 edges. Most connected: kernelCrate (9), bootCrate (3), elf (3)."><title>The crate graph</title><style>
svg{
  --surface:#fff; --surface-2:#f6f7f8; --sunk:#e4e7ea;
  --ink:#16191d; --ink-2:#3b434c; --muted:#6a737e;
  --rule:#d2d7dc; --rule-strong:#b3bbc3;
  --implemented:#2c6e4e; --implemented-bg:#dceae2;
  --inProgress:#2a5f8f; --inProgress-bg:#dae5f0;
  --writtenAhead:#6b4fa0; --writtenAhead-bg:#e5dff0;
  --planned:#6a737e; --planned-bg:#e4e7ea;
  --deferred:#87600b; --deferred-bg:#f3e8ce;
}
@media (prefers-color-scheme:dark){svg{
  --surface:#1a1e22; --surface-2:#21262b; --sunk:#0e1113;
  --ink:#e7eaed; --ink-2:#bfc6cd; --muted:#8d97a1;
  --rule:#2c3238; --rule-strong:#5a646e;
  --implemented:#6abf92; --implemented-bg:#16301f;
  --inProgress:#74acdb; --inProgress-bg:#122639;
  --writtenAhead:#a98fd8; --writtenAhead-bg:#241c38;
  --planned:#8d97a1; --planned-bg:#262b31;
  --deferred:#d9a83e; --deferred-bg:#2e2511;
}}

figure.diagram{margin:22px 0 26px; padding:0}
figure.diagram svg{display:block; max-width:100%; height:auto;
  background:var(--surface); border:1px solid var(--rule); border-radius:3px}
figure.diagram figcaption{margin-top:9px; font-size:13px; color:var(--muted); max-width:74ch}
figure.diagram figcaption .figname{color:var(--ink-2); font-weight:600}
.dg-text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:var(--ink)}
.dg-sub{fill:var(--muted)}
.dg-stereo{fill:var(--muted); letter-spacing:.02em}
.dg-row{fill:var(--ink-2)}
.dg-shape{fill:var(--surface-2); stroke:var(--rule-strong); stroke-width:1.1}
.dg-terminal{fill:var(--sunk); stroke:var(--rule-strong)}
.dg-note{fill:var(--surface-2); stroke:var(--rule); stroke-dasharray:3 2}
.dg-rule{stroke:var(--rule-strong); stroke-width:1}
.dg-cluster{fill:none; stroke:var(--rule); stroke-width:1; stroke-dasharray:4 3}
.dg-cluster-label{fill:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dg-edge{fill:none; stroke:var(--rule-strong); stroke-width:1.4}
.dg-edge-trace{stroke-dasharray:5 4}
.dg-edge-label{fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dg-edge-label-bg{fill:var(--surface); stroke:none}
.dg-head{fill:var(--rule-strong); stroke:none}
.dg-head-hollow{fill:var(--surface); stroke:var(--rule-strong); stroke-width:1.1}
.dg-legend{fill:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dg-mat-implemented{fill:var(--implemented-bg); stroke:var(--implemented)}
.dg-mat-inProgress{fill:var(--inProgress-bg); stroke:var(--inProgress)}
.dg-mat-writtenAhead{fill:var(--writtenAhead-bg); stroke:var(--writtenAhead)}
.dg-mat-planned{fill:var(--planned-bg); stroke:var(--planned)}
.dg-mat-deferred{fill:var(--deferred-bg); stroke:var(--deferred)}
a.dg-link{text-decoration:none}
</style><rect width="438" height="1203.1" fill="var(--surface)"/><defs><marker id="dg-crate-dependencies-arrow" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-head" d="M0,0 L9,3.5 L0,7 L1.6,3.5 z"/></marker><marker id="dg-crate-dependencies-open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-edge" d="M0.5,0.5 L9,4 L0.5,7.5"/></marker><marker id="dg-crate-dependencies-hollow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-head-hollow" d="M0.5,0.5 L11,5 L0.5,9.5 z"/></marker><marker id="dg-crate-dependencies-diamond" markerWidth="14" markerHeight="9" refX="0.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-head" d="M0.5,4.5 L7,0.5 L13.5,4.5 L7,8.5 z"/></marker></defs><path class="dg-edge dg-edge-trace" d="M122.8,859.6 L219.8,732.4 Q225.3,725.2 232.5,719.8 L332.7,645.1" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M122.8,859.6 L221.3,660.6 Q225.3,652.6 230,644.9 L320.1,499.7" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M122.8,859.6 L218.8,766.5 Q225.3,760.2 233.6,756.8 L335.9,715.1" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M122.8,859.6 L219.8,987.1 Q225.3,994.2 230.5,1001.6 L325.1,1135.1" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M122.8,859.6 L217.7,800 Q225.3,795.2 234.3,794.4 L332.7,785.1" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M122.8,859.6 L220.6,697.9 Q225.3,690.2 231.2,683.5 L326.4,575.1" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M122.8,859.6 L216.6,832.7 Q225.3,830.2 234.1,832.3 L329.6,855.1" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M122.8,859.6 L219.4,971.4 Q225.3,978.2 234.2,979.6 L332.7,995.1" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M122.8,859.6 L219.6,979.2 Q225.3,986.2 232.6,991.5 L335.9,1065.1" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M115.7,649.6 L218.7,553.7 Q225.3,547.6 233.3,543.5 L320.1,499.7" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M115.7,649.6 L220.8,830.5 Q225.3,838.2 232.4,843.8 L335.9,925.1" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M115.7,649.6 L216.3,659.7 Q225.3,660.6 232.2,654.8 L326.4,575.1" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M101.2,999.6 L217.3,939.4 Q225.3,935.2 234.3,934.4 L335.9,925.1" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M101.2,1069.6 L218.3,975.9 Q225.3,970.2 233.6,966.8 L335.9,925.1" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M101.2,1069.6 L216.3,1074.8 Q225.3,1075.2 233,1079.9 L325.1,1135.1" marker-end="url(#dg-crate-dependencies-open)"/><g><rect class="dg-shape dg-mat-writtenAhead" x="17.1" y="14" width="110.2" height="48" rx="4"/><text class="dg-text" x="72.2" y="35" text-anchor="middle" font-size="12">linuxAbi</text><text class="dg-text dg-sub" x="72.2" y="49" text-anchor="middle" font-size="10.5">libs/linux-abi</text><title>Three system call number tables, not two: x86-64&#x27;s own, AArch64&#x27;s generic one, and ARMv7-A&#x27;s EABI one.</title></g><g><rect class="dg-shape dg-mat-writtenAhead" x="26.6" y="84" width="91.3" height="48" rx="4"/><text class="dg-text" x="72.2" y="105" text-anchor="middle" font-size="12">ustack</text><text class="dg-text dg-sub" x="72.2" y="119" text-anchor="middle" font-size="10.5">libs/ustack</text><title>The initial process stack image: argc, argv, envp and the auxiliary vector, laid out as a program&#x27;s _start reads them, at both pointer widths.</title></g><g><rect class="dg-shape dg-mat-writtenAhead" x="32.9" y="154" width="78.7" height="48" rx="4"/><text class="dg-text" x="72.2" y="175" text-anchor="middle" font-size="12">cpio</text><text class="dg-text dg-sub" x="72.2" y="189" text-anchor="middle" font-size="10.5">libs/cpio</text></g><g><rect class="dg-shape dg-mat-writtenAhead" x="36" y="224" width="72.4" height="48" rx="4"/><text class="dg-text" x="72.2" y="245" text-anchor="middle" font-size="12">vfs</text><text class="dg-text dg-sub" x="72.2" y="259" text-anchor="middle" font-size="10.5">libs/vfs</text><title>Dentries with negative entries, mounts, the path walk, open file descriptions, descriptor tables, tmpfs over a page store the kernel supplies, initramfs unpacking and the getdents64 packer.</title></g><g><rect class="dg-shape dg-mat-writtenAhead" x="26.6" y="294" width="91.3" height="48" rx="4"/><text class="dg-text" x="72.2" y="315" text-anchor="middle" font-size="12">virtio</text><text class="dg-text dg-sub" x="72.2" y="329" text-anchor="middle" font-size="10.5">libs/virtio</text></g><g><rect class="dg-shape dg-mat-implemented" x="28.9" y="625.6" width="86.8" height="48" rx="4"/><text class="dg-text" x="72.2" y="646.6" text-anchor="middle" font-size="12">bootCrate</text><text class="dg-text dg-sub" x="72.2" y="660.6" text-anchor="middle" font-size="10.5">boot</text></g><g><rect class="dg-shape dg-mat-implemented" x="14" y="695.6" width="116.5" height="48" rx="4"/><text class="dg-text" x="72.2" y="716.6" text-anchor="middle" font-size="12">nativeAbi</text><text class="dg-text dg-sub" x="72.2" y="730.6" text-anchor="middle" font-size="10.5">libs/native-abi</text><title>The native ABI&#x27;s numbers, handle values, rights, signals, errno names and repr(C) layouts.</title></g><g><rect class="dg-shape dg-mat-implemented" x="23.5" y="765.6" width="97.6" height="48" rx="4"/><text class="dg-text" x="72.2" y="786.6" text-anchor="middle" font-size="12">objects</text><text class="dg-text dg-sub" x="72.2" y="800.6" text-anchor="middle" font-size="10.5">libs/objects</text><title>The handle table and the channel message queue, generic over what a handle names.</title></g><g><rect class="dg-shape dg-mat-implemented" x="21.6" y="835.6" width="101.2" height="48" rx="4"/><text class="dg-text" x="72.2" y="856.6" text-anchor="middle" font-size="12">kernelCrate</text><text class="dg-text dg-sub" x="72.2" y="870.6" text-anchor="middle" font-size="10.5">kernel</text></g><g><rect class="dg-shape dg-mat-writtenAhead" x="29.8" y="905.6" width="85" height="48" rx="4"/><text class="dg-text" x="72.2" y="926.6" text-anchor="middle" font-size="12">btrfs</text><text class="dg-text dg-sub" x="72.2" y="940.6" text-anchor="middle" font-size="10.5">libs/btrfs</text></g><g><rect class="dg-shape dg-mat-implemented" x="43.2" y="975.6" width="58" height="48" rx="4"/><text class="dg-text" x="72.2" y="996.6" text-anchor="middle" font-size="12">xtask</text><text class="dg-text dg-sub" x="72.2" y="1010.6" text-anchor="middle" font-size="10.5">xtask</text><title>Cross-compiles both halves, writes the FAT32 image with its own writer, converts the ARMv7-A loader ELF to PE32, drives QEMU.</title></g><g><rect class="dg-shape dg-mat-implemented" x="43.2" y="1045.6" width="58" height="48" rx="4"/><text class="dg-text" x="72.2" y="1066.6" text-anchor="middle" font-size="12">fuzz</text><text class="dg-text dg-sub" x="72.2" y="1080.6" text-anchor="middle" font-size="10.5">fuzz</text></g><g><rect class="dg-shape dg-mat-planned" x="176.5" y="194.8" width="97.6" height="48" rx="4"/><text class="dg-text" x="225.3" y="215.8" text-anchor="middle" font-size="12">seccompBpf</text><text class="dg-text dg-sub" x="225.3" y="229.8" text-anchor="middle" font-size="10.5">libs/seccomp</text><title>The classic-BPF interpreter as a pure function over bytes.</title></g><g><rect class="dg-shape dg-mat-implemented" x="320.1" y="475.7" width="103.9" height="48" rx="4"/><text class="dg-text" x="372.1" y="496.7" text-anchor="middle" font-size="12">bootinfo</text><text class="dg-text dg-sub" x="372.1" y="510.7" text-anchor="middle" font-size="10.5">libs/bootinfo</text><title>The hand-off ABI, both address layouts, checked at compile time on every build.</title></g><g><rect class="dg-shape dg-mat-implemented" x="326.4" y="551.1" width="91.3" height="48" rx="4"/><text class="dg-text" x="372.1" y="572.1" text-anchor="middle" font-size="12">paging</text><text class="dg-text dg-sub" x="372.1" y="586.1" text-anchor="middle" font-size="10.5">libs/paging</text></g><g><rect class="dg-shape dg-mat-implemented" x="332.7" y="621.1" width="78.7" height="48" rx="4"/><text class="dg-text" x="372.1" y="642.1" text-anchor="middle" font-size="12">acpi</text><text class="dg-text dg-sub" x="372.1" y="656.1" text-anchor="middle" font-size="10.5">libs/acpi</text><title>Reached at stage 3: the MADT walk the interrupt controller needed.</title></g><g><rect class="dg-shape dg-mat-implemented" x="335.9" y="691.1" width="72.4" height="48" rx="4"/><text class="dg-text" x="372.1" y="712.1" text-anchor="middle" font-size="12">fdt</text><text class="dg-text dg-sub" x="372.1" y="726.1" text-anchor="middle" font-size="10.5">libs/fdt</text><title>Reached at stage 1 on ARMv7-A: console, GIC, timer interrupt and PSCI conduit come from it there.</title></g><g><rect class="dg-shape dg-mat-implemented" x="332.7" y="761.1" width="78.7" height="48" rx="4"/><text class="dg-text" x="372.1" y="782.1" text-anchor="middle" font-size="12">heap</text><text class="dg-text dg-sub" x="372.1" y="796.1" text-anchor="middle" font-size="10.5">libs/heap</text><title>The body has no unsafe; the crate cannot forbid it because declaring Backing as an unsafe trait is the point.</title></g><g><rect class="dg-shape dg-mat-implemented" x="329.6" y="831.1" width="85" height="48" rx="4"/><text class="dg-text" x="372.1" y="852.1" text-anchor="middle" font-size="12">sched</text><text class="dg-text dg-sub" x="372.1" y="866.1" text-anchor="middle" font-size="10.5">libs/sched</text><title>The half of the scheduler that is arithmetic: the EEVDF tree, weights, lag, the domain partition.</title></g><g><rect class="dg-shape dg-mat-implemented" x="335.9" y="901.1" width="72.4" height="48" rx="4"/><text class="dg-text" x="372.1" y="922.1" text-anchor="middle" font-size="12">elf</text><text class="dg-text dg-sub" x="372.1" y="936.1" text-anchor="middle" font-size="10.5">libs/elf</text><title>ELF64 and, since the ARMv7-A port, ELF32.</title></g><g><rect class="dg-shape dg-mat-implemented" x="332.7" y="971.1" width="78.7" height="48" rx="4"/><text class="dg-text" x="372.1" y="992.1" text-anchor="middle" font-size="12">sync</text><text class="dg-text dg-sub" x="372.1" y="1006.1" text-anchor="middle" font-size="10.5">libs/sync</text><title>Reached at stage 4: SpinLock and IrqSpinLock guard every shared kernel structure.</title></g><g><rect class="dg-shape dg-mat-implemented" x="335.9" y="1041.1" width="72.4" height="48" rx="4"/><text class="dg-text" x="372.1" y="1062.1" text-anchor="middle" font-size="12">vma</text><text class="dg-text dg-sub" x="372.1" y="1076.1" text-anchor="middle" font-size="10.5">libs/vma</text><title>Written for stage 6; reached at stage 2 as the vmap arena&#x27;s range map.</title></g><g><rect class="dg-shape dg-mat-implemented" x="325.1" y="1111.1" width="94" height="48" rx="4"/><text class="dg-text" x="372.1" y="1132.1" text-anchor="middle" font-size="12">frameCrate</text><text class="dg-text dg-sub" x="372.1" y="1146.1" text-anchor="middle" font-size="10.5">libs/frame</text></g><rect class="dg-shape dg-mat-implemented" x="14" y="1181.1" width="11" height="11" rx="2"/><text class="dg-text dg-legend" x="30" y="1190.6" font-size="10">implemented</text><rect class="dg-shape dg-mat-writtenAhead" x="112" y="1181.1" width="11" height="11" rx="2"/><text class="dg-text dg-legend" x="128" y="1190.6" font-size="10">written ahead</text><rect class="dg-shape dg-mat-planned" x="222" y="1181.1" width="11" height="11" rx="2"/><text class="dg-text dg-legend" x="238" y="1190.6" font-size="10">planned</text></svg>