<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 450.6 1251.5" width="450.6" height="1251.5" role="img" aria-label="Dependency diagram: The crate graph. 28 nodes, 15 edges. Most connected: kernelCrate (9), bootCrate (3), elf (3)."><title>The crate graph</title><style>
svg{
  --surface:#fff; --surface-2:#f6f7f8; --sunk:#e4e7ea;
  --ink:#16191d; --ink-2:#3b434c; --muted:#6a737e;
  --rule:#d2d7dc; --rule-strong:#b3bbc3;
  --implemented:#2c6e4e; --implemented-bg:#dceae2;
  --inProgress:#2a5f8f; --inProgress-bg:#dae5f0;
  --writtenAhead:#6b4fa0; --writtenAhead-bg:#e5dff0;
  --planned:#6a737e; --planned-bg:#e4e7ea;
  --deferred:#87600b; --deferred-bg:#f3e8ce;
}
@media (prefers-color-scheme:dark){svg{
  --surface:#1a1e22; --surface-2:#21262b; --sunk:#0e1113;
  --ink:#e7eaed; --ink-2:#bfc6cd; --muted:#8d97a1;
  --rule:#2c3238; --rule-strong:#5a646e;
  --implemented:#6abf92; --implemented-bg:#16301f;
  --inProgress:#74acdb; --inProgress-bg:#122639;
  --writtenAhead:#a98fd8; --writtenAhead-bg:#241c38;
  --planned:#8d97a1; --planned-bg:#262b31;
  --deferred:#d9a83e; --deferred-bg:#2e2511;
}}

figure.diagram{margin:22px 0 26px; padding:0}
figure.diagram svg{display:block; max-width:100%; height:auto;
  background:var(--surface); border:1px solid var(--rule); border-radius:3px}
figure.diagram figcaption{margin-top:9px; font-size:13px; color:var(--muted); max-width:74ch}
figure.diagram figcaption .figname{color:var(--ink-2); font-weight:600}
.dg-text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:var(--ink)}
.dg-sub{fill:var(--muted)}
.dg-stereo{fill:var(--muted); letter-spacing:.02em}
.dg-row{fill:var(--ink-2)}
.dg-shape{fill:var(--surface-2); stroke:var(--rule-strong); stroke-width:1.1}
.dg-terminal{fill:var(--sunk); stroke:var(--rule-strong)}
.dg-note{fill:var(--surface-2); stroke:var(--rule); stroke-dasharray:3 2}
.dg-rule{stroke:var(--rule-strong); stroke-width:1}
.dg-cluster{fill:none; stroke:var(--rule); stroke-width:1; stroke-dasharray:4 3}
.dg-cluster-label{fill:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dg-edge{fill:none; stroke:var(--rule-strong); stroke-width:1.4}
.dg-edge-trace{stroke-dasharray:5 4}
.dg-edge-label{fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dg-edge-label-bg{fill:var(--surface); stroke:none}
.dg-head{fill:var(--rule-strong); stroke:none}
.dg-head-hollow{fill:var(--surface); stroke:var(--rule-strong); stroke-width:1.1}
.dg-legend{fill:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dg-mat-implemented{fill:var(--implemented-bg); stroke:var(--implemented)}
.dg-mat-inProgress{fill:var(--inProgress-bg); stroke:var(--inProgress)}
.dg-mat-writtenAhead{fill:var(--writtenAhead-bg); stroke:var(--writtenAhead)}
.dg-mat-planned{fill:var(--planned-bg); stroke:var(--planned)}
.dg-mat-deferred{fill:var(--deferred-bg); stroke:var(--deferred)}
a.dg-link{text-decoration:none}
</style><rect width="450.6" height="1251.5" fill="var(--surface)"/><defs><marker id="dg-crate-dependencies-arrow" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-head" d="M0,0 L9,3.5 L0,7 L1.6,3.5 z"/></marker><marker id="dg-crate-dependencies-open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-edge" d="M0.5,0.5 L9,4 L0.5,7.5"/></marker><marker id="dg-crate-dependencies-hollow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-head-hollow" d="M0.5,0.5 L11,5 L0.5,9.5 z"/></marker><marker id="dg-crate-dependencies-diamond" markerWidth="14" markerHeight="9" refX="0.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-head" d="M0.5,4.5 L7,0.5 L13.5,4.5 L7,8.5 z"/></marker></defs><path class="dg-edge dg-edge-trace" d="M119.7,840.8 L223.2,696.8 Q228.4,689.5 235.8,684.4 L345.3,608.3" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M119.7,840.8 L224.9,595.5 Q228.4,587.3 232.9,579.4 L332.7,403.8" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M119.7,840.8 L222.3,731.1 Q228.4,724.5 236.8,721.3 L348.4,678.3" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M119.7,840.8 L221.6,928.6 Q228.4,934.5 233.4,942 L337.6,1098.3" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M119.7,840.8 L220,805.5 Q228.4,802.5 236.6,798.7 L345.3,748.3" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M119.7,840.8 L223.5,680.8 Q228.4,673.3 234.2,666.3 L339,538.3" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M119.7,840.8 L219.8,812.9 Q228.4,810.5 237.4,811.1 L342.1,818.3" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M119.7,840.8 L220.8,902.8 Q228.4,907.5 236.7,911.1 L345.3,958.3" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M119.7,840.8 L221,910.4 Q228.4,915.5 235,921.7 L348.4,1028.3" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M112.5,630.8 L222.9,489.4 Q228.4,482.3 235.6,476.9 L332.7,403.8" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M112.5,630.8 L223.7,810.9 Q228.4,818.5 236.2,823 L348.4,888.3" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M112.5,630.8 L219.8,662.7 Q228.4,665.3 234.4,658.5 L339,538.3" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M98.1,910.8 L220,867.5 Q228.4,864.5 237.3,866.3 L348.4,888.3" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M98.1,980.8 L220.8,904.3 Q228.4,899.5 237.4,898.7 L348.4,888.3" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M98.1,980.8 L219.6,1002.9 Q228.4,1004.5 235.3,1010.4 L337.6,1098.3" marker-end="url(#dg-crate-dependencies-open)"/><g><rect class="dg-shape dg-mat-writtenAhead" x="14" y="14" width="110.2" height="48" rx="4"/><text class="dg-text" x="69.1" y="35" text-anchor="middle" font-size="12">linuxAbi</text><text class="dg-text dg-sub" x="69.1" y="49" text-anchor="middle" font-size="10.5">libs/linux-abi</text><title>Three system call number tables, not two: x86-64&#x27;s own, AArch64&#x27;s generic one, and ARMv7-A&#x27;s EABI one.</title></g><g><rect class="dg-shape dg-mat-writtenAhead" x="23.5" y="84" width="91.3" height="48" rx="4"/><text class="dg-text" x="69.1" y="105" text-anchor="middle" font-size="12">ustack</text><text class="dg-text dg-sub" x="69.1" y="119" text-anchor="middle" font-size="10.5">libs/ustack</text><title>The initial process stack image: argc, argv, envp and the auxiliary vector, laid out as a program&#x27;s _start reads them, at both pointer widths.</title></g><g><rect class="dg-shape dg-mat-writtenAhead" x="29.8" y="154" width="78.7" height="48" rx="4"/><text class="dg-text" x="69.1" y="175" text-anchor="middle" font-size="12">cpio</text><text class="dg-text dg-sub" x="69.1" y="189" text-anchor="middle" font-size="10.5">libs/cpio</text><title>The newc reader the initramfs is unpacked with.</title></g><g><rect class="dg-shape dg-mat-writtenAhead" x="32.9" y="224" width="72.4" height="48" rx="4"/><text class="dg-text" x="69.1" y="245" text-anchor="middle" font-size="12">vfs</text><text class="dg-text dg-sub" x="69.1" y="259" text-anchor="middle" font-size="10.5">libs/vfs</text><title>Dentries with negative entries, mounts, the path walk, open file descriptions, descriptor tables, tmpfs over a page store the kernel supplies, initramfs unpacking and the getdents64 packer.</title></g><g><rect class="dg-shape dg-mat-implemented" x="23.5" y="294" width="91.3" height="48" rx="4"/><text class="dg-text" x="69.1" y="315" text-anchor="middle" font-size="12">procfs</text><text class="dg-text dg-sub" x="69.1" y="329" text-anchor="middle" font-size="10.5">libs/procfs</text><title>The text of /proc as pure functions: maps lines padded to their name column at both pointer widths, meminfo, status, stat and mounts, pinned byte for byte against lines a real Linux printed, and the maps parser the kern…</title></g><g><rect class="dg-shape dg-mat-implemented" x="23.5" y="364" width="91.3" height="48" rx="4"/><text class="dg-text" x="69.1" y="385" text-anchor="middle" font-size="12">virtio</text><text class="dg-text dg-sub" x="69.1" y="399" text-anchor="middle" font-size="10.5">libs/virtio</text></g><g><rect class="dg-shape dg-mat-implemented" x="25.7" y="606.8" width="86.8" height="48" rx="4"/><text class="dg-text" x="69.1" y="627.8" text-anchor="middle" font-size="12">bootCrate</text><text class="dg-text dg-sub" x="69.1" y="641.8" text-anchor="middle" font-size="10.5">boot</text></g><g><rect class="dg-shape dg-mat-writtenAhead" x="20.3" y="676.8" width="97.6" height="48" rx="4"/><text class="dg-text" x="69.1" y="697.8" text-anchor="middle" font-size="12">netwire</text><text class="dg-text dg-sub" x="69.1" y="711.8" text-anchor="middle" font-size="10.5">libs/netwire</text><title>The byte-level half of the net core, written ahead of the networking stage: Ethernet with one 802.1Q tag, ARP, IPv4 with its options, IPv6 with the extension-header walk, ICMPv4, ICMPv6 and Neighbor Discovery, UDP, and TCP headers with their negotiated options, each parsed without allocation and emitted into a caller&#x27;s buffer, checksums verified where the format carries them.</title></g><g><rect class="dg-shape dg-mat-writtenAhead" x="32.9" y="746.8" width="72.4" height="48" rx="4"/><text class="dg-text" x="69.1" y="767.8" text-anchor="middle" font-size="12">pci</text><text class="dg-text dg-sub" x="69.1" y="781.8" text-anchor="middle" font-size="10.5">libs/pci</text><title>PCI configuration space over a ConfigSpace the caller implements: ECAM geometry, headers, BAR decoding and sizing, both capability lists with a visited set, MSI-X, the bus walk without recursion or allocation, and virtio&#x27;s PCI transport.</title></g><g><rect class="dg-shape dg-mat-implemented" x="18.5" y="816.8" width="101.2" height="48" rx="4"/><text class="dg-text" x="69.1" y="837.8" text-anchor="middle" font-size="12">kernelCrate</text><text class="dg-text dg-sub" x="69.1" y="851.8" text-anchor="middle" font-size="10.5">kernel</text></g><g><rect class="dg-shape dg-mat-implemented" x="40.1" y="886.8" width="58" height="48" rx="4"/><text class="dg-text" x="69.1" y="907.8" text-anchor="middle" font-size="12">xtask</text><text class="dg-text dg-sub" x="69.1" y="921.8" text-anchor="middle" font-size="10.5">xtask</text><title>Cross-compiles both halves, writes the FAT32 image with its own writer, converts the ARMv7-A loader ELF to PE32, drives QEMU.</title></g><g><rect class="dg-shape dg-mat-implemented" x="40.1" y="956.8" width="58" height="48" rx="4"/><text class="dg-text" x="69.1" y="977.8" text-anchor="middle" font-size="12">fuzz</text><text class="dg-text dg-sub" x="69.1" y="991.8" text-anchor="middle" font-size="10.5">fuzz</text></g><g><rect class="dg-shape dg-mat-implemented" x="170.2" y="25.2" width="116.5" height="48" rx="4"/><text class="dg-text" x="228.4" y="46.2" text-anchor="middle" font-size="12">nativeAbi</text><text class="dg-text dg-sub" x="228.4" y="60.2" text-anchor="middle" font-size="10.5">libs/native-abi</text><title>The native ABI&#x27;s numbers, handle values, rights, signals, errno names and repr(C) layouts.</title></g><g><rect class="dg-shape dg-mat-implemented" x="179.6" y="602.3" width="97.6" height="48" rx="4"/><text class="dg-text" x="228.4" y="623.3" text-anchor="middle" font-size="12">objects</text><text class="dg-text dg-sub" x="228.4" y="637.3" text-anchor="middle" font-size="10.5">libs/objects</text><title>The handle table and the channel message queue, generic over what a handle names.</title></g><g><rect class="dg-shape dg-mat-writtenAhead" x="185.9" y="739.5" width="85" height="48" rx="4"/><text class="dg-text" x="228.4" y="760.5" text-anchor="middle" font-size="12">btrfs</text><text class="dg-text dg-sub" x="228.4" y="774.5" text-anchor="middle" font-size="10.5">libs/btrfs</text><title>The btrfs read path, allocating nothing: parsing, mount bootstrap, lookup, readdir and read, and zlib, LZO and zstd decoders.</title></g><g><rect class="dg-shape dg-mat-writtenAhead" x="173.3" y="1019.5" width="110.2" height="48" rx="4"/><text class="dg-text" x="228.4" y="1040.5" text-anchor="middle" font-size="12">btrfsVfs</text><text class="dg-text dg-sub" x="228.4" y="1054.5" text-anchor="middle" font-size="10.5">libs/btrfs-vfs</text><title>btrfs mounted into the VFS: FileSystem and Inode over the read path, read-only, holding no lock across I/O.</title></g><g><rect class="dg-shape dg-mat-writtenAhead" x="181.4" y="1089.5" width="94" height="48" rx="4"/><text class="dg-text" x="228.4" y="1110.5" text-anchor="middle" font-size="12">blockQueue</text><text class="dg-text dg-sub" x="228.4" y="1124.5" text-anchor="middle" font-size="10.5">libs/block</text><title>The block core&#x27;s request queue: merging, flush and FUA barriers no request crosses, deadline scheduling.</title></g><g><rect class="dg-shape dg-mat-planned" x="179.6" y="1159.5" width="97.6" height="48" rx="4"/><text class="dg-text" x="228.4" y="1180.5" text-anchor="middle" font-size="12">seccompBpf</text><text class="dg-text dg-sub" x="228.4" y="1194.5" text-anchor="middle" font-size="10.5">libs/seccomp</text><title>The classic-BPF interpreter as a pure function over bytes.</title></g><g><rect class="dg-shape dg-mat-implemented" x="332.7" y="379.8" width="103.9" height="48" rx="4"/><text class="dg-text" x="384.6" y="400.8" text-anchor="middle" font-size="12">bootinfo</text><text class="dg-text dg-sub" x="384.6" y="414.8" text-anchor="middle" font-size="10.5">libs/bootinfo</text><title>The hand-off ABI, both address layouts, checked at compile time on every build.</title></g><g><rect class="dg-shape dg-mat-implemented" x="339" y="514.3" width="91.3" height="48" rx="4"/><text class="dg-text" x="384.6" y="535.3" text-anchor="middle" font-size="12">paging</text><text class="dg-text dg-sub" x="384.6" y="549.3" text-anchor="middle" font-size="10.5">libs/paging</text></g><g><rect class="dg-shape dg-mat-implemented" x="345.3" y="584.3" width="78.7" height="48" rx="4"/><text class="dg-text" x="384.6" y="605.3" text-anchor="middle" font-size="12">acpi</text><text class="dg-text dg-sub" x="384.6" y="619.3" text-anchor="middle" font-size="10.5">libs/acpi</text><title>Reached at stage 3: the MADT walk the interrupt controller needed.</title></g><g><rect class="dg-shape dg-mat-implemented" x="348.4" y="654.3" width="72.4" height="48" rx="4"/><text class="dg-text" x="384.6" y="675.3" text-anchor="middle" font-size="12">fdt</text><text class="dg-text dg-sub" x="384.6" y="689.3" text-anchor="middle" font-size="10.5">libs/fdt</text><title>Reached at stage 1 on ARMv7-A: console, GIC, timer interrupt and PSCI conduit come from it there.</title></g><g><rect class="dg-shape dg-mat-implemented" x="345.3" y="724.3" width="78.7" height="48" rx="4"/><text class="dg-text" x="384.6" y="745.3" text-anchor="middle" font-size="12">heap</text><text class="dg-text dg-sub" x="384.6" y="759.3" text-anchor="middle" font-size="10.5">libs/heap</text><title>The body has no unsafe; the crate cannot forbid it because declaring Backing as an unsafe trait is the point.</title></g><g><rect class="dg-shape dg-mat-implemented" x="342.1" y="794.3" width="85" height="48" rx="4"/><text class="dg-text" x="384.6" y="815.3" text-anchor="middle" font-size="12">sched</text><text class="dg-text dg-sub" x="384.6" y="829.3" text-anchor="middle" font-size="10.5">libs/sched</text><title>The half of the scheduler that is arithmetic: the EEVDF tree, weights, lag, the domain partition.</title></g><g><rect class="dg-shape dg-mat-implemented" x="348.4" y="864.3" width="72.4" height="48" rx="4"/><text class="dg-text" x="384.6" y="885.3" text-anchor="middle" font-size="12">elf</text><text class="dg-text dg-sub" x="384.6" y="899.3" text-anchor="middle" font-size="10.5">libs/elf</text><title>ELF64 and, since the ARMv7-A port, ELF32.</title></g><g><rect class="dg-shape dg-mat-implemented" x="345.3" y="934.3" width="78.7" height="48" rx="4"/><text class="dg-text" x="384.6" y="955.3" text-anchor="middle" font-size="12">sync</text><text class="dg-text dg-sub" x="384.6" y="969.3" text-anchor="middle" font-size="10.5">libs/sync</text><title>Reached at stage 4: SpinLock and IrqSpinLock guard every shared kernel structure.</title></g><g><rect class="dg-shape dg-mat-implemented" x="348.4" y="1004.3" width="72.4" height="48" rx="4"/><text class="dg-text" x="384.6" y="1025.3" text-anchor="middle" font-size="12">vma</text><text class="dg-text dg-sub" x="384.6" y="1039.3" text-anchor="middle" font-size="10.5">libs/vma</text><title>Written for stage 6; reached at stage 2 as the vmap arena&#x27;s range map.</title></g><g><rect class="dg-shape dg-mat-implemented" x="337.6" y="1074.3" width="94" height="48" rx="4"/><text class="dg-text" x="384.6" y="1095.3" text-anchor="middle" font-size="12">frameCrate</text><text class="dg-text dg-sub" x="384.6" y="1109.3" text-anchor="middle" font-size="10.5">libs/frame</text></g><rect class="dg-shape dg-mat-implemented" x="14" y="1229.5" width="11" height="11" rx="2"/><text class="dg-text dg-legend" x="30" y="1239" font-size="10">implemented</text><rect class="dg-shape dg-mat-writtenAhead" x="112" y="1229.5" width="11" height="11" rx="2"/><text class="dg-text dg-legend" x="128" y="1239" font-size="10">written ahead</text><rect class="dg-shape dg-mat-planned" x="222" y="1229.5" width="11" height="11" rx="2"/><text class="dg-text dg-legend" x="238" y="1239" font-size="10">planned</text></svg>