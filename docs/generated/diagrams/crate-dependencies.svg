crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M112.5,319.7 L185.9,673.2" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M112.5,319.7 L176.5,183.2" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M98.1,669.7 L185.9,673.2" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M98.1,739.7 L185.9,673.2" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M98.1,739.7 L175.1,743.2" marker-end="url(#dg-crate-dependencies-open)"/><g><rect class="dg-shape dg-mat-writtenAhead" x="14" y="14" width="110.2" height="48" rx="4"/><text class="dg-text" x="69.1" y="35" text-anchor="middle" font-size="12">linuxAbi</text><text class="dg-text dg-sub" x="69.1" y="49" text-anchor="middle" font-size="10.5">libs/linux-abi</text><title>Three system call number tables, not two: x86-64&#x27;s own, AArch64&#x27;s generic one, and ARMv7-A&#x27;s EABI one.</title></g><g><rect class="dg-shape dg-mat-writtenAhead" x="23.5" y="84" width="91.3" height="48" rx="4"/><text class="dg-text" x="69.1" y="105" text-anchor="middle" font-size="12">ustack</text><text class="dg-text dg-sub" x="69.1" y="119" text-anchor="middle" font-size="10.5">libs/ustack</text><title>The initial process stack image: argc, argv, envp and the auxiliary vector, laid out as a program&#x27;s _start reads them, at both pointer widths.</title></g><g><rect class="dg-shape dg-mat-writtenAhead" x="29.8" y="154" width="78.7" height="48" rx="4"/><text class="dg-text" x="69.1" y="175" text-anchor="middle" font-size="12">cpio</text><text class="dg-text dg-sub" x="69.1" y="189" text-anchor="middle" font-size="10.5">libs/cpio</text></g><g><rect class="dg-shape dg-mat-writtenAhead" x="23.5" y="224" width="91.3" height="48" rx="4"/><text class="dg-text" x="69.1" y="245" text-anchor="middle" font-size="12">virtio</text><text class="dg-text dg-sub" x="69.1" y="259" text-anchor="middle" font-size="10.5">libs/virtio</text></g><g><rect class="dg-shape dg-mat-implemented" x="25.7" y="295.7" width="86.8" height="48" rx="4"/><text class="dg-text" x="69.1" y="316.7" text-anchor="middle" font-size="12">bootCrate</text><text class="dg-text dg-sub" x="69.1" y="330.7" text-anchor="middle" font-size="10.5">boot</text></g><g><rect class="dg-shape dg-mat-implemented" x="18.5" y="373.4" width="101.2" height="48" rx="4"/><text class="dg-text" x="69.1" y="394.4" text-anchor="middle" font-size="12">kernelCrate</text><text class="dg-text dg-sub" x="69.1" y="408.4" text-anchor="middle" font-size="10.5">kernel</text></g><g><rect class="dg-shape dg-mat-writtenAhead" x="26.6" y="443.4" width="85" height="48" rx="4"/><text class="dg-text" x="69.1" y="464.4" text-anchor="middle" font-size="12">btrfs</text><text class="dg-text dg-sub" x="69.1" y="478.4" text-anchor="middle" font-size="10.5">libs/btrfs</text></g><g><rect class="dg-shape dg-mat-planned" x="20.3" y="513.4" width="97.6" height="48" rx="4"/><text class="dg-text" x="69.1" y="534.4" text-anchor="middle" font-size="12">seccompBpf</text><text class="dg-text dg-sub" x="69.1" y="548.4" text-anchor="middle" font-size="10.5">libs/seccomp</text><title>The classic-BPF interpreter as a pure function over bytes.</title></g><g><rect class="dg-shape dg-mat-implemented" x="40.1" y="645.7" width="58" height="48" rx="4"/><text class="dg-text" x="69.1" y="666.7" text-anchor="middle" font-size="12">xtask</text><text class="dg-text dg-sub" x="69.1" y="680.7" text-anchor="middle" font-size="10.5">xtask</text><title>Cross-compiles both halves, writes the FAT32 image with its own writer, converts the ARMv7-A loader ELF to PE32, drives QEMU.</title></g><g><rect class="dg-shape dg-mat-implemented" x="40.1" y="715.7" width="58" height="48" rx="4"/><text class="dg-text" x="69.1" y="736.7" text-anchor="middle" font-size="12">fuzz</text><text class="dg-text dg-sub" x="69.1" y="750.7" text-anchor="middle" font-size="10.5">fuzz</text></g><g><rect class="dg-shape dg-mat-implemented" x="170.2" y="89.2" width="103.9" height="48" rx="4"/><text class="dg-text" x="222.1" y="110.2" text-anchor="middle" font-size="12">bootinfo</text><text class="dg-text dg-sub" x="222.1" y="124.2" text-anchor="middle" font-size="10.5">libs/bootinfo</text><title>The hand-off ABI, both address layouts, checked at compile time on every build.</title></g><g><rect class="dg-shape dg-mat-implemented" x="176.5" y="159.2" width="91.3" height="48" rx="4"/><text class="dg-text" x="222.2" y="180.2" text-anchor="middle" font-size="12">paging</text><text class="dg-text dg-sub" x="222.2" y="194.2" text-anchor="middle" font-size="10.5">libs/paging</text></g><g><rect class="dg-shape dg-mat-implemented" x="182.8" y="229.2" width="78.7" height="48" rx="4"/><text class="dg-text" x="222.1" y="250.2" text-anchor="middle" font-size="12">heap</text><text class="dg-text dg-sub" x="222.1" y="264.2" text-anchor="middle" font-size="10.5">libs/heap</text><title>The body has no unsafe; the crate cannot forbid it because declaring Backing as an unsafe trait is the point.</title></g><g><rect class="dg-shape dg-mat-implemented" x="182.8" y="299.2" width="78.7" height="48" rx="4"/><text class="dg-text" x="222.1" y="320.2" text-anchor="middle" font-size="12">acpi</text><text class="dg-text dg-sub" x="222.1" y="334.2" text-anchor="middle" font-size="10.5">libs/acpi</text><title>Reached at stage 3: the MADT walk the interrupt controller needed.</title></g><g><rect class="dg-shape dg-mat-implemented" x="185.9" y="369.2" width="72.4" height="48" rx="4"/><text class="dg-text" x="222.1" y="390.2" text-anchor="middle" font-size="12">fdt</text><text class="dg-text dg-sub" x="222.1" y="404.2" text-anchor="middle" font-size="10.5">libs/fdt</text><title>Reached at stage 1 on ARMv7-A: console, GIC, timer interrupt and PSCI conduit come from it there.</title></g><g><rect class="dg-shape dg-mat-implemented" x="182.8" y="439.2" width="78.7" height="48" rx="4"/><text class="dg-text" x="222.1" y="460.2" text-anchor="middle" font-size="12">sync</text><text class="dg-text dg-sub" x="222.1" y="474.2" text-anchor="middle" font-size="10.5">libs/sync</text><title>Reached at stage 4: SpinLock and IrqSpinLock guard every shared kernel structure.</title></g><g><rect class="dg-shape dg-mat-implemented" x="179.6" y="509.2" width="85" height="48" rx="4"/><text class="dg-text" x="222.1" y="530.2" text-anchor="middle" font-size="12">sched</text><text class="dg-text dg-sub" x="222.1" y="544.2" text-anchor="middle" font-size="10.5">libs/sched</text><title>The half of the scheduler that is arithmetic: the EEVDF tree, weights, lag, the domain partition.</title></g><g><rect class="dg-shape dg-mat-implemented" x="185.9" y="579.2" width="72.4" height="48" rx="4"/><text class="dg-text" x="222.1" y="600.2" text-anchor="middle" font-size="12">vma</text><text class="dg-text dg-sub" x="222.1" y="614.2" text-anchor="middle" font-size="10.5">libs/vma</text><title>Written for stage 6; reached at stage 2 as the vmap arena&#x27;s range map.</title></g><g><rect class="dg-shape dg-mat-implemented" x="185.9" y="649.2" width="72.4" height="48" rx="4"/><text class="dg-text" x="222.1" y="670.2" text-anchor="middle" font-size="12">elf</text><text class="dg-text dg-sub" x="222.1" y="684.2" text-anchor="middle" font-size="10.5">libs/elf</text><title>ELF64 and, since the ARMv7-A port, ELF32.</title></g><g><rect class="dg-shape dg-mat-implemented" x="175.1" y="719.2" width="94" height="48" rx="4"/><text class="dg-text" x="222.1" y="740.2" text-anchor="middle" font-size="12">frameCrate</text><text class="dg-text dg-sub" x="222.1" y="754.2" text-anchor="middle" font-size="10.5">libs/frame</text></g><rect class="dg-shape dg-mat-implemented" x="14" y="789.2" width="11" height="11" rx="2"/><text class="dg-text dg-legend" x="30" y="798.7" font-size="10">implemented</text><rect class="dg-shape dg-mat-writtenAhead" x="112" y="789.2" width="11" height="11" rx="2"/><text class="dg-text dg-legend" x="128" y="798.7" font-size="10">written ahead</text><rect class="dg-shape dg-mat-planned" x="222" y="789.2" width="11" height="11" rx="2"/><text class="dg-text dg-legend" x="238" y="798.7" font-size="10">planned</text></svg>