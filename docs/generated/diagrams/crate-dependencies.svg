<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 450.6 1388.5" width="450.6" height="1388.5" role="img" aria-label="Dependency diagram: The crate graph. 30 nodes, 15 edges. Most connected: kernelCrate (9), bootCrate (3), elf (3)."><title>The crate graph</title><style>
svg{
  --surface:#fff; --surface-2:#f6f7f8; --sunk:#e4e7ea;
  --ink:#16191d; --ink-2:#3b434c; --muted:#6a737e;
  --rule:#d2d7dc; --rule-strong:#b3bbc3;
  --implemented:#2c6e4e; --implemented-bg:#dceae2;
  --inProgress:#2a5f8f; --inProgress-bg:#dae5f0;
  --writtenAhead:#6b4fa0; --writtenAhead-bg:#e5dff0;
  --planned:#6a737e; --planned-bg:#e4e7ea;
  --deferred:#87600b; --deferred-bg:#f3e8ce;
}
@media (prefers-color-scheme:dark){svg{
  --surface:#1a1e22; --surface-2:#21262b; --sunk:#0e1113;
  --ink:#e7eaed; --ink-2:#bfc6cd; --muted:#8d97a1;
  --rule:#2c3238; --rule-strong:#5a646e;
  --implemented:#6abf92; --implemented-bg:#16301f;
  --inProgress:#74acdb; --inProgress-bg:#122639;
  --writtenAhead:#a98fd8; --writtenAhead-bg:#241c38;
  --planned:#8d97a1; --planned-bg:#262b31;
  --deferred:#d9a83e; --deferred-bg:#2e2511;
}}

figure.diagram{margin:22px 0 26px; padding:0}
figure.diagram svg{display:block; max-width:100%; height:auto;
  background:var(--surface); border:1px solid var(--rule); border-radius:3px}
figure.diagram figcaption{margin-top:9px; font-size:13px; color:var(--muted); max-width:74ch}
figure.diagram figcaption .figname{color:var(--ink-2); font-weight:600}
.dg-text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:var(--ink)}
.dg-sub{fill:var(--muted)}
.dg-stereo{fill:var(--muted); letter-spacing:.02em}
.dg-row{fill:var(--ink-2)}
.dg-shape{fill:var(--surface-2); stroke:var(--rule-strong); stroke-width:1.1}
.dg-terminal{fill:var(--sunk); stroke:var(--rule-strong)}
.dg-note{fill:var(--surface-2); stroke:var(--rule); stroke-dasharray:3 2}
.dg-rule{stroke:var(--rule-strong); stroke-width:1}
.dg-cluster{fill:none; stroke:var(--rule); stroke-width:1; stroke-dasharray:4 3}
.dg-cluster-label{fill:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dg-edge{fill:none; stroke:var(--rule-strong); stroke-width:1.4}
.dg-edge-trace{stroke-dasharray:5 4}
.dg-edge-label{fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dg-edge-label-bg{fill:var(--surface); stroke:none}
.dg-head{fill:var(--rule-strong); stroke:none}
.dg-head-hollow{fill:var(--surface); stroke:var(--rule-strong); stroke-width:1.1}
.dg-legend{fill:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dg-mat-implemented{fill:var(--implemented-bg); stroke:var(--implemented)}
.dg-mat-inProgress{fill:var(--inProgress-bg); stroke:var(--inProgress)}
.dg-mat-writtenAhead{fill:var(--writtenAhead-bg); stroke:var(--writtenAhead)}
.dg-mat-planned{fill:var(--planned-bg); stroke:var(--planned)}
.dg-mat-deferred{fill:var(--deferred-bg); stroke:var(--deferred)}
a.dg-link{text-decoration:none}
</style><rect width="450.6" height="1388.5" fill="var(--surface)"/><defs><marker id="dg-crate-dependencies-arrow" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-head" d="M0,0 L9,3.5 L0,7 L1.6,3.5 z"/></marker><marker id="dg-crate-dependencies-open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-edge" d="M0.5,0.5 L9,4 L0.5,7.5"/></marker><marker id="dg-crate-dependencies-hollow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-head-hollow" d="M0.5,0.5 L11,5 L0.5,9.5 z"/></marker><marker id="dg-crate-dependencies-diamond" markerWidth="14" markerHeight="9" refX="0.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-head" d="M0.5,4.5 L7,0.5 L13.5,4.5 L7,8.5 z"/></marker></defs><path class="dg-edge dg-edge-trace" d="M119.7,838 L223.2,693.8 Q228.4,686.5 235.9,681.3 L345.3,606" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M119.7,838 L224.9,592.5 Q228.4,584.2 232.9,576.4 L332.7,401.5" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M119.7,838 L222.3,728 Q228.4,721.5 236.9,718.3 L348.4,676" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M119.7,838 L221.6,925.6 Q228.4,931.5 233.4,938.9 L337.6,1096" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M119.7,838 L220,802.5 Q228.4,799.5 236.6,795.7 L345.3,746" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M119.7,838 L223.6,677.8 Q228.4,670.2 234.2,663.3 L339,536" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M119.7,838 L219.8,809.9 Q228.4,807.5 237.4,808.1 L342.1,816" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M119.7,838 L220.8,899.8 Q228.4,904.5 236.7,908.1 L345.3,956" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M119.7,838 L221,907.4 Q228.4,912.5 235,918.6 L348.4,1026" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M112.5,628 L222.9,486.3 Q228.4,479.2 235.7,473.8 L332.7,401.5" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M112.5,628 L223.7,807.8 Q228.4,815.5 236.2,820 L348.4,886" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M112.5,628 L219.8,659.7 Q228.4,662.2 234.4,655.4 L339,536" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M98.1,908 L220,864.5 Q228.4,861.5 237.3,863.3 L348.4,886" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M98.1,978 L220.8,901.2 Q228.4,896.5 237.4,895.7 L348.4,886" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M98.1,978 L219.6,999.9 Q228.4,1001.5 235.3,1007.3 L337.6,1096" marker-end="url(#dg-crate-dependencies-open)"/><g><rect class="dg-shape dg-mat-writtenAhead" x="14" y="21.1" width="110.2" height="48" rx="4"/><text class="dg-text" x="69.1" y="42.1" text-anchor="middle" font-size="12">linuxAbi</text><text class="dg-text dg-sub" x="69.1" y="56.1" text-anchor="middle" font-size="10.5">libs/linux-abi</text><title>Three system call number tables, not two: x86-64&#x27;s own, AArch64&#x27;s generic one, and ARMv7-A&#x27;s EABI one.</title></g><g><rect class="dg-shape dg-mat-writtenAhead" x="23.5" y="91.1" width="91.3" height="48" rx="4"/><text class="dg-text" x="69.1" y="112.1" text-anchor="middle" font-size="12">ustack</text><text class="dg-text dg-sub" x="69.1" y="126.1" text-anchor="middle" font-size="10.5">libs/ustack</text><title>The initial process stack image: argc, argv, envp and the auxiliary vector, laid out as a program&#x27;s _start reads them, at both pointer widths.</title></g><g><rect class="dg-shape dg-mat-writtenAhead" x="29.8" y="161.1" width="78.7" height="48" rx="4"/><text class="dg-text" x="69.1" y="182.1" text-anchor="middle" font-size="12">cpio</text><text class="dg-text dg-sub" x="69.1" y="196.1" text-anchor="middle" font-size="10.5">libs/cpio</text><title>The newc reader the initramfs is unpacked with.</title></g><g><rect class="dg-shape dg-mat-writtenAhead" x="32.9" y="231.1" width="72.4" height="48" rx="4"/><text class="dg-text" x="69.1" y="252.1" text-anchor="middle" font-size="12">vfs</text><text class="dg-text dg-sub" x="69.1" y="266.1" text-anchor="middle" font-size="10.5">libs/vfs</text><title>Dentries with negative entries, mounts, the path walk, open file descriptions, descriptor tables, tmpfs over a page store the kernel supplies, initramfs unpacking and the getdents64 packer.</title></g><g><rect class="dg-shape dg-mat-implemented" x="23.5" y="301.1" width="91.3" height="48" rx="4"/><text class="dg-text" x="69.1" y="322.1" text-anchor="middle" font-size="12">procfs</text><text class="dg-text dg-sub" x="69.1" y="336.1" text-anchor="middle" font-size="10.5">libs/procfs</text><title>The text of /proc as pure functions: maps lines padded to their name column at both pointer widths, meminfo, status, stat and mounts, pinned byte for byte against lines a real Linux printed, and the maps parser the kern…</title></g><g><rect class="dg-shape dg-mat-implemented" x="23.5" y="371.1" width="91.3" height="48" rx="4"/><text class="dg-text" x="69.1" y="392.1" text-anchor="middle" font-size="12">virtio</text><text class="dg-text dg-sub" x="69.1" y="406.1" text-anchor="middle" font-size="10.5">libs/virtio</text></g><g><rect class="dg-shape dg-mat-implemented" x="25.7" y="604" width="86.8" height="48" rx="4"/><text class="dg-text" x="69.1" y="625" text-anchor="middle" font-size="12">bootCrate</text><text class="dg-text dg-sub" x="69.1" y="639" text-anchor="middle" font-size="10.5">boot</text></g><g><rect class="dg-shape dg-mat-writtenAhead" x="20.3" y="674" width="97.6" height="48" rx="4"/><text class="dg-text" x="69.1" y="695" text-anchor="middle" font-size="12">netwire</text><text class="dg-text dg-sub" x="69.1" y="709" text-anchor="middle" font-size="10.5">libs/netwire</text><title>The byte-level half of the net core, written ahead of the networking stage: Ethernet with one 802.1Q tag, ARP, IPv4 with its options, IPv6 with the extension-header walk, ICMPv4, ICMPv6 and Neighbor Discovery, UDP, and TCP headers with their negotiated options, each parsed without allocation and emitted into a caller&#x27;s buffer, checksums verified where the format carries them.</title></g><g><rect class="dg-shape dg-mat-writtenAhead" x="23.5" y="744" width="91.3" height="48" rx="4"/><text class="dg-text" x="69.1" y="765" text-anchor="middle" font-size="12">nettcp</text><text class="dg-text dg-sub" x="69.1" y="779" text-anchor="middle" font-size="10.5">libs/nettcp</text><title>The TCP state machine, written ahead of the networking stage and above netwire: the eleven states of RFC 9293 in the standard&#x27;s order, reassembly of what arrives out of order, window scaling, selective acknowledgment blocks, Nagle, delayed acknowledgments, silly-window avoidance and the zero-window probe, retransmission timing by RFC 6298 with Karn&#x27;s algorithm, and NewReno congestion control.</title></g><g><rect class="dg-shape dg-mat-implemented" x="18.5" y="814" width="101.2" height="48" rx="4"/><text class="dg-text" x="69.1" y="835" text-anchor="middle" font-size="12">kernelCrate</text><text class="dg-text dg-sub" x="69.1" y="849" text-anchor="middle" font-size="10.5">kernel</text></g><g><rect class="dg-shape dg-mat-implemented" x="40.1" y="884" width="58" height="48" rx="4"/><text class="dg-text" x="69.1" y="905" text-anchor="middle" font-size="12">xtask</text><text class="dg-text dg-sub" x="69.1" y="919" text-anchor="middle" font-size="10.5">xtask</text><title>Cross-compiles both halves, writes the FAT32 image with its own writer, converts the ARMv7-A loader ELF to PE32, drives QEMU.</title></g><g><rect class="dg-shape dg-mat-implemented" x="40.1" y="954" width="58" height="48" rx="4"/><text class="dg-text" x="69.1" y="975" text-anchor="middle" font-size="12">fuzz</text><text class="dg-text dg-sub" x="69.1" y="989" text-anchor="middle" font-size="10.5">fuzz</text></g><g><rect class="dg-shape dg-mat-writtenAhead" x="192.2" y="14" width="72.4" height="48" rx="4"/><text class="dg-text" x="228.4" y="35" text-anchor="middle" font-size="12">netCore</text><text class="dg-text dg-sub" x="228.4" y="49" text-anchor="middle" font-size="10.5">libs/net</text><title>The net core, written ahead of the networking stage: interfaces and the addresses on them, one routing table for both families, a neighbour cache that answers ARP&#x27;s question and Neighbor Discovery&#x27;s the same way, IPv4 fragmentation and reassembly under a ceiling a stranger cannot raise, ICMP echo in both directions with the unprivileged socket ping uses, UDP with Linux&#x27;s socket-matching order, and TCP connections and listeners over nettcp.</title></g><g><rect class="dg-shape dg-mat-writtenAhead" x="192.2" y="599.2" width="72.4" height="48" rx="4"/><text class="dg-text" x="228.4" y="620.2" text-anchor="middle" font-size="12">pci</text><text class="dg-text dg-sub" x="228.4" y="634.2" text-anchor="middle" font-size="10.5">libs/pci</text><title>PCI configuration space over a ConfigSpace the caller implements: ECAM geometry, headers, BAR decoding and sizing, both capability lists with a visited set, MSI-X, the bus walk without recursion or allocation, and virtio&#x27;s PCI transport.</title></g><g><rect class="dg-shape dg-mat-implemented" x="170.2" y="736.5" width="116.5" height="48" rx="4"/><text class="dg-text" x="228.4" y="757.5" text-anchor="middle" font-size="12">nativeAbi</text><text class="dg-text dg-sub" x="228.4" y="771.5" text-anchor="middle" font-size="10.5">libs/native-abi</text><title>The native ABI&#x27;s numbers, handle values, rights, signals, errno names and repr(C) layouts.</title></g><g><rect class="dg-shape dg-mat-implemented" x="179.6" y="1016.5" width="97.6" height="48" rx="4"/><text class="dg-text" x="228.4" y="1037.5" text-anchor="middle" font-size="12">objects</text><text class="dg-text dg-sub" x="228.4" y="1051.5" text-anchor="middle" font-size="10.5">libs/objects</text><title>The handle table and the channel message queue, generic over what a handle names.</title></g><g><rect class="dg-shape dg-mat-writtenAhead" x="185.9" y="1086.5" width="85" height="48" rx="4"/><text class="dg-text" x="228.4" y="1107.5" text-anchor="middle" font-size="12">btrfs</text><text class="dg-text dg-sub" x="228.4" y="1121.5" text-anchor="middle" font-size="10.5">libs/btrfs</text><title>The btrfs read path, allocating nothing: parsing, mount bootstrap, lookup, readdir and read, and zlib, LZO and zstd decoders.</title></g><g><rect class="dg-shape dg-mat-writtenAhead" x="173.3" y="1156.5" width="110.2" height="48" rx="4"/><text class="dg-text" x="228.4" y="1177.5" text-anchor="middle" font-size="12">btrfsVfs</text><text class="dg-text dg-sub" x="228.4" y="1191.5" text-anchor="middle" font-size="10.5">libs/btrfs-vfs</text><title>btrfs mounted into the VFS: FileSystem and Inode over the read path, read-only, holding no lock across I/O.</title></g><g><rect class="dg-shape dg-mat-writtenAhead" x="181.4" y="1226.5" width="94" height="48" rx="4"/><text class="dg-text" x="228.4" y="1247.5" text-anchor="middle" font-size="12">blockQueue</text><text class="dg-text dg-sub" x="228.4" y="1261.5" text-anchor="middle" font-size="10.5">libs/block</text><title>The block core&#x27;s request queue: merging, flush and FUA barriers no request crosses, deadline scheduling.</title></g><g><rect class="dg-shape dg-mat-planned" x="179.6" y="1296.5" width="97.6" height="48" rx="4"/><text class="dg-text" x="228.4" y="1317.5" text-anchor="middle" font-size="12">seccompBpf</text><text class="dg-text dg-sub" x="228.4" y="1331.5" text-anchor="middle" font-size="10.5">libs/seccomp</text><title>The classic-BPF interpreter as a pure function over bytes.</title></g><g><rect class="dg-shape dg-mat-implemented" x="332.7" y="377.5" width="103.9" height="48" rx="4"/><text class="dg-text" x="384.6" y="398.5" text-anchor="middle" font-size="12">bootinfo</text><text class="dg-text dg-sub" x="384.6" y="412.5" text-anchor="middle" font-size="10.5">libs/bootinfo</text><title>The hand-off ABI, both address layouts, checked at compile time on every build.</title></g><g><rect class="dg-shape dg-mat-implemented" x="339" y="512" width="91.3" height="48" rx="4"/><text class="dg-text" x="384.6" y="533" text-anchor="middle" font-size="12">paging</text><text class="dg-text dg-sub" x="384.6" y="547" text-anchor="middle" font-size="10.5">libs/paging</text></g><g><rect class="dg-shape dg-mat-implemented" x="345.3" y="582" width="78.7" height="48" rx="4"/><text class="dg-text" x="384.6" y="603" text-anchor="middle" font-size="12">acpi</text><text class="dg-text dg-sub" x="384.6" y="617" text-anchor="middle" font-size="10.5">libs/acpi</text><title>Reached at stage 3: the MADT walk the interrupt controller needed.</title></g><g><rect class="dg-shape dg-mat-implemented" x="348.4" y="652" width="72.4" height="48" rx="4"/><text class="dg-text" x="384.6" y="673" text-anchor="middle" font-size="12">fdt</text><text class="dg-text dg-sub" x="384.6" y="687" text-anchor="middle" font-size="10.5">libs/fdt</text><title>Reached at stage 1 on ARMv7-A: console, GIC, timer interrupt and PSCI conduit come from it there.</title></g><g><rect class="dg-shape dg-mat-implemented" x="345.3" y="722" width="78.7" height="48" rx="4"/><text class="dg-text" x="384.6" y="743" text-anchor="middle" font-size="12">heap</text><text class="dg-text dg-sub" x="384.6" y="757" text-anchor="middle" font-size="10.5">libs/heap</text><title>The body has no unsafe; the crate cannot forbid it because declaring Backing as an unsafe trait is the point.</title></g><g><rect class="dg-shape dg-mat-implemented" x="342.1" y="792" width="85" height="48" rx="4"/><text class="dg-text" x="384.6" y="813" text-anchor="middle" font-size="12">sched</text><text class="dg-text dg-sub" x="384.6" y="827" text-anchor="middle" font-size="10.5">libs/sched</text><title>The half of the scheduler that is arithmetic: the EEVDF tree, weights, lag, the domain partition.</title></g><g><rect class="dg-shape dg-mat-implemented" x="348.4" y="862" width="72.4" height="48" rx="4"/><text class="dg-text" x="384.6" y="883" text-anchor="middle" font-size="12">elf</text><text class="dg-text dg-sub" x="384.6" y="897" text-anchor="middle" font-size="10.5">libs/elf</text><title>ELF64 and, since the ARMv7-A port, ELF32.</title></g><g><rect class="dg-shape dg-mat-implemented" x="345.3" y="932" width="78.7" height="48" rx="4"/><text class="dg-text" x="384.6" y="953" text-anchor="middle" font-size="12">sync</text><text class="dg-text dg-sub" x="384.6" y="967" text-anchor="middle" font-size="10.5">libs/sync</text><title>Reached at stage 4: SpinLock and IrqSpinLock guard every shared kernel structure.</title></g><g><rect class="dg-shape dg-mat-implemented" x="348.4" y="1002" width="72.4" height="48" rx="4"/><text class="dg-text" x="384.6" y="1023" text-anchor="middle" font-size="12">vma</text><text class="dg-text dg-sub" x="384.6" y="1037" text-anchor="middle" font-size="10.5">libs/vma</text><title>Written for stage 6; reached at stage 2 as the vmap arena&#x27;s range map.</title></g><g><rect class="dg-shape dg-mat-implemented" x="337.6" y="1072" width="94" height="48" rx="4"/><text class="dg-text" x="384.6" y="1093" text-anchor="middle" font-size="12">frameCrate</text><text class="dg-text dg-sub" x="384.6" y="1107" text-anchor="middle" font-size="10.5">libs/frame</text></g><rect class="dg-shape dg-mat-implemented" x="14" y="1366.5" width="11" height="11" rx="2"/><text class="dg-text dg-legend" x="30" y="1376" font-size="10">implemented</text><rect class="dg-shape dg-mat-writtenAhead" x="112" y="1366.5" width="11" height="11" rx="2"/><text class="dg-text dg-legend" x="128" y="1376" font-size="10">written ahead</text><rect class="dg-shape dg-mat-planned" x="222" y="1366.5" width="11" height="11" rx="2"/><text class="dg-text dg-legend" x="238" y="1376" font-size="10">planned</text></svg>