<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 450.6 1187.9" width="450.6" height="1187.9" role="img" aria-label="Dependency diagram: The crate graph. 27 nodes, 15 edges. Most connected: kernelCrate (9), bootCrate (3), elf (3)."><title>The crate graph</title><style>
svg{
  --surface:#fff; --surface-2:#f6f7f8; --sunk:#e4e7ea;
  --ink:#16191d; --ink-2:#3b434c; --muted:#6a737e;
  --rule:#d2d7dc; --rule-strong:#b3bbc3;
  --implemented:#2c6e4e; --implemented-bg:#dceae2;
  --inProgress:#2a5f8f; --inProgress-bg:#dae5f0;
  --writtenAhead:#6b4fa0; --writtenAhead-bg:#e5dff0;
  --planned:#6a737e; --planned-bg:#e4e7ea;
  --deferred:#87600b; --deferred-bg:#f3e8ce;
}
@media (prefers-color-scheme:dark){svg{
  --surface:#1a1e22; --surface-2:#21262b; --sunk:#0e1113;
  --ink:#e7eaed; --ink-2:#bfc6cd; --muted:#8d97a1;
  --rule:#2c3238; --rule-strong:#5a646e;
  --implemented:#6abf92; --implemented-bg:#16301f;
  --inProgress:#74acdb; --inProgress-bg:#122639;
  --writtenAhead:#a98fd8; --writtenAhead-bg:#241c38;
  --planned:#8d97a1; --planned-bg:#262b31;
  --deferred:#d9a83e; --deferred-bg:#2e2511;
}}

figure.diagram{margin:22px 0 26px; padding:0}
figure.diagram svg{display:block; max-width:100%; height:auto;
  background:var(--surface); border:1px solid var(--rule); border-radius:3px}
figure.diagram figcaption{margin-top:9px; font-size:13px; color:var(--muted); max-width:74ch}
figure.diagram figcaption .figname{color:var(--ink-2); font-weight:600}
.dg-text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:var(--ink)}
.dg-sub{fill:var(--muted)}
.dg-stereo{fill:var(--muted); letter-spacing:.02em}
.dg-row{fill:var(--ink-2)}
.dg-shape{fill:var(--surface-2); stroke:var(--rule-strong); stroke-width:1.1}
.dg-terminal{fill:var(--sunk); stroke:var(--rule-strong)}
.dg-note{fill:var(--surface-2); stroke:var(--rule); stroke-dasharray:3 2}
.dg-rule{stroke:var(--rule-strong); stroke-width:1}
.dg-cluster{fill:none; stroke:var(--rule); stroke-width:1; stroke-dasharray:4 3}
.dg-cluster-label{fill:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dg-edge{fill:none; stroke:var(--rule-strong); stroke-width:1.4}
.dg-edge-trace{stroke-dasharray:5 4}
.dg-edge-label{fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dg-edge-label-bg{fill:var(--surface); stroke:none}
.dg-head{fill:var(--rule-strong); stroke:none}
.dg-head-hollow{fill:var(--surface); stroke:var(--rule-strong); stroke-width:1.1}
.dg-legend{fill:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dg-mat-implemented{fill:var(--implemented-bg); stroke:var(--implemented)}
.dg-mat-inProgress{fill:var(--inProgress-bg); stroke:var(--inProgress)}
.dg-mat-writtenAhead{fill:var(--writtenAhead-bg); stroke:var(--writtenAhead)}
.dg-mat-planned{fill:var(--planned-bg); stroke:var(--planned)}
.dg-mat-deferred{fill:var(--deferred-bg); stroke:var(--deferred)}
a.dg-link{text-decoration:none}
</style><rect width="450.6" height="1187.9" fill="var(--surface)"/><defs><marker id="dg-crate-dependencies-arrow" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-head" d="M0,0 L9,3.5 L0,7 L1.6,3.5 z"/></marker><marker id="dg-crate-dependencies-open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-edge" d="M0.5,0.5 L9,4 L0.5,7.5"/></marker><marker id="dg-crate-dependencies-hollow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-head-hollow" d="M0.5,0.5 L11,5 L0.5,9.5 z"/></marker><marker id="dg-crate-dependencies-diamond" markerWidth="14" markerHeight="9" refX="0.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-head" d="M0.5,4.5 L7,0.5 L13.5,4.5 L7,8.5 z"/></marker></defs><path class="dg-edge dg-edge-trace" d="M122.8,847.1 L226.3,703.2 Q231.6,695.9 238.9,690.7 L345.3,614.2" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M122.8,847.1 L228.1,601.9 Q231.6,593.7 235.9,585.8 L332.7,409.7" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M122.8,847.1 L225.4,737.5 Q231.6,730.9 240,727.6 L348.4,684.2" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M122.8,847.1 L224.8,935 Q231.6,940.9 236.5,948.5 L337.6,1104.2" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M122.8,847.1 L223.1,811.9 Q231.6,808.9 239.7,805 L345.3,754.2" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M122.8,847.1 L226.7,687.2 Q231.6,679.7 237.2,672.6 L339,544.2" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M122.8,847.1 L222.9,819.3 Q231.6,816.9 240.6,817.5 L342.1,824.2" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M122.8,847.1 L223.9,909.2 Q231.6,913.9 239.8,917.6 L345.3,964.2" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M122.8,847.1 L224.2,916.8 Q231.6,921.9 238.1,928.2 L348.4,1034.2" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M115.7,637.1 L226.1,495.8 Q231.6,488.7 238.7,483.1 L332.7,409.7" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M115.7,637.1 L226.9,817.3 Q231.6,824.9 239.3,829.5 L348.4,894.2" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M115.7,637.1 L223,669.1 Q231.6,671.7 237.4,664.8 L339,544.2" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M101.2,917.1 L223.1,873.9 Q231.6,870.9 240.4,872.7 L348.4,894.2" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M101.2,987.1 L224,910.7 Q231.6,905.9 240.6,905 L348.4,894.2" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M101.2,987.1 L222.7,1009.3 Q231.6,1010.9 238.4,1016.9 L337.6,1104.2" marker-end="url(#dg-crate-dependencies-open)"/><g><rect class="dg-shape dg-mat-writtenAhead" x="17.1" y="14" width="110.2" height="48" rx="4"/><text class="dg-text" x="72.2" y="35" text-anchor="middle" font-size="12">linuxAbi</text><text class="dg-text dg-sub" x="72.2" y="49" text-anchor="middle" font-size="10.5">libs/linux-abi</text><title>Three system call number tables, not two: x86-64&#x27;s own, AArch64&#x27;s generic one, and ARMv7-A&#x27;s EABI one.</title></g><g><rect class="dg-shape dg-mat-writtenAhead" x="26.6" y="84" width="91.3" height="48" rx="4"/><text class="dg-text" x="72.2" y="105" text-anchor="middle" font-size="12">ustack</text><text class="dg-text dg-sub" x="72.2" y="119" text-anchor="middle" font-size="10.5">libs/ustack</text><title>The initial process stack image: argc, argv, envp and the auxiliary vector, laid out as a program&#x27;s _start reads them, at both pointer widths.</title></g><g><rect class="dg-shape dg-mat-writtenAhead" x="32.9" y="154" width="78.7" height="48" rx="4"/><text class="dg-text" x="72.2" y="175" text-anchor="middle" font-size="12">cpio</text><text class="dg-text dg-sub" x="72.2" y="189" text-anchor="middle" font-size="10.5">libs/cpio</text></g><g><rect class="dg-shape dg-mat-writtenAhead" x="36" y="224" width="72.4" height="48" rx="4"/><text class="dg-text" x="72.2" y="245" text-anchor="middle" font-size="12">vfs</text><text class="dg-text dg-sub" x="72.2" y="259" text-anchor="middle" font-size="10.5">libs/vfs</text><title>Dentries with negative entries, mounts, the path walk, open file descriptions, descriptor tables, tmpfs over a page store the kernel supplies, initramfs unpacking and the getdents64 packer.</title></g><g><rect class="dg-shape dg-mat-implemented" x="26.6" y="294" width="91.3" height="48" rx="4"/><text class="dg-text" x="72.2" y="315" text-anchor="middle" font-size="12">procfs</text><text class="dg-text dg-sub" x="72.2" y="329" text-anchor="middle" font-size="10.5">libs/procfs</text><title>The text of /proc as pure functions: maps lines padded to their name column at both pointer widths, meminfo, status, stat and mounts, pinned byte for byte against lines a real Linux printed, and the maps parser the kern…</title></g><g><rect class="dg-shape dg-mat-implemented" x="26.6" y="364" width="91.3" height="48" rx="4"/><text class="dg-text" x="72.2" y="385" text-anchor="middle" font-size="12">virtio</text><text class="dg-text dg-sub" x="72.2" y="399" text-anchor="middle" font-size="10.5">libs/virtio</text></g><g><rect class="dg-shape dg-mat-implemented" x="28.9" y="613.1" width="86.8" height="48" rx="4"/><text class="dg-text" x="72.2" y="634.1" text-anchor="middle" font-size="12">bootCrate</text><text class="dg-text dg-sub" x="72.2" y="648.1" text-anchor="middle" font-size="10.5">boot</text></g><g><rect class="dg-shape dg-mat-writtenAhead" x="36" y="683.1" width="72.4" height="48" rx="4"/><text class="dg-text" x="72.2" y="704.1" text-anchor="middle" font-size="12">pci</text><text class="dg-text dg-sub" x="72.2" y="718.1" text-anchor="middle" font-size="10.5">libs/pci</text><title>PCI configuration space over a ConfigSpace the caller implements: ECAM geometry, headers, BAR decoding and sizing, both capability lists with a visited set, MSI-X, the bus walk without recursion or allocation, and virtio&#x27;s PCI transport.</title></g><g><rect class="dg-shape dg-mat-implemented" x="14" y="753.1" width="116.5" height="48" rx="4"/><text class="dg-text" x="72.2" y="774.1" text-anchor="middle" font-size="12">nativeAbi</text><text class="dg-text dg-sub" x="72.2" y="788.1" text-anchor="middle" font-size="10.5">libs/native-abi</text><title>The native ABI&#x27;s numbers, handle values, rights, signals, errno names and repr(C) layouts.</title></g><g><rect class="dg-shape dg-mat-implemented" x="21.6" y="823.1" width="101.2" height="48" rx="4"/><text class="dg-text" x="72.2" y="844.1" text-anchor="middle" font-size="12">kernelCrate</text><text class="dg-text dg-sub" x="72.2" y="858.1" text-anchor="middle" font-size="10.5">kernel</text></g><g><rect class="dg-shape dg-mat-implemented" x="43.2" y="893.1" width="58" height="48" rx="4"/><text class="dg-text" x="72.2" y="914.1" text-anchor="middle" font-size="12">xtask</text><text class="dg-text dg-sub" x="72.2" y="928.1" text-anchor="middle" font-size="10.5">xtask</text><title>Cross-compiles both halves, writes the FAT32 image with its own writer, converts the ARMv7-A loader ELF to PE32, drives QEMU.</title></g><g><rect class="dg-shape dg-mat-implemented" x="43.2" y="963.1" width="58" height="48" rx="4"/><text class="dg-text" x="72.2" y="984.1" text-anchor="middle" font-size="12">fuzz</text><text class="dg-text dg-sub" x="72.2" y="998.1" text-anchor="middle" font-size="10.5">fuzz</text></g><g><rect class="dg-shape dg-mat-implemented" x="182.8" y="35.7" width="97.6" height="48" rx="4"/><text class="dg-text" x="231.6" y="56.7" text-anchor="middle" font-size="12">objects</text><text class="dg-text dg-sub" x="231.6" y="70.7" text-anchor="middle" font-size="10.5">libs/objects</text><title>The handle table and the channel message queue, generic over what a handle names.</title></g><g><rect class="dg-shape dg-mat-writtenAhead" x="189.1" y="608.7" width="85" height="48" rx="4"/><text class="dg-text" x="231.6" y="629.7" text-anchor="middle" font-size="12">btrfs</text><text class="dg-text dg-sub" x="231.6" y="643.7" text-anchor="middle" font-size="10.5">libs/btrfs</text><title>The btrfs read path, allocating nothing: parsing, mount bootstrap, lookup, readdir and read, and zlib, LZO and zstd decoders.</title></g><g><rect class="dg-shape dg-mat-writtenAhead" x="176.5" y="745.9" width="110.2" height="48" rx="4"/><text class="dg-text" x="231.6" y="766.9" text-anchor="middle" font-size="12">btrfsVfs</text><text class="dg-text dg-sub" x="231.6" y="780.9" text-anchor="middle" font-size="10.5">libs/btrfs-vfs</text><title>btrfs mounted into the VFS: FileSystem and Inode over the read path, read-only, holding no lock across I/O.</title></g><g><rect class="dg-shape dg-mat-writtenAhead" x="184.6" y="1025.9" width="94" height="48" rx="4"/><text class="dg-text" x="231.6" y="1046.9" text-anchor="middle" font-size="12">blockQueue</text><text class="dg-text dg-sub" x="231.6" y="1060.9" text-anchor="middle" font-size="10.5">libs/block</text><title>The block core&#x27;s request queue: merging, flush and FUA barriers no request crosses, deadline scheduling.</title></g><g><rect class="dg-shape dg-mat-planned" x="182.8" y="1095.9" width="97.6" height="48" rx="4"/><text class="dg-text" x="231.6" y="1116.9" text-anchor="middle" font-size="12">seccompBpf</text><text class="dg-text dg-sub" x="231.6" y="1130.9" text-anchor="middle" font-size="10.5">libs/seccomp</text><title>The classic-BPF interpreter as a pure function over bytes.</title></g><g><rect class="dg-shape dg-mat-implemented" x="332.7" y="385.7" width="103.9" height="48" rx="4"/><text class="dg-text" x="384.6" y="406.7" text-anchor="middle" font-size="12">bootinfo</text><text class="dg-text dg-sub" x="384.6" y="420.7" text-anchor="middle" font-size="10.5">libs/bootinfo</text><title>The hand-off ABI, both address layouts, checked at compile time on every build.</title></g><g><rect class="dg-shape dg-mat-implemented" x="339" y="520.2" width="91.3" height="48" rx="4"/><text class="dg-text" x="384.6" y="541.2" text-anchor="middle" font-size="12">paging</text><text class="dg-text dg-sub" x="384.6" y="555.2" text-anchor="middle" font-size="10.5">libs/paging</text></g><g><rect class="dg-shape dg-mat-implemented" x="345.3" y="590.2" width="78.7" height="48" rx="4"/><text class="dg-text" x="384.6" y="611.2" text-anchor="middle" font-size="12">acpi</text><text class="dg-text dg-sub" x="384.6" y="625.2" text-anchor="middle" font-size="10.5">libs/acpi</text><title>Reached at stage 3: the MADT walk the interrupt controller needed.</title></g><g><rect class="dg-shape dg-mat-implemented" x="348.4" y="660.2" width="72.4" height="48" rx="4"/><text class="dg-text" x="384.6" y="681.2" text-anchor="middle" font-size="12">fdt</text><text class="dg-text dg-sub" x="384.6" y="695.2" text-anchor="middle" font-size="10.5">libs/fdt</text><title>Reached at stage 1 on ARMv7-A: console, GIC, timer interrupt and PSCI conduit come from it there.</title></g><g><rect class="dg-shape dg-mat-implemented" x="345.3" y="730.2" width="78.7" height="48" rx="4"/><text class="dg-text" x="384.6" y="751.2" text-anchor="middle" font-size="12">heap</text><text class="dg-text dg-sub" x="384.6" y="765.2" text-anchor="middle" font-size="10.5">libs/heap</text><title>The body has no unsafe; the crate cannot forbid it because declaring Backing as an unsafe trait is the point.</title></g><g><rect class="dg-shape dg-mat-implemented" x="342.1" y="800.2" width="85" height="48" rx="4"/><text class="dg-text" x="384.6" y="821.2" text-anchor="middle" font-size="12">sched</text><text class="dg-text dg-sub" x="384.6" y="835.2" text-anchor="middle" font-size="10.5">libs/sched</text><title>The half of the scheduler that is arithmetic: the EEVDF tree, weights, lag, the domain partition.</title></g><g><rect class="dg-shape dg-mat-implemented" x="348.4" y="870.2" width="72.4" height="48" rx="4"/><text class="dg-text" x="384.6" y="891.2" text-anchor="middle" font-size="12">elf</text><text class="dg-text dg-sub" x="384.6" y="905.2" text-anchor="middle" font-size="10.5">libs/elf</text><title>ELF64 and, since the ARMv7-A port, ELF32.</title></g><g><rect class="dg-shape dg-mat-implemented" x="345.3" y="940.2" width="78.7" height="48" rx="4"/><text class="dg-text" x="384.6" y="961.2" text-anchor="middle" font-size="12">sync</text><text class="dg-text dg-sub" x="384.6" y="975.2" text-anchor="middle" font-size="10.5">libs/sync</text><title>Reached at stage 4: SpinLock and IrqSpinLock guard every shared kernel structure.</title></g><g><rect class="dg-shape dg-mat-implemented" x="348.4" y="1010.2" width="72.4" height="48" rx="4"/><text class="dg-text" x="384.6" y="1031.2" text-anchor="middle" font-size="12">vma</text><text class="dg-text dg-sub" x="384.6" y="1045.2" text-anchor="middle" font-size="10.5">libs/vma</text><title>Written for stage 6; reached at stage 2 as the vmap arena&#x27;s range map.</title></g><g><rect class="dg-shape dg-mat-implemented" x="337.6" y="1080.2" width="94" height="48" rx="4"/><text class="dg-text" x="384.6" y="1101.2" text-anchor="middle" font-size="12">frameCrate</text><text class="dg-text dg-sub" x="384.6" y="1115.2" text-anchor="middle" font-size="10.5">libs/frame</text></g><rect class="dg-shape dg-mat-implemented" x="14" y="1165.9" width="11" height="11" rx="2"/><text class="dg-text dg-legend" x="30" y="1175.4" font-size="10">implemented</text><rect class="dg-shape dg-mat-writtenAhead" x="112" y="1165.9" width="11" height="11" rx="2"/><text class="dg-text dg-legend" x="128" y="1175.4" font-size="10">written ahead</text><rect class="dg-shape dg-mat-planned" x="222" y="1165.9" width="11" height="11" rx="2"/><text class="dg-text dg-legend" x="238" y="1175.4" font-size="10">planned</text></svg>