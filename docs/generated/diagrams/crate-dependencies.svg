<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 294.4 978.2" width="294.4" height="978.2" role="img" aria-label="Dependency diagram: The crate graph. 22 nodes, 15 edges. Most connected: kernelCrate (9), bootCrate (3), elf (3)."><title>The crate graph</title><style>
svg{
  --surface:#fff; --surface-2:#f6f7f8; --sunk:#e4e7ea;
  --ink:#16191d; --ink-2:#3b434c; --muted:#6a737e;
  --rule:#d2d7dc; --rule-strong:#b3bbc3;
  --implemented:#2c6e4e; --implemented-bg:#dceae2;
  --inProgress:#2a5f8f; --inProgress-bg:#dae5f0;
  --writtenAhead:#6b4fa0; --writtenAhead-bg:#e5dff0;
  --planned:#6a737e; --planned-bg:#e4e7ea;
  --deferred:#87600b; --deferred-bg:#f3e8ce;
}
@media (prefers-color-scheme:dark){svg{
  --surface:#1a1e22; --surface-2:#21262b; --sunk:#0e1113;
  --ink:#e7eaed; --ink-2:#bfc6cd; --muted:#8d97a1;
  --rule:#2c3238; --rule-strong:#5a646e;
  --implemented:#6abf92; --implemented-bg:#16301f;
  --inProgress:#74acdb; --inProgress-bg:#122639;
  --writtenAhead:#a98fd8; --writtenAhead-bg:#241c38;
  --planned:#8d97a1; --planned-bg:#262b31;
  --deferred:#d9a83e; --deferred-bg:#2e2511;
}}

figure.diagram{margin:22px 0 26px; padding:0}
figure.diagram svg{display:block; max-width:100%; height:auto;
  background:var(--surface); border:1px solid var(--rule); border-radius:3px}
figure.diagram figcaption{margin-top:9px; font-size:13px; color:var(--muted); max-width:74ch}
figure.diagram figcaption .figname{color:var(--ink-2); font-weight:600}
.dg-text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:var(--ink)}
.dg-sub{fill:var(--muted)}
.dg-stereo{fill:var(--muted); letter-spacing:.02em}
.dg-row{fill:var(--ink-2)}
.dg-shape{fill:var(--surface-2); stroke:var(--rule-strong); stroke-width:1.1}
.dg-terminal{fill:var(--sunk); stroke:var(--rule-strong)}
.dg-note{fill:var(--surface-2); stroke:var(--rule); stroke-dasharray:3 2}
.dg-rule{stroke:var(--rule-strong); stroke-width:1}
.dg-cluster{fill:none; stroke:var(--rule); stroke-width:1; stroke-dasharray:4 3}
.dg-cluster-label{fill:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dg-edge{fill:none; stroke:var(--rule-strong); stroke-width:1.4}
.dg-edge-trace{stroke-dasharray:5 4}
.dg-edge-label{fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dg-edge-label-bg{fill:var(--surface); stroke:none}
.dg-head{fill:var(--rule-strong); stroke:none}
.dg-head-hollow{fill:var(--surface); stroke:var(--rule-strong); stroke-width:1.1}
.dg-legend{fill:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dg-mat-implemented{fill:var(--implemented-bg); stroke:var(--implemented)}
.dg-mat-inProgress{fill:var(--inProgress-bg); stroke:var(--inProgress)}
.dg-mat-writtenAhead{fill:var(--writtenAhead-bg); stroke:var(--writtenAhead)}
.dg-mat-planned{fill:var(--planned-bg); stroke:var(--planned)}
.dg-mat-deferred{fill:var(--deferred-bg); stroke:var(--deferred)}
a.dg-link{text-decoration:none}
</style><rect width="294.4" height="978.2" fill="var(--surface)"/><defs><marker id="dg-crate-dependencies-arrow" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-head" d="M0,0 L9,3.5 L0,7 L1.6,3.5 z"/></marker><marker id="dg-crate-dependencies-open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-edge" d="M0.5,0.5 L9,4 L0.5,7.5"/></marker><marker id="dg-crate-dependencies-hollow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-head-hollow" d="M0.5,0.5 L11,5 L0.5,9.5 z"/></marker><marker id="dg-crate-dependencies-diamond" markerWidth="14" markerHeight="9" refX="0.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-head" d="M0.5,4.5 L7,0.5 L13.5,4.5 L7,8.5 z"/></marker></defs><path class="dg-edge dg-edge-trace" d="M122.8,478.5 L189.1,395.2" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M122.8,478.5 L176.5,185.2" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M122.8,478.5 L192.2,465.2" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M122.8,478.5 L181.4,745.2" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M122.8,478.5 L189.1,325.2" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M122.8,478.5 L182.8,255.2" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M122.8,478.5 L185.9,605.2" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M122.8,478.5 L189.1,535.2" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M122.8,478.5 L192.2,675.2" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M115.7,408.5 L176.5,185.2" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M115.7,408.5 L192.2,815.2" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M115.7,408.5 L182.8,255.2" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M101.2,840.2 L192.2,815.2" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M101.2,770.2 L192.2,815.2" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M101.2,770.2 L181.4,745.2" marker-end="url(#dg-crate-dependencies-open)"/><g><rect class="dg-shape dg-mat-writtenAhead" x="17.1" y="14" width="110.2" height="48" rx="4"/><text class="dg-text" x="72.2" y="35" text-anchor="middle" font-size="12">linuxAbi</text><text class="dg-text dg-sub" x="72.2" y="49" text-anchor="middle" font-size="10.5">libs/linux-abi</text><title>Three system call number tables, not two: x86-64&#x27;s own, AArch64&#x27;s generic one, and ARMv7-A&#x27;s EABI one.</title></g><g><rect class="dg-shape dg-mat-writtenAhead" x="26.6" y="84" width="91.3" height="48" rx="4"/><text class="dg-text" x="72.2" y="105" text-anchor="middle" font-size="12">ustack</text><text class="dg-text dg-sub" x="72.2" y="119" text-anchor="middle" font-size="10.5">libs/ustack</text><title>The initial process stack image: argc, argv, envp and the auxiliary vector, laid out as a program&#x27;s _start reads them, at both pointer widths.</title></g><g><rect class="dg-shape dg-mat-writtenAhead" x="32.9" y="154" width="78.7" height="48" rx="4"/><text class="dg-text" x="72.2" y="175" text-anchor="middle" font-size="12">cpio</text><text class="dg-text dg-sub" x="72.2" y="189" text-anchor="middle" font-size="10.5">libs/cpio</text></g><g><rect class="dg-shape dg-mat-writtenAhead" x="26.6" y="224" width="91.3" height="48" rx="4"/><text class="dg-text" x="72.2" y="245" text-anchor="middle" font-size="12">virtio</text><text class="dg-text dg-sub" x="72.2" y="259" text-anchor="middle" font-size="10.5">libs/virtio</text></g><g><rect class="dg-shape dg-mat-implemented" x="28.9" y="384.5" width="86.8" height="48" rx="4"/><text class="dg-text" x="72.2" y="405.5" text-anchor="middle" font-size="12">bootCrate</text><text class="dg-text dg-sub" x="72.2" y="419.5" text-anchor="middle" font-size="10.5">boot</text></g><g><rect class="dg-shape dg-mat-implemented" x="21.6" y="454.5" width="101.2" height="48" rx="4"/><text class="dg-text" x="72.2" y="475.5" text-anchor="middle" font-size="12">kernelCrate</text><text class="dg-text dg-sub" x="72.2" y="489.5" text-anchor="middle" font-size="10.5">kernel</text></g><g><rect class="dg-shape dg-mat-writtenAhead" x="14" y="524.5" width="116.5" height="48" rx="4"/><text class="dg-text" x="72.2" y="545.5" text-anchor="middle" font-size="12">nativeAbi</text><text class="dg-text dg-sub" x="72.2" y="559.5" text-anchor="middle" font-size="10.5">libs/native-abi</text><title>The native ABI&#x27;s numbers, handle values, rights, signals, errno names and repr(C) layouts.</title></g><g><rect class="dg-shape dg-mat-writtenAhead" x="23.5" y="594.5" width="97.6" height="48" rx="4"/><text class="dg-text" x="72.2" y="615.5" text-anchor="middle" font-size="12">objects</text><text class="dg-text dg-sub" x="72.2" y="629.5" text-anchor="middle" font-size="10.5">libs/objects</text><title>The handle table and the channel message queue, generic over what a handle names.</title></g><g><rect class="dg-shape dg-mat-writtenAhead" x="29.8" y="664.5" width="85" height="48" rx="4"/><text class="dg-text" x="72.2" y="685.5" text-anchor="middle" font-size="12">btrfs</text><text class="dg-text dg-sub" x="72.2" y="699.5" text-anchor="middle" font-size="10.5">libs/btrfs</text></g><g><rect class="dg-shape dg-mat-implemented" x="43.2" y="746.2" width="58" height="48" rx="4"/><text class="dg-text" x="72.2" y="767.2" text-anchor="middle" font-size="12">fuzz</text><text class="dg-text dg-sub" x="72.2" y="781.2" text-anchor="middle" font-size="10.5">fuzz</text></g><g><rect class="dg-shape dg-mat-implemented" x="43.2" y="816.2" width="58" height="48" rx="4"/><text class="dg-text" x="72.2" y="837.2" text-anchor="middle" font-size="12">xtask</text><text class="dg-text dg-sub" x="72.2" y="851.2" text-anchor="middle" font-size="10.5">xtask</text><title>Cross-compiles both halves, writes the FAT32 image with its own writer, converts the ARMv7-A loader ELF to PE32, drives QEMU.</title></g><g><rect class="dg-shape dg-mat-planned" x="23.5" y="886.2" width="97.6" height="48" rx="4"/><text class="dg-text" x="72.2" y="907.2" text-anchor="middle" font-size="12">seccompBpf</text><text class="dg-text dg-sub" x="72.2" y="921.2" text-anchor="middle" font-size="10.5">libs/seccomp</text><title>The classic-BPF interpreter as a pure function over bytes.</title></g><g><rect class="dg-shape dg-mat-implemented" x="176.5" y="161.2" width="103.9" height="48" rx="4"/><text class="dg-text" x="228.4" y="182.2" text-anchor="middle" font-size="12">bootinfo</text><text class="dg-text dg-sub" x="228.4" y="196.2" text-anchor="middle" font-size="10.5">libs/bootinfo</text><title>The hand-off ABI, both address layouts, checked at compile time on every build.</title></g><g><rect class="dg-shape dg-mat-implemented" x="182.8" y="231.2" width="91.3" height="48" rx="4"/><text class="dg-text" x="228.5" y="252.2" text-anchor="middle" font-size="12">paging</text><text class="dg-text dg-sub" x="228.5" y="266.2" text-anchor="middle" font-size="10.5">libs/paging</text></g><g><rect class="dg-shape dg-mat-implemented" x="189.1" y="301.2" width="78.7" height="48" rx="4"/><text class="dg-text" x="228.4" y="322.2" text-anchor="middle" font-size="12">heap</text><text class="dg-text dg-sub" x="228.4" y="336.2" text-anchor="middle" font-size="10.5">libs/heap</text><title>The body has no unsafe; the crate cannot forbid it because declaring Backing as an unsafe trait is the point.</title></g><g><rect class="dg-shape dg-mat-implemented" x="189.1" y="371.2" width="78.7" height="48" rx="4"/><text class="dg-text" x="228.4" y="392.2" text-anchor="middle" font-size="12">acpi</text><text class="dg-text dg-sub" x="228.4" y="406.2" text-anchor="middle" font-size="10.5">libs/acpi</text><title>Reached at stage 3: the MADT walk the interrupt controller needed.</title></g><g><rect class="dg-shape dg-mat-implemented" x="192.2" y="441.2" width="72.4" height="48" rx="4"/><text class="dg-text" x="228.4" y="462.2" text-anchor="middle" font-size="12">fdt</text><text class="dg-text dg-sub" x="228.4" y="476.2" text-anchor="middle" font-size="10.5">libs/fdt</text><title>Reached at stage 1 on ARMv7-A: console, GIC, timer interrupt and PSCI conduit come from it there.</title></g><g><rect class="dg-shape dg-mat-implemented" x="189.1" y="511.2" width="78.7" height="48" rx="4"/><text class="dg-text" x="228.4" y="532.2" text-anchor="middle" font-size="12">sync</text><text class="dg-text dg-sub" x="228.4" y="546.2" text-anchor="middle" font-size="10.5">libs/sync</text><title>Reached at stage 4: SpinLock and IrqSpinLock guard every shared kernel structure.</title></g><g><rect class="dg-shape dg-mat-implemented" x="185.9" y="581.2" width="85" height="48" rx="4"/><text class="dg-text" x="228.4" y="602.2" text-anchor="middle" font-size="12">sched</text><text class="dg-text dg-sub" x="228.4" y="616.2" text-anchor="middle" font-size="10.5">libs/sched</text><title>The half of the scheduler that is arithmetic: the EEVDF tree, weights, lag, the domain partition.</title></g><g><rect class="dg-shape dg-mat-implemented" x="192.2" y="651.2" width="72.4" height="48" rx="4"/><text class="dg-text" x="228.4" y="672.2" text-anchor="middle" font-size="12">vma</text><text class="dg-text dg-sub" x="228.4" y="686.2" text-anchor="middle" font-size="10.5">libs/vma</text><title>Written for stage 6; reached at stage 2 as the vmap arena&#x27;s range map.</title></g><g><rect class="dg-shape dg-mat-implemented" x="181.4" y="721.2" width="94" height="48" rx="4"/><text class="dg-text" x="228.4" y="742.2" text-anchor="middle" font-size="12">frameCrate</text><text class="dg-text dg-sub" x="228.4" y="756.2" text-anchor="middle" font-size="10.5">libs/frame</text></g><g><rect class="dg-shape dg-mat-implemented" x="192.2" y="791.2" width="72.4" height="48" rx="4"/><text class="dg-text" x="228.4" y="812.2" text-anchor="middle" font-size="12">elf</text><text class="dg-text dg-sub" x="228.4" y="826.2" text-anchor="middle" font-size="10.5">libs/elf</text><title>ELF64 and, since the ARMv7-A port, ELF32.</title></g><rect class="dg-shape dg-mat-implemented" x="14" y="956.2" width="11" height="11" rx="2"/><text class="dg-text dg-legend" x="30" y="965.7" font-size="10">implemented</text><rect class="dg-shape dg-mat-writtenAhead" x="112" y="956.2" width="11" height="11" rx="2"/><text class="dg-text dg-legend" x="128" y="965.7" font-size="10">written ahead</text><rect class="dg-shape dg-mat-planned" x="222" y="956.2" width="11" height="11" rx="2"/><text class="dg-text dg-legend" x="238" y="965.7" font-size="10">planned</text></svg>