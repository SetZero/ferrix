<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 438 1185.5" width="438" height="1185.5" role="img" aria-label="Dependency diagram: The crate graph. 25 nodes, 15 edges. Most connected: kernelCrate (9), bootCrate (3), elf (3)."><title>The crate graph</title><style>
svg{
  --surface:#fff; --surface-2:#f6f7f8; --sunk:#e4e7ea;
  --ink:#16191d; --ink-2:#3b434c; --muted:#6a737e;
  --rule:#d2d7dc; --rule-strong:#b3bbc3;
  --implemented:#2c6e4e; --implemented-bg:#dceae2;
  --inProgress:#2a5f8f; --inProgress-bg:#dae5f0;
  --writtenAhead:#6b4fa0; --writtenAhead-bg:#e5dff0;
  --planned:#6a737e; --planned-bg:#e4e7ea;
  --deferred:#87600b; --deferred-bg:#f3e8ce;
}
@media (prefers-color-scheme:dark){svg{
  --surface:#1a1e22; --surface-2:#21262b; --sunk:#0e1113;
  --ink:#e7eaed; --ink-2:#bfc6cd; --muted:#8d97a1;
  --rule:#2c3238; --rule-strong:#5a646e;
  --implemented:#6abf92; --implemented-bg:#16301f;
  --inProgress:#74acdb; --inProgress-bg:#122639;
  --writtenAhead:#a98fd8; --writtenAhead-bg:#241c38;
  --planned:#8d97a1; --planned-bg:#262b31;
  --deferred:#d9a83e; --deferred-bg:#2e2511;
}}

figure.diagram{margin:22px 0 26px; padding:0}
figure.diagram svg{display:block; max-width:100%; height:auto;
  background:var(--surface); border:1px solid var(--rule); border-radius:3px}
figure.diagram figcaption{margin-top:9px; font-size:13px; color:var(--muted); max-width:74ch}
figure.diagram figcaption .figname{color:var(--ink-2); font-weight:600}
.dg-text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:var(--ink)}
.dg-sub{fill:var(--muted)}
.dg-stereo{fill:var(--muted); letter-spacing:.02em}
.dg-row{fill:var(--ink-2)}
.dg-shape{fill:var(--surface-2); stroke:var(--rule-strong); stroke-width:1.1}
.dg-terminal{fill:var(--sunk); stroke:var(--rule-strong)}
.dg-note{fill:var(--surface-2); stroke:var(--rule); stroke-dasharray:3 2}
.dg-rule{stroke:var(--rule-strong); stroke-width:1}
.dg-cluster{fill:none; stroke:var(--rule); stroke-width:1; stroke-dasharray:4 3}
.dg-cluster-label{fill:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dg-edge{fill:none; stroke:var(--rule-strong); stroke-width:1.4}
.dg-edge-trace{stroke-dasharray:5 4}
.dg-edge-label{fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dg-edge-label-bg{fill:var(--surface); stroke:none}
.dg-head{fill:var(--rule-strong); stroke:none}
.dg-head-hollow{fill:var(--surface); stroke:var(--rule-strong); stroke-width:1.1}
.dg-legend{fill:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dg-mat-implemented{fill:var(--implemented-bg); stroke:var(--implemented)}
.dg-mat-inProgress{fill:var(--inProgress-bg); stroke:var(--inProgress)}
.dg-mat-writtenAhead{fill:var(--writtenAhead-bg); stroke:var(--writtenAhead)}
.dg-mat-planned{fill:var(--planned-bg); stroke:var(--planned)}
.dg-mat-deferred{fill:var(--deferred-bg); stroke:var(--deferred)}
a.dg-link{text-decoration:none}
</style><rect width="438" height="1185.5" fill="var(--surface)"/><defs><marker id="dg-crate-dependencies-arrow" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-head" d="M0,0 L9,3.5 L0,7 L1.6,3.5 z"/></marker><marker id="dg-crate-dependencies-open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-edge" d="M0.5,0.5 L9,4 L0.5,7.5"/></marker><marker id="dg-crate-dependencies-hollow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-head-hollow" d="M0.5,0.5 L11,5 L0.5,9.5 z"/></marker><marker id="dg-crate-dependencies-diamond" markerWidth="14" markerHeight="9" refX="0.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-head" d="M0.5,4.5 L7,0.5 L13.5,4.5 L7,8.5 z"/></marker></defs><path class="dg-edge dg-edge-trace" d="M122.8,861.1 L220.2,717.7 Q225.3,710.2 232.4,704.7 L332.7,627.5" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M122.8,861.1 L221.9,616.3 Q225.3,608 229.4,600 L320.1,423" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M122.8,861.1 L219.3,752 Q225.3,745.2 233.6,741.6 L335.9,697.5" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M122.8,861.1 L218.7,949.1 Q225.3,955.2 230,962.9 L325.1,1117.5" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M122.8,861.1 L216.9,826.3 Q225.3,823.2 233.3,819.1 L332.7,767.5" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M122.8,861.1 L220.6,701.6 Q225.3,694 230.7,686.7 L326.4,557.5" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M122.8,861.1 L216.7,833.7 Q225.3,831.2 234.3,831.8 L329.6,837.5" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M122.8,861.1 L217.8,923.3 Q225.3,928.2 233.5,932 L332.7,977.5" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M122.8,861.1 L218,930.9 Q225.3,936.2 231.6,942.6 L335.9,1047.5" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M115.7,651.1 L219.9,510.2 Q225.3,503 232.2,497.2 L320.1,423" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M115.7,651.1 L220.8,831.4 Q225.3,839.2 233,843.9 L335.9,907.5" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M115.7,651.1 L216.7,683.2 Q225.3,686 230.9,678.9 L326.4,557.5" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M101.2,931.1 L216.9,888.3 Q225.3,885.2 234.1,887 L335.9,907.5" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M101.2,1001.1 L217.8,925.1 Q225.3,920.2 234.2,919.2 L335.9,907.5" marker-end="url(#dg-crate-dependencies-open)"/><path class="dg-edge dg-edge-trace" d="M101.2,1001.1 L216.5,1023.5 Q225.3,1025.2 231.9,1031.3 L325.1,1117.5" marker-end="url(#dg-crate-dependencies-open)"/><g><rect class="dg-shape dg-mat-writtenAhead" x="17.1" y="14" width="110.2" height="48" rx="4"/><text class="dg-text" x="72.2" y="35" text-anchor="middle" font-size="12">linuxAbi</text><text class="dg-text dg-sub" x="72.2" y="49" text-anchor="middle" font-size="10.5">libs/linux-abi</text><title>Three system call number tables, not two: x86-64&#x27;s own, AArch64&#x27;s generic one, and ARMv7-A&#x27;s EABI one.</title></g><g><rect class="dg-shape dg-mat-writtenAhead" x="26.6" y="84" width="91.3" height="48" rx="4"/><text class="dg-text" x="72.2" y="105" text-anchor="middle" font-size="12">ustack</text><text class="dg-text dg-sub" x="72.2" y="119" text-anchor="middle" font-size="10.5">libs/ustack</text><title>The initial process stack image: argc, argv, envp and the auxiliary vector, laid out as a program&#x27;s _start reads them, at both pointer widths.</title></g><g><rect class="dg-shape dg-mat-writtenAhead" x="32.9" y="154" width="78.7" height="48" rx="4"/><text class="dg-text" x="72.2" y="175" text-anchor="middle" font-size="12">cpio</text><text class="dg-text dg-sub" x="72.2" y="189" text-anchor="middle" font-size="10.5">libs/cpio</text></g><g><rect class="dg-shape dg-mat-writtenAhead" x="36" y="224" width="72.4" height="48" rx="4"/><text class="dg-text" x="72.2" y="245" text-anchor="middle" font-size="12">vfs</text><text class="dg-text dg-sub" x="72.2" y="259" text-anchor="middle" font-size="10.5">libs/vfs</text><title>Dentries with negative entries, mounts, the path walk, open file descriptions, descriptor tables, tmpfs over a page store the kernel supplies, initramfs unpacking and the getdents64 packer.</title></g><g><rect class="dg-shape dg-mat-implemented" x="26.6" y="294" width="91.3" height="48" rx="4"/><text class="dg-text" x="72.2" y="315" text-anchor="middle" font-size="12">procfs</text><text class="dg-text dg-sub" x="72.2" y="329" text-anchor="middle" font-size="10.5">libs/procfs</text><title>The text of /proc as pure functions: maps lines padded to their name column at both pointer widths, meminfo, status, stat and mounts, pinned byte for byte against lines a real Linux printed, and the maps parser the kern…</title></g><g><rect class="dg-shape dg-mat-implemented" x="26.6" y="364" width="91.3" height="48" rx="4"/><text class="dg-text" x="72.2" y="385" text-anchor="middle" font-size="12">virtio</text><text class="dg-text dg-sub" x="72.2" y="399" text-anchor="middle" font-size="10.5">libs/virtio</text></g><g><rect class="dg-shape dg-mat-implemented" x="28.9" y="627.1" width="86.8" height="48" rx="4"/><text class="dg-text" x="72.2" y="648.1" text-anchor="middle" font-size="12">bootCrate</text><text class="dg-text dg-sub" x="72.2" y="662.1" text-anchor="middle" font-size="10.5">boot</text></g><g><rect class="dg-shape dg-mat-writtenAhead" x="36" y="697.1" width="72.4" height="48" rx="4"/><text class="dg-text" x="72.2" y="718.1" text-anchor="middle" font-size="12">pci</text><text class="dg-text dg-sub" x="72.2" y="732.1" text-anchor="middle" font-size="10.5">libs/pci</text><title>PCI configuration space over a ConfigSpace the caller implements: ECAM geometry, headers, BAR decoding and sizing, both capability lists with a visited set, MSI-X, the bus walk without recursion or allocation, and virtio&#x27;s PCI transport.</title></g><g><rect class="dg-shape dg-mat-implemented" x="14" y="767.1" width="116.5" height="48" rx="4"/><text class="dg-text" x="72.2" y="788.1" text-anchor="middle" font-size="12">nativeAbi</text><text class="dg-text dg-sub" x="72.2" y="802.1" text-anchor="middle" font-size="10.5">libs/native-abi</text><title>The native ABI&#x27;s numbers, handle values, rights, signals, errno names and repr(C) layouts.</title></g><g><rect class="dg-shape dg-mat-implemented" x="21.6" y="837.1" width="101.2" height="48" rx="4"/><text class="dg-text" x="72.2" y="858.1" text-anchor="middle" font-size="12">kernelCrate</text><text class="dg-text dg-sub" x="72.2" y="872.1" text-anchor="middle" font-size="10.5">kernel</text></g><g><rect class="dg-shape dg-mat-implemented" x="43.2" y="907.1" width="58" height="48" rx="4"/><text class="dg-text" x="72.2" y="928.1" text-anchor="middle" font-size="12">xtask</text><text class="dg-text dg-sub" x="72.2" y="942.1" text-anchor="middle" font-size="10.5">xtask</text><title>Cross-compiles both halves, writes the FAT32 image with its own writer, converts the ARMv7-A loader ELF to PE32, drives QEMU.</title></g><g><rect class="dg-shape dg-mat-implemented" x="43.2" y="977.1" width="58" height="48" rx="4"/><text class="dg-text" x="72.2" y="998.1" text-anchor="middle" font-size="12">fuzz</text><text class="dg-text dg-sub" x="72.2" y="1012.1" text-anchor="middle" font-size="10.5">fuzz</text></g><g><rect class="dg-shape dg-mat-implemented" x="176.5" y="59" width="97.6" height="48" rx="4"/><text class="dg-text" x="225.3" y="80" text-anchor="middle" font-size="12">objects</text><text class="dg-text dg-sub" x="225.3" y="94" text-anchor="middle" font-size="10.5">libs/objects</text><title>The handle table and the channel message queue, generic over what a handle names.</title></g><g><rect class="dg-shape dg-mat-writtenAhead" x="182.8" y="623" width="85" height="48" rx="4"/><text class="dg-text" x="225.3" y="644" text-anchor="middle" font-size="12">btrfs</text><text class="dg-text dg-sub" x="225.3" y="658" text-anchor="middle" font-size="10.5">libs/btrfs</text></g><g><rect class="dg-shape dg-mat-planned" x="176.5" y="760.2" width="97.6" height="48" rx="4"/><text class="dg-text" x="225.3" y="781.2" text-anchor="middle" font-size="12">seccompBpf</text><text class="dg-text dg-sub" x="225.3" y="795.2" text-anchor="middle" font-size="10.5">libs/seccomp</text><title>The classic-BPF interpreter as a pure function over bytes.</title></g><g><rect class="dg-shape dg-mat-implemented" x="320.1" y="399" width="103.9" height="48" rx="4"/><text class="dg-text" x="372.1" y="420" text-anchor="middle" font-size="12">bootinfo</text><text class="dg-text dg-sub" x="372.1" y="434" text-anchor="middle" font-size="10.5">libs/bootinfo</text><title>The hand-off ABI, both address layouts, checked at compile time on every build.</title></g><g><rect class="dg-shape dg-mat-implemented" x="326.4" y="533.5" width="91.3" height="48" rx="4"/><text class="dg-text" x="372.1" y="554.5" text-anchor="middle" font-size="12">paging</text><text class="dg-text dg-sub" x="372.1" y="568.5" text-anchor="middle" font-size="10.5">libs/paging</text></g><g><rect class="dg-shape dg-mat-implemented" x="332.7" y="603.5" width="78.7" height="48" rx="4"/><text class="dg-text" x="372.1" y="624.5" text-anchor="middle" font-size="12">acpi</text><text class="dg-text dg-sub" x="372.1" y="638.5" text-anchor="middle" font-size="10.5">libs/acpi</text><title>Reached at stage 3: the MADT walk the interrupt controller needed.</title></g><g><rect class="dg-shape dg-mat-implemented" x="335.9" y="673.5" width="72.4" height="48" rx="4"/><text class="dg-text" x="372.1" y="694.5" text-anchor="middle" font-size="12">fdt</text><text class="dg-text dg-sub" x="372.1" y="708.5" text-anchor="middle" font-size="10.5">libs/fdt</text><title>Reached at stage 1 on ARMv7-A: console, GIC, timer interrupt and PSCI conduit come from it there.</title></g><g><rect class="dg-shape dg-mat-implemented" x="332.7" y="743.5" width="78.7" height="48" rx="4"/><text class="dg-text" x="372.1" y="764.5" text-anchor="middle" font-size="12">heap</text><text class="dg-text dg-sub" x="372.1" y="778.5" text-anchor="middle" font-size="10.5">libs/heap</text><title>The body has no unsafe; the crate cannot forbid it because declaring Backing as an unsafe trait is the point.</title></g><g><rect class="dg-shape dg-mat-implemented" x="329.6" y="813.5" width="85" height="48" rx="4"/><text class="dg-text" x="372.1" y="834.5" text-anchor="middle" font-size="12">sched</text><text class="dg-text dg-sub" x="372.1" y="848.5" text-anchor="middle" font-size="10.5">libs/sched</text><title>The half of the scheduler that is arithmetic: the EEVDF tree, weights, lag, the domain partition.</title></g><g><rect class="dg-shape dg-mat-implemented" x="335.9" y="883.5" width="72.4" height="48" rx="4"/><text class="dg-text" x="372.1" y="904.5" text-anchor="middle" font-size="12">elf</text><text class="dg-text dg-sub" x="372.1" y="918.5" text-anchor="middle" font-size="10.5">libs/elf</text><title>ELF64 and, since the ARMv7-A port, ELF32.</title></g><g><rect class="dg-shape dg-mat-implemented" x="332.7" y="953.5" width="78.7" height="48" rx="4"/><text class="dg-text" x="372.1" y="974.5" text-anchor="middle" font-size="12">sync</text><text class="dg-text dg-sub" x="372.1" y="988.5" text-anchor="middle" font-size="10.5">libs/sync</text><title>Reached at stage 4: SpinLock and IrqSpinLock guard every shared kernel structure.</title></g><g><rect class="dg-shape dg-mat-implemented" x="335.9" y="1023.5" width="72.4" height="48" rx="4"/><text class="dg-text" x="372.1" y="1044.5" text-anchor="middle" font-size="12">vma</text><text class="dg-text dg-sub" x="372.1" y="1058.5" text-anchor="middle" font-size="10.5">libs/vma</text><title>Written for stage 6; reached at stage 2 as the vmap arena&#x27;s range map.</title></g><g><rect class="dg-shape dg-mat-implemented" x="325.1" y="1093.5" width="94" height="48" rx="4"/><text class="dg-text" x="372.1" y="1114.5" text-anchor="middle" font-size="12">frameCrate</text><text class="dg-text dg-sub" x="372.1" y="1128.5" text-anchor="middle" font-size="10.5">libs/frame</text></g><rect class="dg-shape dg-mat-implemented" x="14" y="1163.5" width="11" height="11" rx="2"/><text class="dg-text dg-legend" x="30" y="1173" font-size="10">implemented</text><rect class="dg-shape dg-mat-writtenAhead" x="112" y="1163.5" width="11" height="11" rx="2"/><text class="dg-text dg-legend" x="128" y="1173" font-size="10">written ahead</text><rect class="dg-shape dg-mat-planned" x="222" y="1163.5" width="11" height="11" rx="2"/><text class="dg-text dg-legend" x="238" y="1173" font-size="10">planned</text></svg>