ass="dg-text dg-sub" x="840.6" y="176.5" text-anchor="middle" font-size="10.5">stage 6</text><title>The process as the core enforces and reports it, and nothing a personality adds: kernel/src/object/process.rs.</title></g><g><rect class="dg-shape dg-mat-implemented" x="898.8" y="148.5" width="58" height="34" rx="4"/><text class="dg-text" x="927.8" y="169.5" text-anchor="middle" font-size="12">Job</text><title>A container of processes, where resource limits and kill authority live.</title></g><g><rect class="dg-shape dg-mat-implemented" x="448.9" y="14" width="135.4" height="81.5" rx="4"/><text class="dg-text dg-stereo" x="516.6" y="33" text-anchor="middle" font-size="9.5">«def»</text><text class="dg-text" x="516.6" y="49" text-anchor="middle" font-size="12">KernelObject</text><text class="dg-text dg-sub" x="516.6" y="63" text-anchor="middle" font-size="10.5">stage 9</text><line class="dg-rule" x1="448.9" y1="72" x2="584.3" y2="72"/><text class="dg-text dg-row" x="459.9" y="82.5" font-size="10.5">attribute refcount</text><title>Typed, reference-counted, reached through per-process handle tables.</title></g><rect class="dg-shape dg-mat-implemented" x="14" y="211.5" width="11" height="11" rx="2"/><text class="dg-text dg-legend" x="30" y="221" font-size="10">implemented</text><rect class="dg-shape dg-mat-planned" x="112" y="211.5" width="11" height="11" rx="2"/><text class="dg-text dg-legend" x="128" y="221" font-size="10">planned</text></svg>