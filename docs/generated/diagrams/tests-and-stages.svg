<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 413.2 502.7" width="413.2" height="502.7" role="img" aria-label="Traceability diagram: The boot tests and the stages they verify. 14 nodes, 19 edges. Most connected: Boot ARMv7-A (6), Boot aarch64 (5), Boot x86 (5)."><title>The boot tests and the stages they verify</title><style>
svg{
  --surface:#fff; --surface-2:#f6f7f8; --sunk:#e4e7ea;
  --ink:#16191d; --ink-2:#3b434c; --muted:#6a737e;
  --rule:#d2d7dc; --rule-strong:#b3bbc3;
  --implemented:#2c6e4e; --implemented-bg:#dceae2;
  --inProgress:#2a5f8f; --inProgress-bg:#dae5f0;
  --writtenAhead:#6b4fa0; --writtenAhead-bg:#e5dff0;
  --planned:#6a737e; --planned-bg:#e4e7ea;
  --deferred:#87600b; --deferred-bg:#f3e8ce;
}
@media (prefers-color-scheme:dark){svg{
  --surface:#1a1e22; --surface-2:#21262b; --sunk:#0e1113;
  --ink:#e7eaed; --ink-2:#bfc6cd; --muted:#8d97a1;
  --rule:#2c3238; --rule-strong:#5a646e;
  --implemented:#6abf92; --implemented-bg:#16301f;
  --inProgress:#74acdb; --inProgress-bg:#122639;
  --writtenAhead:#a98fd8; --writtenAhead-bg:#241c38;
  --planned:#8d97a1; --planned-bg:#262b31;
  --deferred:#d9a83e; --deferred-bg:#2e2511;
}}

figure.diagram{margin:22px 0 26px; padding:0}
figure.diagram svg{display:block; max-width:100%; height:auto;
  background:var(--surface); border:1px solid var(--rule); border-radius:3px}
figure.diagram figcaption{margin-top:9px; font-size:13px; color:var(--muted); max-width:74ch}
figure.diagram figcaption .figname{color:var(--ink-2); font-weight:600}
.dg-text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:var(--ink)}
.dg-sub{fill:var(--muted)}
.dg-stereo{fill:var(--muted); letter-spacing:.02em}
.dg-row{fill:var(--ink-2)}
.dg-shape{fill:var(--surface-2); stroke:var(--rule-strong); stroke-width:1.1}
.dg-terminal{fill:var(--sunk); stroke:var(--rule-strong)}
.dg-note{fill:var(--surface-2); stroke:var(--rule); stroke-dasharray:3 2}
.dg-rule{stroke:var(--rule-strong); stroke-width:1}
.dg-cluster{fill:none; stroke:var(--rule); stroke-width:1; stroke-dasharray:4 3}
.dg-cluster-label{fill:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dg-edge{fill:none; stroke:var(--rule-strong); stroke-width:1.4}
.dg-edge-trace{stroke-dasharray:5 4}
.dg-edge-label{fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dg-edge-label-bg{fill:var(--surface); stroke:none}
.dg-head{fill:var(--rule-strong); stroke:none}
.dg-head-hollow{fill:var(--surface); stroke:var(--rule-strong); stroke-width:1.1}
.dg-legend{fill:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dg-mat-implemented{fill:var(--implemented-bg); stroke:var(--implemented)}
.dg-mat-inProgress{fill:var(--inProgress-bg); stroke:var(--inProgress)}
.dg-mat-writtenAhead{fill:var(--writtenAhead-bg); stroke:var(--writtenAhead)}
.dg-mat-planned{fill:var(--planned-bg); stroke:var(--planned)}
.dg-mat-deferred{fill:var(--deferred-bg); stroke:var(--deferred)}
a.dg-link{text-decoration:none}
</style><rect width="413.2" height="502.7" fill="var(--surface)"/><defs><marker id="dg-tests-and-stages-arrow" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-head" d="M0,0 L9,3.5 L0,7 L1.6,3.5 z"/></marker><marker id="dg-tests-and-stages-open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-edge" d="M0.5,0.5 L9,4 L0.5,7.5"/></marker><marker id="dg-tests-and-stages-hollow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-head-hollow" d="M0.5,0.5 L11,5 L0.5,9.5 z"/></marker><marker id="dg-tests-and-stages-diamond" markerWidth="14" markerHeight="9" refX="0.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-head" d="M0.5,4.5 L7,0.5 L13.5,4.5 L7,8.5 z"/></marker></defs><path class="dg-edge dg-edge-trace" d="M119.1,84.7 L222.4,31" marker-end="url(#dg-tests-and-stages-open)"/><path class="dg-edge dg-edge-trace" d="M119.1,84.7 L215.2,87" marker-end="url(#dg-tests-and-stages-open)"/><path class="dg-edge dg-edge-trace" d="M119.1,84.7 L168.4,143" marker-end="url(#dg-tests-and-stages-open)"/><path class="dg-edge dg-edge-trace" d="M119.1,84.7 L226,199" marker-end="url(#dg-tests-and-stages-open)"/><path class="dg-edge dg-edge-trace" d="M119.1,84.7 L204.4,255" marker-end="url(#dg-tests-and-stages-open)"/><path class="dg-edge dg-edge-trace" d="M122.4,154.7 L222.4,31" marker-end="url(#dg-tests-and-stages-open)"/><path class="dg-edge dg-edge-trace" d="M122.4,154.7 L215.2,87" marker-end="url(#dg-tests-and-stages-open)"/><path class="dg-edge dg-edge-trace" d="M122.4,154.7 L168.4,143" marker-end="url(#dg-tests-and-stages-open)"/><path class="dg-edge dg-edge-trace" d="M122.4,154.7 L226,199" marker-end="url(#dg-tests-and-stages-open)"/><path class="dg-edge dg-edge-trace" d="M122.4,154.7 L204.4,255" marker-end="url(#dg-tests-and-stages-open)"/><path class="dg-edge dg-edge-trace" d="M122.4,224.7 L222.4,31" marker-end="url(#dg-tests-and-stages-open)"/><path class="dg-edge dg-edge-trace" d="M122.4,224.7 L215.2,87" marker-end="url(#dg-tests-and-stages-open)"/><path class="dg-edge dg-edge-trace" d="M122.4,224.7 L168.4,143" marker-end="url(#dg-tests-and-stages-open)"/><path class="dg-edge dg-edge-trace" d="M122.4,224.7 L226,199" marker-end="url(#dg-tests-and-stages-open)"/><path class="dg-edge dg-edge-trace" d="M122.4,224.7 L204.4,255" marker-end="url(#dg-tests-and-stages-open)"/><path class="dg-edge dg-edge-trace" d="M122.4,224.7 L222.4,311" marker-end="url(#dg-tests-and-stages-open)"/><path class="dg-edge dg-edge-trace" d="M119.1,294.7 L222.4,311" marker-end="url(#dg-tests-and-stages-open)"/><path class="dg-edge dg-edge-trace" d="M122.4,364.7 L200.8,367" marker-end="url(#dg-tests-and-stages-open)"/><path class="dg-edge dg-edge-trace" d="M119.1,434.7 L226,423" marker-end="url(#dg-tests-and-stages-open)"/><g><rect class="dg-shape" x="17.3" y="60.7" width="101.8" height="48" rx="4"/><text class="dg-text dg-stereo" x="68.2" y="79.7" text-anchor="middle" font-size="9.5">«verification»</text><text class="dg-text" x="68.2" y="95.7" text-anchor="middle" font-size="12">Boot x86</text></g><g><rect class="dg-shape" x="14" y="130.7" width="108.4" height="48" rx="4"/><text class="dg-text dg-stereo" x="68.2" y="149.7" text-anchor="middle" font-size="9.5">«verification»</text><text class="dg-text" x="68.2" y="165.7" text-anchor="middle" font-size="12">Boot aarch64</text></g><g><rect class="dg-shape" x="14" y="200.7" width="108.4" height="48" rx="4"/><text class="dg-text dg-stereo" x="68.2" y="219.7" text-anchor="middle" font-size="9.5">«verification»</text><text class="dg-text" x="68.2" y="235.7" text-anchor="middle" font-size="12">Boot ARMv7-A</text></g><g><rect class="dg-shape" x="17.3" y="270.7" width="101.8" height="48" rx="4"/><text class="dg-text dg-stereo" x="68.2" y="289.7" text-anchor="middle" font-size="9.5">«verification»</text><text class="dg-text" x="68.2" y="305.7" text-anchor="middle" font-size="12">Board boot</text><title>cargo xtask deploy --arch armv7a: flash two files onto the card&#x27;s bootfs, watch the ST-LINK serial port for the marker.</title></g><g><rect class="dg-shape" x="14" y="340.7" width="108.4" height="48" rx="4"/><text class="dg-text dg-stereo" x="68.2" y="359.7" text-anchor="middle" font-size="9.5">«verification»</text><text class="dg-text" x="68.2" y="375.7" text-anchor="middle" font-size="12">Jobs session</text><title>cargo xtask test-jobs: boot zinc as init on x86-64 with no script, so the kernel starts sh -i, and type a session at the serial port through QEMU&#x27;s stdin -- sleep 30 &amp;, jobs, kill %1, a pipeline, Ctrl-Z, bg, fg, Ctrl-C, exit -- requiring the answer to each keystroke.</title></g><g><rect class="dg-shape dg-mat-planned" x="17.3" y="410.7" width="101.8" height="48" rx="4"/><text class="dg-text dg-stereo" x="68.2" y="429.7" text-anchor="middle" font-size="9.5">«verification»</text><text class="dg-text" x="68.2" y="445.7" text-anchor="middle" font-size="12">Rustc test</text><title>The acceptance test itself: rustc hello.rs &amp;&amp; ./hello inside the boot test.</title></g><g><rect class="dg-shape dg-mat-implemented" x="222.4" y="14" width="122.8" height="34" rx="4"/><text class="dg-text" x="283.8" y="35" text-anchor="middle" font-size="12">S1  stage1Boot</text><title>UEFI loader in Rust to a kernel Rust entry point, zero bootstrap assembly.</title></g><g><rect class="dg-shape dg-mat-implemented" x="215.2" y="70" width="137.2" height="34" rx="4"/><text class="dg-text" x="283.8" y="91" text-anchor="middle" font-size="12">S2  stage2Memory</text><title>Buddy allocator, heap, vmap arena with guard pages and stacks, identity map dropped, W^X sweep, boot memory reclaimed, empty slab pages returned.</title></g><g><rect class="dg-shape dg-mat-implemented" x="168.4" y="126" width="230.8" height="34" rx="4"/><text class="dg-text" x="283.8" y="147" text-anchor="middle" font-size="12">S3  stage3TrapsInterruptsTime</text><title>Vectors on every architecture, one dispatch above them; LAPIC, I/O APIC, HPET (TSC/PIT fallback); GICv2 and the architected virtual timer; the facade&#x27;s irq::register, timer::after and trap::Frame.</title></g><g><rect class="dg-shape dg-mat-implemented" x="226" y="182" width="115.6" height="34" rx="4"/><text class="dg-text" x="283.8" y="203" text-anchor="middle" font-size="12">S4  stage4Smp</text><title>Every processor online: INIT-SIPI-SIPI and a real-mode trampoline, PSCI CPU_ON through an identity map of the entry; a record per processor; every &quot;one CPU&quot; global now a lock; IPIs; TLB shootdown where hardware does not broadcast; grace periods.</title></g><g><rect class="dg-shape dg-mat-implemented" x="204.4" y="238" width="158.8" height="34" rx="4"/><text class="dg-text" x="283.8" y="259" text-anchor="middle" font-size="12">S5  stage5Scheduler</text><title>Task, kernel stacks, context switch, per-CPU runqueues, the class stack, EEVDF in libs/sched.</title></g><g><rect class="dg-shape dg-mat-implemented" x="222.4" y="294" width="122.8" height="34" rx="4"/><text class="dg-text" x="283.8" y="315" text-anchor="middle" font-size="12">SA  armv7aPort</text><title>The third architecture, joined after stage 3 and brought through stage 4: the same loader converted ELF to PE32, a 32-bit layout argued rather than shrunk, LPAE as a paging geometry, device tree only, traps without mode stacks.</title></g><g><rect class="dg-shape dg-mat-inProgress" x="200.8" y="350" width="166" height="34" rx="4"/><text class="dg-text" x="283.8" y="371" text-anchor="middle" font-size="12">S15  stage15Userland</text><title>Static musl busybox as /bin, a working init, job control, ttys, pipes.</title></g><g><rect class="dg-shape" x="226" y="406" width="115.6" height="34" rx="4"/><text class="dg-text" x="283.8" y="427" text-anchor="middle" font-size="12">G  hostsRustc</text><title>The acceptance test: a statically linked musl `rustc` compiles `hello.rs` on Ferrix, the binary it produced runs, and CI proves both.</title></g><rect class="dg-shape dg-mat-implemented" x="14" y="480.7" width="11" height="11" rx="2"/><text class="dg-text dg-legend" x="30" y="490.2" font-size="10">implemented</text><rect class="dg-shape dg-mat-inProgress" x="112" y="480.7" width="11" height="11" rx="2"/><text class="dg-text dg-legend" x="128" y="490.2" font-size="10">in progress</text><rect class="dg-shape dg-mat-planned" x="210" y="480.7" width="11" height="11" rx="2"/><text class="dg-text dg-legend" x="226" y="490.2" font-size="10">planned</text></svg>