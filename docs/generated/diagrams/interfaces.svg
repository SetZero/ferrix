119.9" y="262.1" text-anchor="middle" font-size="10.5">: Userland</text><line class="dg-rule" x1="27" y1="271.1" x2="212.8" y2="271.1"/><text class="dg-text dg-row" x="38" y="281.6" font-size="10.5">posix : LinuxSyscallPort</text><text class="dg-text dg-row" x="38" y="296.1" font-size="10.5">native : NativeSyscallPort</text></g><g><rect class="dg-shape dg-mat-planned" x="74.2" y="331.1" width="91.3" height="48" rx="4"/><text class="dg-text" x="119.9" y="352.1" text-anchor="middle" font-size="12">initramfs</text><text class="dg-text dg-sub" x="119.9" y="366.1" text-anchor="middle" font-size="10.5">: Initramfs</text></g><g><rect class="dg-shape" x="456.8" y="261" width="179.5" height="82" rx="4"/><text class="dg-text" x="546.5" y="282" text-anchor="middle" font-size="12">loader</text><text class="dg-text dg-sub" x="546.5" y="296" text-anchor="middle" font-size="10.5">: Loader</text><line class="dg-rule" x1="456.8" y1="305" x2="636.3" y2="305"/><text class="dg-text dg-row" x="467.8" y="315.5" font-size="10.5">efi : EfiHandoffPort</text><text class="dg-text dg-row" x="467.8" y="330" font-size="10.5">handoff : BootHandoffPort</text></g><g><rect class="dg-shape" x="880.3" y="154.5" width="204.7" height="111" rx="4"/><text class="dg-text" x="982.6" y="175.5" text-anchor="middle" font-size="12">kernel</text><text class="dg-text dg-sub" x="982.6" y="189.5" text-anchor="middle" font-size="10.5">: Kernel</text><line class="dg-rule" x1="880.3" y1="198.5" x2="1085" y2="198.5"/><text class="dg-text dg-row" x="891.3" y="209" font-size="10.5">handoff : BootHandoffPort</text><text class="dg-text dg-row" x="891.3" y="223.5" font-size="10.5">console : SerialConsolePort</text><text class="dg-text dg-row" x="891.3" y="238" font-size="10.5">linuxAbi : LinuxSyscallPort</text><text class="dg-text dg-row" x="891.3" y="252.5" font-size="10.5">nativeAbi : NativeSyscallPort</text></g><rect class="dg-edge-label-bg" x="703.3" y="240" width="110" height="14" rx="2"/><text class="dg-text dg-edge-label" x="758.3" y="250.4" text-anchor="middle" font-size="10">handoff → handoff</text><rect class="dg-edge-label-bg" x="431.5" y="223" width="230" height="14" rx="2"/><text class="dg-text dg-edge-label" x="546.5" y="233.4" text-anchor="middle" font-size="10">posix → linuxAbi · native → nativeAbi</text><rect class="dg-edge-label-bg" x="294.3" y="191.9" width="62" height="14" rx="2"/><text class="dg-text dg-edge-label" x="325.3" y="202.3" text-anchor="middle" font-size="10">efi → efi</text><rect class="dg-shape dg-mat-planned" x="14" y="414.1" width="11" height="11" rx="2"/><text class="dg-text dg-legend" x="30" y="423.6" font-size="10">planned</text></svg>