<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 499.6 671" width="499.6" height="671" role="img" aria-label="Traceability diagram: The gates and the rules they uphold. 16 nodes, 10 edges. Most connected: Boot test (2), Commit authorship (2), Crate layering (2)."><title>The gates and the rules they uphold</title><style>
svg{
  --surface:#fff; --surface-2:#f6f7f8; --sunk:#e4e7ea;
  --ink:#16191d; --ink-2:#3b434c; --muted:#6a737e;
  --rule:#d2d7dc; --rule-strong:#b3bbc3;
  --implemented:#2c6e4e; --implemented-bg:#dceae2;
  --inProgress:#2a5f8f; --inProgress-bg:#dae5f0;
  --writtenAhead:#6b4fa0; --writtenAhead-bg:#e5dff0;
  --planned:#6a737e; --planned-bg:#e4e7ea;
  --deferred:#87600b; --deferred-bg:#f3e8ce;
}
@media (prefers-color-scheme:dark){svg{
  --surface:#1a1e22; --surface-2:#21262b; --sunk:#0e1113;
  --ink:#e7eaed; --ink-2:#bfc6cd; --muted:#8d97a1;
  --rule:#2c3238; --rule-strong:#5a646e;
  --implemented:#6abf92; --implemented-bg:#16301f;
  --inProgress:#74acdb; --inProgress-bg:#122639;
  --writtenAhead:#a98fd8; --writtenAhead-bg:#241c38;
  --planned:#8d97a1; --planned-bg:#262b31;
  --deferred:#d9a83e; --deferred-bg:#2e2511;
}}

figure.diagram{margin:22px 0 26px; padding:0}
figure.diagram svg{display:block; max-width:100%; height:auto;
  background:var(--surface); border:1px solid var(--rule); border-radius:3px}
figure.diagram figcaption{margin-top:9px; font-size:13px; color:var(--muted); max-width:74ch}
figure.diagram figcaption .figname{color:var(--ink-2); font-weight:600}
.dg-text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:var(--ink)}
.dg-sub{fill:var(--muted)}
.dg-stereo{fill:var(--muted); letter-spacing:.02em}
.dg-row{fill:var(--ink-2)}
.dg-shape{fill:var(--surface-2); stroke:var(--rule-strong); stroke-width:1.1}
.dg-terminal{fill:var(--sunk); stroke:var(--rule-strong)}
.dg-note{fill:var(--surface-2); stroke:var(--rule); stroke-dasharray:3 2}
.dg-rule{stroke:var(--rule-strong); stroke-width:1}
.dg-cluster{fill:none; stroke:var(--rule); stroke-width:1; stroke-dasharray:4 3}
.dg-cluster-label{fill:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dg-edge{fill:none; stroke:var(--rule-strong); stroke-width:1.4}
.dg-edge-trace{stroke-dasharray:5 4}
.dg-edge-label{fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dg-edge-label-bg{fill:var(--surface); stroke:none}
.dg-head{fill:var(--rule-strong); stroke:none}
.dg-head-hollow{fill:var(--surface); stroke:var(--rule-strong); stroke-width:1.1}
.dg-legend{fill:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dg-mat-implemented{fill:var(--implemented-bg); stroke:var(--implemented)}
.dg-mat-inProgress{fill:var(--inProgress-bg); stroke:var(--inProgress)}
.dg-mat-writtenAhead{fill:var(--writtenAhead-bg); stroke:var(--writtenAhead)}
.dg-mat-planned{fill:var(--planned-bg); stroke:var(--planned)}
.dg-mat-deferred{fill:var(--deferred-bg); stroke:var(--deferred)}
a.dg-link{text-decoration:none}
</style><rect width="499.6" height="671" fill="var(--surface)"/><defs><marker id="dg-gates-and-rules-arrow" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-head" d="M0,0 L9,3.5 L0,7 L1.6,3.5 z"/></marker><marker id="dg-gates-and-rules-open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-edge" d="M0.5,0.5 L9,4 L0.5,7.5"/></marker><marker id="dg-gates-and-rules-hollow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-head-hollow" d="M0.5,0.5 L11,5 L0.5,9.5 z"/></marker><marker id="dg-gates-and-rules-diamond" markerWidth="14" markerHeight="9" refX="0.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-head" d="M0.5,4.5 L7,0.5 L13.5,4.5 L7,8.5 z"/></marker></defs><path class="dg-edge dg-edge-trace" d="M144.3,38 L240.4,43" marker-end="url(#dg-gates-and-rules-open)"/><path class="dg-edge dg-edge-trace" d="M165.6,108 L244,113" marker-end="url(#dg-gates-and-rules-open)"/><path class="dg-edge dg-edge-trace" d="M165.6,108 L240.4,43" marker-end="url(#dg-gates-and-rules-open)"/><path class="dg-edge dg-edge-trace" d="M172.8,178 L218.8,183" marker-end="url(#dg-gates-and-rules-open)"/><path class="dg-edge dg-edge-trace" d="M147.6,248 L251.2,253" marker-end="url(#dg-gates-and-rules-open)"/><path class="dg-edge dg-edge-trace" d="M144.3,318 L254.8,323" marker-end="url(#dg-gates-and-rules-open)"/><path class="dg-edge dg-edge-trace" d="M154.8,423 L244,393" marker-end="url(#dg-gates-and-rules-open)"/><path class="dg-edge dg-edge-trace" d="M154.8,423 L269.2,463" marker-end="url(#dg-gates-and-rules-open)"/><path class="dg-edge dg-edge-trace" d="M144.3,563 L218.8,533" marker-end="url(#dg-gates-and-rules-open)"/><path class="dg-edge dg-edge-trace" d="M144.3,563 L247.6,603" marker-end="url(#dg-gates-and-rules-open)"/><g><rect class="dg-shape dg-mat-implemented" x="42.5" y="14" width="101.8" height="48" rx="4"/><text class="dg-text dg-stereo" x="93.4" y="33" text-anchor="middle" font-size="9.5">«verification»</text><text class="dg-text" x="93.4" y="49" text-anchor="middle" font-size="12">Hooks armed</text><title>The first gate in cargo xtask check: fails when this clone has not run `git config core.hooksPath .githooks`, so the missing line reports itself rather than waiting to be noticed.</title></g><g><rect class="dg-shape dg-mat-implemented" x="21.2" y="84" width="144.4" height="48" rx="4"/><text class="dg-text dg-stereo" x="93.4" y="103" text-anchor="middle" font-size="9.5">«verification»</text><text class="dg-text" x="93.4" y="119" text-anchor="middle" font-size="12">Commit authorship</text><title>The One-author-per-commit CI job, over the range a push or pull request adds and never the whole tree, so public history that already carries a trailer cannot make the gate permanent red.</title></g><g><rect class="dg-shape dg-mat-implemented" x="14" y="154" width="158.8" height="48" rx="4"/><text class="dg-text dg-stereo" x="93.4" y="173" text-anchor="middle" font-size="9.5">«verification»</text><text class="dg-text" x="93.4" y="189" text-anchor="middle" font-size="12">Assembly allow list</text><title>Fails on an assembly site not in scripts/asm-allowlist.json, on a file over its budget, and on a stale entry.</title></g><g><rect class="dg-shape dg-mat-implemented" x="39.2" y="224" width="108.4" height="48" rx="4"/><text class="dg-text dg-stereo" x="93.4" y="243" text-anchor="middle" font-size="9.5">«verification»</text><text class="dg-text" x="93.4" y="259" text-anchor="middle" font-size="12">Unsafe audit</text><title>Every unsafe block has a SAFETY comment and one operation; every unsafe fn a Safety section.</title></g><g><rect class="dg-shape dg-mat-implemented" x="42.5" y="294" width="101.8" height="48" rx="4"/><text class="dg-text dg-stereo" x="93.4" y="313" text-anchor="middle" font-size="9.5">«verification»</text><text class="dg-text" x="93.4" y="329" text-anchor="middle" font-size="12">Panic audit</text><title>Every panic-lint exemption is an #[expect] whose reason begins AUDIT:.</title></g><g><rect class="dg-shape dg-mat-implemented" x="32" y="399" width="122.8" height="48" rx="4"/><text class="dg-text dg-stereo" x="93.4" y="418" text-anchor="middle" font-size="9.5">«verification»</text><text class="dg-text" x="93.4" y="434" text-anchor="middle" font-size="12">Crate layering</text><title>libs/ depend on nothing above them; generic kernel code names no architecture; cfg(target_arch) only under arch/.</title></g><g><rect class="dg-shape dg-mat-implemented" x="42.5" y="539" width="101.8" height="48" rx="4"/><text class="dg-text dg-stereo" x="93.4" y="558" text-anchor="middle" font-size="9.5">«verification»</text><text class="dg-text" x="93.4" y="574" text-anchor="middle" font-size="12">Boot test</text><title>The gate that answers the question the others cannot.</title></g><g><rect class="dg-shape" x="240.4" y="19" width="223.6" height="48" rx="4"/><text class="dg-text dg-stereo" x="352.2" y="38" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="352.2" y="54" text-anchor="middle" font-size="12">P.17  A gate needs no arming</text><title>A control that only runs once a clone has been configured is not a control.</title></g><g><rect class="dg-shape" x="244" y="89" width="216.4" height="48" rx="4"/><text class="dg-text dg-stereo" x="352.2" y="108" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="352.2" y="124" text-anchor="middle" font-size="12">P.16  One author per commit</text><title>docs/CONVENTIONS.md: a commit names one author.</title></g><g><rect class="dg-shape" x="218.8" y="159" width="266.8" height="48" rx="4"/><text class="dg-text dg-stereo" x="352.2" y="178" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="352.2" y="194" text-anchor="middle" font-size="12">P.7  Assembly only where the mach…</text><title>No assembly at boot on any architecture.</title></g><g><rect class="dg-shape" x="251.2" y="229" width="202" height="48" rx="4"/><text class="dg-text dg-stereo" x="352.2" y="248" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="352.2" y="264" text-anchor="middle" font-size="12">P.12  Unsafe is expensive</text><title>unsafe is not forbidden, it is made expensive: a SAFETY comment on every block, one unsafe operation per block, a Safety section on every unsafe fn, and a script in CI so a softened clippy lint cannot retire the rule.</title></g><g><rect class="dg-shape" x="254.8" y="299" width="194.8" height="48" rx="4"/><text class="dg-text dg-stereo" x="352.2" y="318" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="352.2" y="334" text-anchor="middle" font-size="12">P.13  No reachable panic</text><title>panic!, unreachable!, unwrap, expect and unchecked indexing are denied in production code; every exemption is an #[expect] whose reason begins AUDIT:.</title></g><g><rect class="dg-shape" x="244" y="369" width="216.4" height="48" rx="4"/><text class="dg-text dg-stereo" x="352.2" y="388" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="352.2" y="404" text-anchor="middle" font-size="12">P.5  Pure functions in libs</text><title>Anything expressible as a pure function of bytes goes to `libs/`, and gets a fuzz target and a Miri run, before the kernel calls it.</title></g><g><rect class="dg-shape" x="269.2" y="439" width="166" height="48" rx="4"/><text class="dg-text dg-stereo" x="352.2" y="458" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="352.2" y="474" text-anchor="middle" font-size="12">P.6  One arch facade</text><title>Generic code never names an architecture and #[cfg(target_arch)] appears nowhere outside arch/.</title></g><g><rect class="dg-shape" x="218.8" y="509" width="266.8" height="48" rx="4"/><text class="dg-text dg-stereo" x="352.2" y="528" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="352.2" y="544" text-anchor="middle" font-size="12">P.11  Every stage ends in somethi…</text><title>A stage&#x27;s exit criterion is a QEMU boot that demonstrates the new capability and stays in CI forever after.</title></g><g><rect class="dg-shape" x="247.6" y="579" width="209.2" height="48" rx="4"/><text class="dg-text dg-stereo" x="352.2" y="598" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="352.2" y="614" text-anchor="middle" font-size="12">P.15  Proved on every boot</text><title>The kernel proves its invariants on every boot rather than asserting them: the memory map is checked, the direct map is checked to alias physical memory, the allocators are required to give every frame back.</title></g><rect class="dg-shape dg-mat-implemented" x="14" y="649" width="11" height="11" rx="2"/><text class="dg-text dg-legend" x="30" y="658.5" font-size="10">implemented</text></svg>