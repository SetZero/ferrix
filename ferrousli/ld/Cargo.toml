[package]
name = "ferrousli-ld"
description = "The dynamic loader: ferrousli's ld.so"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[[bin]]
name = "ld-ferrousli"
path = "src/main.rs"
test = false
doctest = false
# The loader is freestanding: it brings its own `_start` and links against no
# C runtime, which the target's flags in `../.cargo/config.toml` say. Built
# for the host's default target instead, its `_start` collides with the one in
# `Scrt1.o` and the link fails.
#
# So it is built only when asked. `cargo build`, `cargo test` and
# `cargo clippy --all-targets` in this workspace then leave it alone, and the
# one command that wants it names both the feature and the target.
required-features = ["loader"]

[features]
# Not a feature of the code -- nothing reads it -- but the switch that says
# "build the loader, for the target it can be built for".
loader = []

[dependencies]

[lints]
workspace = true
