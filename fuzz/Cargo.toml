[package]
name = "ferrix-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Its own workspace, so `cargo fuzz` can pick its own profile and its
# sanitizer-instrumented build does not disturb the main target directory.
# `scripts/check-crate-layering.sh` knows to skip a manifest that declares one.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
ferrix-acpi = { path = "../libs/acpi" }
ferrix-cpio = { path = "../libs/cpio" }
ferrix-elf = { path = "../libs/elf" }
ferrix-fdt = { path = "../libs/fdt" }
ferrix-frame = { path = "../libs/frame" }
ferrix-ustack = { path = "../libs/ustack" }
ferrix-linux-abi = { path = "../libs/linux-abi" }
ferrix-native-abi = { path = "../libs/native-abi" }
ferrix-objects = { path = "../libs/objects" }
ferrix-sync = { path = "../libs/sync" }
ferrix-vfs = { path = "../libs/vfs" }
ferrix-pci = { path = "../libs/pci" }
ferrix-btrfs = { path = "../libs/btrfs" }
ferrix-block = { path = "../libs/block", features = ["model"] }
ferrix-blkring = { path = "../libs/blkring" }
ferrix-virtio = { path = "../libs/virtio" }
ferrix-displayctl = { path = "../libs/displayctl" }
ferrix-renderctl = { path = "../libs/renderctl" }
ferrix-inputctl = { path = "../libs/inputctl" }
ferrix-sndctl = { path = "../libs/sndctl" }
ferrix-virtio-blk = { path = "../libs/virtio-blk" }
ferrix-virtio-net = { path = "../libs/virtio-net" }
ferrix-virtio-gpu = { path = "../libs/virtio-gpu" }
ferrix-virtio-input = { path = "../libs/virtio-input" }
ferrix-netwire = { path = "../libs/netwire" }
ferrix-nettcp = { path = "../libs/nettcp" }
ferrix-net = { path = "../libs/net" }
ferrix-netlink = { path = "../libs/netlink" }
ferrix-cgroupfs = { path = "../libs/cgroupfs" }
ferrix-sysfs = { path = "../libs/sysfs" }
ferrix-svc = { path = "../libs/svc" }
ferrix-svc-proto = { path = "../libs/svc-proto" }
compositor-config = { path = "../compositor/config" }
compositor-wire = { path = "../compositor/wire" }

