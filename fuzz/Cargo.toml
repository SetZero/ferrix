[package]
name = "ferrix-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Its own workspace, so `cargo fuzz` can pick its own profile and its
# sanitizer-instrumented build does not disturb the main target directory.
# `scripts/check-crate-layering.sh` knows to skip a manifest that declares one.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
ferrix-acpi = { path = "../libs/acpi" }
ferrix-cpio = { path = "../libs/cpio" }
ferrix-elf = { path = "../libs/elf" }
ferrix-fdt = { path = "../libs/fdt" }
ferrix-frame = { path = "../libs/frame" }
ferrix-ustack = { path = "../libs/ustack" }
ferrix-linux-abi = { path = "../libs/linux-abi" }
ferrix-native-abi = { path = "../libs/native-abi" }
ferrix-objects = { path = "../libs/objects" }
ferrix-vfs = { path = "../libs/vfs" }
ferrix-pci = { path = "../libs/pci" }
ferrix-btrfs = { path = "../libs/btrfs" }
ferrix-block = { path = "../libs/block", features = ["model"] }
ferrix-blkring = { path = "../libs/blkring" }
ferrix-virtio = { path = "../libs/virtio" }
ferrix-virtio-blk = { path = "../libs/virtio-blk" }

[[bin]]
name = "elf_parse"
path = "fuzz_targets/elf_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frame_alloc"
path = "fuzz_targets/frame_alloc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ustack_build"
path = "fuzz_targets/ustack_build.rs"
test = false
doc = false
bench = false

[[bin]]
name = "handle_table"
path = "fuzz_targets/handle_table.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vfs_ops"
path = "fuzz_targets/vfs_ops.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pci_walk"
path = "fuzz_targets/pci_walk.rs"
test = false
doc = false
bench = false

[[bin]]
name = "btrfs_read"
path = "fuzz_targets/btrfs_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "block_queue"
path = "fuzz_targets/block_queue.rs"
test = false
doc = false
bench = false

[[bin]]
name = "blkring"
path = "fuzz_targets/blkring.rs"
name = "virtio_blk"
path = "fuzz_targets/virtio_blk.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cpio_parse"
path = "fuzz_targets/cpio_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fdt_parse"
path = "fuzz_targets/fdt_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "acpi_tables"
path = "fuzz_targets/acpi_tables.rs"
test = false
doc = false
bench = false

[profile.release]
debug = true
# The fuzzer's whole job is to find these, so they must not be compiled out.
overflow-checks = true
