name: Website

# Publishes docs/website/ to GitHub Pages (https://setzero.github.io/ferrix/).
# Pages has to be switched on once, in Settings -> Pages -> Source:
# "GitHub Actions". Until then the deploy job fails and nothing else does.

on:
  push:
    branches: [main]
    paths: [docs/website/**, docs/brand/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: sh docs/website/build.sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
