<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Ferrix's fonts, and how they are drawn: the file FONTCONFIG_FILE names on
  a desktop with Chrome (fonts/README.md). It adds to the system's
  configuration, which it includes last, and changes none of it.

  The edits come before the include on purpose. A pattern here is still the
  one the program asked for, so "sans-serif" is its first family; after the
  system's files, 60-latin.conf has put DejaVu Sans ahead of it, and
  49-sansserif.conf has added sans-serif behind every named family, Arial
  too, which a test for any sans-serif would then hand to Inter.
-->
<fontconfig>
  <dir>/usr/share/ferrix/fonts</dir>

  <!-- Inter is the sans-serif: Chrome asks for "sans" for its own tabs,
       toolbar and menus, and a page's sans-serif is a preference of
       Chrome's own that the extension sets to Inter as well. -->
  <match target="pattern">
    <test qual="first" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="same"><string>Inter Variable</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>sans</string></test>
    <edit name="family" mode="prepend_first" binding="same"><string>Inter Variable</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>system-ui</string></test>
    <edit name="family" mode="prepend_first" binding="same"><string>Inter Variable</string></edit>
  </match>

  <!-- Greyscale antialiasing and slight hinting, which is what Debian's
       installer chooses. Without a word from the configuration FreeType
       hints fully, pulling outlines onto the pixel grid until a face no
       longer looks like itself. Subpixel colour is left off: the screen is
       a virtual card, or scaled, and its subpixel order is not known. -->
  <match target="pattern">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>

  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
</fontconfig>
