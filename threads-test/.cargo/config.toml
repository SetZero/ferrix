# A static program for Ferrix's initramfs, linkable from any host: the musl
# targets carry their own C runtime and `libc.a`, so rust-lld is the whole
# toolchain and Windows needs no Linux C compiler.
# `relocation-model=static` links a fixed-address executable rather than the
# static PIE rustc makes for musl by default: Ferrix's loader does not relocate
# a static PIE yet, which docs/BACKLOG.md has as a P0 row of its own.
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "link-self-contained=yes", "-C", "target-feature=+crt-static", "-C", "relocation-model=static"]

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "link-self-contained=yes", "-C", "target-feature=+crt-static", "-C", "relocation-model=static"]

# ARMv7-A is not here: Ferrix's own config uses that triple for the loader, and
# cargo would merge its linker script into this program's link. `cargo xtask
# test-threads` sets the flags for it in the environment instead.
