[package]
name = "zinc"
description = "A zsh-compatible shell, written in Rust"
version = "0.1.0"
edition = "2024"
# Matches Ferrix's rust-toolchain.toml, which rustup finds from here.
rust-version = "1.97"
license = "MIT"
publish = false

# A workspace of its own, not a member of Ferrix's, for the reason ferrousli is
# one: it is a Linux user program built with std, and the Ferrix workspace's
# dependency policy bans the host C library outright, rightly, for the kernel.
[workspace]

[[bin]]
name = "zinc"
path = "src/main.rs"

# The runtime being ported from zsh 5.9's C, module by module, beside the
# shell above until it replaces it. It shares the lexer and parser, and is
# built only on request: `cargo build --features next --bin zinc-next`.
[[bin]]
name = "zinc-next"
path = "src/next/main.rs"
required-features = ["next"]

[features]
next = []

[dependencies]
# The one dependency. A shell needs `fork`, `execve`, `dup2`, `sigaction`,
# `tcsetpgrp`, `termios` and `waitpid`, none of which std offers. `libc` is
# declarations only: the functions it names are the C library std already
# links, so it adds no code of its own.
libc = "0.2.189"

# ---------------------------------------------------------------------------
# Lints
#
# The Ferrix discipline. A panic in a shell ends the user's session and loses
# whatever they were typing, so the ways of reaching one are denied and every
# fallible step reports the way zsh does: a message and a status.
# ---------------------------------------------------------------------------
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
string_slice = "deny"
allow_attributes_without_reason = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.dev]
overflow-checks = true

# Stripped: the release build is what goes into the initramfs, where every
# megabyte is loaded at boot.
[profile.release]
overflow-checks = true
strip = true
lto = true
codegen-units = 1
