[package]
name = "ferrix-blkring"
description = "The block ring: the shared-memory protocol between the kernel and a ring-3 block driver"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license.workspace = true
publish = false

[features]
# `KernelSide::attach_owned`: slots the side owns, for a kernel that keeps
# the side behind a lock its callers share rather than on one task's stack.
alloc = []

[dependencies]
ferrix-linux-abi = { workspace = true }
ferrix-native-abi = { workspace = true }

[lints]
workspace = true
