# vkgears, an app (docs/APPS.md): Vulkan's gears from mesa-demos with Mesa's
# Venus driver linked into it (docs/GPU.md §6.1), built by its build.sh on a
# Linux host. It needs a card that offers Venus, so it has no smoke check: a
# shell's boot has no such card. test-vkgears is its gate.

[package]
name = "vkgears"
version = "9.0.0"
description = "vkgears, Vulkan's gears drawn through Venus, static against ferrousli"
abi = "linux"
arches = ["x86_64"]
depends = []

[[package.files]]
from = "bin/vkgears"
to = "bin/vkgears"
mode = "755"

[build]
kind = "script"

[image]
default = true

[check]
host-tests = false
