# sshdt, an app (docs/APPS.md): an SSH server written in Rust, built by its
# build.sh against ferrousli, with Ferrix's socket activation patched in.
# test-ssh boots it.

[package]
name = "sshdt"
version = "0.4.2"
description = "sshdt, an SSH server in Rust, static against ferrousli"
abi = "linux"
arches = ["x86_64"]
depends = []

[[package.files]]
from = "bin/sshdt"
to = "bin/sshdt"
mode = "755"

[build]
kind = "script"

[image]
default = true

[check]
host-tests = false

[[smoke]]
run = "sshdt --version"
expect = "sshdt 0.4.2"
