# alsa-lib, an app (docs/APPS.md): ALSA's client library, built static by
# its build.sh for the programs that link it (the alsa-utils app), and its
# configuration, which those programs read at run time: that is what an
# image carries. It has no program, so no smoke check.

[package]
name = "alsa-lib"
version = "1.2.16.1"
description = "alsa-lib's configuration, for the programs linked against ALSA's library"
abi = "linux"
arches = ["x86_64"]
depends = []

[[package.files]]
from = "usr/share/ferrousli/alsa"
tree = true
to = "usr/share/ferrousli/alsa"

[build]
kind = "script"

[image]
default = true

[check]
host-tests = false
