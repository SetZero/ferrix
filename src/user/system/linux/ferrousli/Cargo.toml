[package]
name = "ferrousli"
description = "A C library for Linux, written in Rust"
version = "0.1.0"
edition = "2024"
# Matches Ferrix's rust-toolchain.toml, which rustup finds from here.
rust-version = "1.97"
license = "MIT"
publish = false

# A workspace of its own, not a member of Ferrix's. It builds for Linux user
# space rather than for the kernel's targets and depends on no Ferrix crate, so
# it stays outside Ferrix's gates until it is ready to join them.
#
# `ld` is the dynamic loader, a program rather than a library, and a member
# here so that one `cargo fmt`, `clippy` and `test` in this directory covers
# both halves of the C library.
[workspace]
members = ["ld"]

[lib]
# A C program links `libferrousli.a`; nothing links this crate as Rust. There
# is no rlib because a Rust program linking one would get a second
# `#[panic_handler]` and a second `memcpy` beside std's.
crate-type = ["staticlib"]
doctest = false

[dependencies]

# ---------------------------------------------------------------------------
# Lints
#
# The Ferrix discipline, trimmed to what a C library meets. Nearly every
# exported function takes a raw pointer from C, so `unsafe` cannot be denied;
# instead every block must say why it is sound, and say it about one operation.
# ---------------------------------------------------------------------------
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
unused_results = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "deny"
# A panic inside a C library has nowhere to go: the frames above it are C. The
# panic handler traps, and these keep the ways of reaching it deliberate.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
allow_attributes_without_reason = "deny"
ptr_as_ptr = "warn"
borrow_as_ptr = "warn"
cast_ptr_alignment = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[lints]
workspace = true

[profile.dev]
panic = "abort"
overflow-checks = true

[profile.release]
panic = "abort"
overflow-checks = true
debug = true
