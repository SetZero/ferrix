# The fuzzel.ini `cargo xtask test-compositor`'s fuzzel boot carries as
# /.config/fuzzel/fuzzel.ini, and src/user/linux/compositor/fuzzel's host test draws with:
# the customer's launcher settings, with a font the tree carries in place of
# theirs, fonts sized at 96 DPI whatever the screen reports, and the
# terminal the image has.

[main]
font=Liberation Serif:size=16
dpi-aware=no
terminal=/bin/term
layer=overlay
anchor=center
width=42
lines=12
horizontal-pad=32
vertical-pad=26
inner-pad=14
line-height=26
letter-spacing=0

icons-enabled=yes
image-size-ratio=0.32
prompt="  "
placeholder=Search…
filter-desktop=yes

[colors]
background=1a1b268c
text=c0caf5ff
prompt=7f849cff
placeholder=6b7089ff
input=ffffffff
match=21ccffff
selection=21ccff3d
selection-text=ffffffff
selection-match=21ccffff
counter=7f849cff
border=21ccff73

[border]
width=2
radius=20

[dmenu]
exit-immediately-if-empty=yes
