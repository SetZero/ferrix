[package]
name = "compositor-fuzzel"
description = "fuzzel, the application launcher, reading the user's fuzzel.ini unchanged"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "fuzzel"
path = "src/main.rs"

[lib]
name = "compositor_fuzzel"
path = "src/lib.rs"

[dependencies]
# PNG and SVG icons, into pixmaps.
compositor-image = { path = "../image" }
# Fonts, shaping and glyphs: fuzzel's fcft.
compositor-text = { path = "../text" }
# The Wayland client: the layer surface, the keyboard, the buffers.
compositor-toolkit = { path = "../toolkit" }
# The keymaps: which keysym names exist, and what a key makes.
compositor-xkb = { path = "../xkb" }

[dev-dependencies]
# The boot's pictures are fuzzel's frames as the compositor lays out and
# composites a layer surface; the tests draw them the same way.
compositor-layout = { path = "../layout" }
compositor-render = { path = "../render" }

[lints]
workspace = true
