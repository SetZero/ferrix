[package]
name = "compositor-waybar"
description = "waybar in Rust: the user's config.jsonc and GTK3 style.css, drawn as a layer-shell bar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "compositor_waybar"
path = "src/lib.rs"

[[bin]]
name = "waybar"
path = "src/main.rs"

# The host-side probe: reads a config and a stylesheet (the user's real
# ~/.config/waybar files by default) and lists every option and CSS property
# this waybar does not carry out. Never installed in the image.
[[bin]]
name = "waybar-probe"
path = "src/bin/probe.rs"

[dependencies]
# The clients' Wayland runtime: the layer surfaces, popups, pointer, timers,
# children and signals the bar runs on.
compositor-toolkit = { path = "../toolkit" }
# Labels and tooltips in the user's fonts, with Pango markup.
compositor-text = { path = "../text" }
# The stylesheet's url() images: the chips' SVG caps and icons.
compositor-image = { path = "../image" }
# The PulseAudio native protocol's wire format, for the pulseaudio module's
# volume, mute and description: the crate Ferrix's own sound server is
# planned on (docs/AUDIO.md, U2), pure Rust, MIT. Its protocol module is
# used synchronously; nothing of its async client is.
pulseaudio = "0.3.1"
# Declarations only: SIGRTMIN, and the ifreq ioctls the network module
# reads an interface's address with.
libc = "0.2.189"
# The rasteriser the bar's CSS boxes are drawn with: the one version the
# workspace pins (src/user/system/linux/compositor/render's reasons), so the foundation's glyphs
# and images and this crate's boxes are one tiny-skia.
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std", "simd"] }

[dev-dependencies]
# The compositor, run in the test's own process, for the bar to draw on.
hyprix = { path = "../hyprix" }

[lints]
workspace = true
