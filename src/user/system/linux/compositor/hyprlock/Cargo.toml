[package]
name = "compositor-hyprlock"
description = "hyprlock for Ferrix: the user's hyprlock.conf, drawn on ext-session-lock-v1 surfaces"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "hyprlock"
path = "src/main.rs"

[lib]
name = "compositor_hyprlock"
path = "src/lib.rs"

[dependencies]
compositor-anim = { path = "../anim" }
compositor-config = { path = "../config" }
compositor-hyprlang = { path = "../hyprlang" }
compositor-image = { path = "../image" }
compositor-text = { path = "../text" }
compositor-toolkit = { path = "../toolkit" }
# authd's client and its records (docs/AUTH.md §3.3): the password goes to
# authd over /run/ferrix/auth, and hyprlock never sees a credential.
ferrix-auth-client = { path = "../../auth/client" }
ferrix-auth-proto = { path = "../../../../../lib/proto/auth-proto" }
# Declarations only: getuid(2).
libc = "0.2.189"
# The rasteriser the widgets are drawn with, at the version the workspace
# pins (src/user/system/linux/compositor/render/Cargo.toml says why exactly); no new crates.
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std", "simd"] }

[dev-dependencies]
# The expected images' format and the compositor's own compositing, which is
# what makes a lock surface the guest's screen.
compositor-render = { path = "../render" }

[lints]
workspace = true
