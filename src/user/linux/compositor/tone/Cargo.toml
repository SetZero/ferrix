[package]
name = "compositor-tone"
description = "A second of a counter played through /dev/snd, for xtask test-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tone"
path = "src/main.rs"

# Write period 10 twice and skip period 11, so `xtask test-audio` can show
# that its check reads the samples rather than the program's shape.
[features]
negative-control = []
# Kill the card's driver twice under a running stream before the second is
# played, so `xtask test-audio` sees the card come back and play.
restart = []

[dependencies]
libc = "0.2.189"
# The ALSA numbers and layouts, checked against the UAPI header.
ferrix-linux-abi = { path = "../../../../lib/proto/linux-abi" }
compositor-evecho = { path = "../evecho" }

[lints]
workspace = true
