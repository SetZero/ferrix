[package]
name = "ferrix-adbd"
description = "adbd for Ferrix: the device end of the Android Debug Bridge, over TCP"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

# A workspace of its own, as statd and zinc are: a static Linux program built
# with std against the target's own musl, for the initramfs (tools/common/xtask/src/adbd.rs).
[workspace]

[[bin]]
name = "adbd"
path = "src/main.rs"

[dependencies]
ferrix-adb = { path = "../../../lib/proto/adb" }
# posix_openpt and the pty ioctls, setsid, and reboot, none of which std
# offers; the version zinc already builds with.
libc = "0.2.189"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
