# The loader is a program, and a freestanding one: it is the half of the C
# library that runs before there is a C library, so it links against nothing
# and brings its own `_start`. These flags say that.
#
# They are scoped to the target rather than set for the workspace because
# `libferrousli.a` is a static library that is never linked here, so link flags
# would mean nothing to it; scoping them keeps that visible.
#
# The musl target already passes `-static -pie --no-dynamic-linker`, which is
# exactly the shape a dynamic loader has to be: an `ET_DYN` naming no
# interpreter of its own. Nothing here has to ask for that.
[target.x86_64-unknown-linux-musl]
rustflags = [
    "-Clink-self-contained=no",
    "-Cdefault-linker-libraries=no",
    "-Clink-arg=-nostartfiles",
]

# The AArch64 and ARMv7-A loaders, linked by rust-lld as a plain ELF linker,
# so that building them needs no C toolchain for either: `link-self-contained`
# off keeps the target's C runtime and musl out, as `-nostartfiles` does
# above. lld is asked for the static PIE by name, `-pie` with no interpreter
# of its own, since the ARMv7-A target does not make one unasked.
# `ld/build.rs` passes its link arguments in lld's form for these two.
#
# AArch64's `-outline-atomics`: with them on, every atomic calls a helper in
# `compiler_builtins` whose object also brings a constructor that asks
# `getauxval` whether the processor has LSE -- a C library function, which a
# loader that runs before the C library cannot import. Inline atomics are
# the ARMv8.0 instructions every AArch64 processor has.
[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = [
    "-Clinker-flavor=ld.lld",
    "-Clink-self-contained=no",
    "-Cdefault-linker-libraries=no",
    "-Crelocation-model=pic",
    "-Ctarget-feature=-outline-atomics",
    "-Clink-arg=-pie",
    "-Clink-arg=--no-dynamic-linker",
]

[target.armv7-unknown-linux-musleabihf]
linker = "rust-lld"
rustflags = [
    "-Clinker-flavor=ld.lld",
    "-Clink-self-contained=no",
    "-Cdefault-linker-libraries=no",
    "-Crelocation-model=pic",
    "-Clink-arg=-pie",
    "-Clink-arg=--no-dynamic-linker",
]
