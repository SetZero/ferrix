[package]
name = "ferrix-statd"
description = "Ferrix's stat service: the machine's load, memory and tasks, a line at a time on the console"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

# A workspace of its own, as zinc is: a static Linux program built with std
# against the target's own musl, for the initramfs (xtask/src/statd.rs).
[workspace]

[[bin]]
name = "ferrix-statd"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
