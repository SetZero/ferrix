[package]
name = "ferrofetch"
description = "Ferrix's fastfetch: the mark beside a few lines about the machine, the shell and the session"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

# An app: a workspace of its own, built by xtask from what app.toml says
# (docs/APPS.md). Nothing outside this folder names it.
[workspace]

# The lib target is the parsers and the layout, which the host tests. The
# program is native, built for the kernel's targets only, where it links the
# runtime -- the one thing outside this folder it uses.
[lib]
path = "src/lib.rs"

[[bin]]
name = "ferrofetch"
path = "src/main.rs"
test = false
bench = false

[target.'cfg(target_os = "none")'.dependencies]
ferrix-rt = { path = "../../system/native/rt" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
