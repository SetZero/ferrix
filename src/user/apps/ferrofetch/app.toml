# ferrofetch, an app (docs/APPS.md).

[package]
name = "ferrofetch"
version = "0.1.0"
description = "Ferrix's fastfetch: the mark beside a few lines about the machine, the shell and the session"
abi = "native"
arches = ["x86_64", "aarch64", "armv7a"]
depends = []

[[package.files]]
from = "ferrofetch"
to = "bin/ferrofetch"
mode = "755"

# Its entry in a launcher and its icon, kept in this folder: fuzzel lists
# every `.desktop` file in `usr/share/applications`.
[[package.files]]
from = "share/ferrofetch.desktop"
source = "folder"
to = "usr/share/applications/ferrofetch.desktop"
mode = "644"

[[package.files]]
from = "share/ferrofetch.svg"
source = "folder"
to = "usr/share/icons/hicolor/scalable/apps/ferrofetch.svg"
mode = "644"

[build]
kind = "cargo"

[image]
default = true

[check]
host-tests = true

# `uname`: the system's name, which the kernel reports as Ferrix.
[[smoke]]
run = "ferrofetch --no-logo --no-color"
expect = "OS: Ferrix"

# `/proc`: a count of processes, whatever it is.
[[smoke]]
run = "ferrofetch --no-logo --no-color"
expect = "Processes: "

[[smoke]]
run = "ferrofetch --version"
expect = "ferrofetch 0.1.0"
