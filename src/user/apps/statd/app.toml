# The stat service, an app (docs/APPS.md): opt-in, because an image carries
# it only to start it as pid 1 with ferrix.init=/sbin/ferrix-statd.

[package]
name = "statd"
version = "0.1.0"
description = "Ferrix's stat service: the machine's load, memory and tasks, a line of JSON at a time"
abi = "linux"
arches = ["x86_64", "aarch64", "armv7a"]
depends = []

[[package.files]]
from = "ferrix-statd"
to = "sbin/ferrix-statd"
mode = "755"

[build]
kind = "cargo"

[image]
default = false

[check]
host-tests = false

# One sample and the end: /proc/stat, /proc/meminfo and every process's stat
# read, and JSON written.
[[smoke]]
run = "ferrix-statd --seconds 1"
expect = "FERRIX-STAT-END {\"samples\":"
