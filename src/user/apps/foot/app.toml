# foot, an app (docs/APPS.md): the Wayland terminal, ported onto ferrousli
# with every library it links and the one font it draws with, built by its
# build.sh on a Linux host (WSL's on Windows). test-compositor starts it.

[package]
name = "foot"
version = "1.24.0"
description = "foot, the Wayland terminal, static against ferrousli, with DejaVu"
abi = "linux"
arches = ["x86_64"]
depends = []

[[package.files]]
from = "bin/foot"
to = "bin/foot"
mode = "755"

[[package.files]]
from = "bin/footclient"
to = "bin/footclient"
mode = "755"

[[package.files]]
from = "etc/fonts/fonts.conf"
to = "etc/fonts/fonts.conf"
mode = "644"

[[package.files]]
from = "usr/share/fonts/dejavu"
tree = true
to = "usr/share/fonts/dejavu"

[build]
kind = "script"

[image]
default = true

[check]
host-tests = false

[[smoke]]
run = "foot --version"
expect = "foot version: 1.24.0"
