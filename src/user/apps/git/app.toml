# git, an app (docs/APPS.md): a C program ported onto ferrousli, built by its
# build.sh on a Linux host (WSL's on Windows) against ferrousli's zlib port
# and the curl app's libcurl. It depends on curl for the certificates HTTPS
# is verified with, and is built after it for its library.

[package]
name = "git"
version = "2.55.0"
description = "git, static against ferrousli, with HTTP(S) through libcurl"
abi = "linux"
arches = ["x86_64", "aarch64", "armv7a"]
depends = ["curl"]

[[package.files]]
from = "usr/bin/git"
to = "usr/bin/git"
mode = "755"

[[package.files]]
from = "bin/git"
to = "bin/git"
mode = "755"

[[package.files]]
from = "usr/libexec/git-core"
tree = true
to = "usr/libexec/git-core"

[[package.files]]
from = "usr/share/git-core"
tree = true
to = "usr/share/git-core"

[build]
kind = "script"

[image]
default = true

[check]
host-tests = false

[[smoke]]
run = "git --version"
expect = "git version 2.55.0"
