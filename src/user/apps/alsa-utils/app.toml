# alsa-utils, an app (docs/APPS.md): aplay, arecord and speaker-test, static
# against ferrousli and the alsa-lib app's library, whose configuration they
# read at run time (docs/AUDIO.md, U1). test-audio boots them.

[package]
name = "alsa-utils"
version = "1.2.16"
description = "aplay, arecord and speaker-test, static against ferrousli"
abi = "linux"
arches = ["x86_64"]
depends = ["alsa-lib"]

[[package.files]]
from = "bin/aplay"
to = "bin/aplay"
mode = "755"

[[package.files]]
from = "bin/arecord"
to = "bin/arecord"
mode = "755"

[[package.files]]
from = "bin/speaker-test"
to = "bin/speaker-test"
mode = "755"

[build]
kind = "script"

[image]
default = true

[check]
host-tests = false

[[smoke]]
run = "aplay --version"
expect = "aplay: version 1.2.16 "
