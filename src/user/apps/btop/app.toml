# btop, an app (docs/APPS.md): a C++ program ported onto ferrousli, built by
# its build.sh on a Linux host with gcc.

[package]
name = "btop"
version = "1.4.7"
description = "btop, the resource monitor, static against ferrousli"
abi = "linux"
arches = ["x86_64"]
depends = []

[[package.files]]
from = "btop"
to = "bin/btop"
mode = "755"

[build]
kind = "script"

[image]
default = true

[check]
host-tests = false

# btop prints its version in bold, `btop version: \e[1m1.4.7\e[0m`, so the
# line is matched to where the escape begins.
[[smoke]]
run = "btop --version"
expect = "btop version: "
