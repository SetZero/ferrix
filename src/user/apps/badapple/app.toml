# Bad Apple!!'s player, an app (docs/APPS.md): opt-in, because without the
# video, which is fetched rather than kept in the tree, it has nothing to
# play. `cargo xtask test-badapple` is its gate.

[package]
name = "badapple"
version = "0.1.0"
description = "Bad Apple!!: the shadow-art video on the screen, its song through /dev/snd, kept in step by the sound card's clock"
abi = "linux"
arches = ["x86_64", "aarch64", "armv7a"]
depends = []

[[package.files]]
from = "badapple"
to = "bin/badapple"
mode = "755"

# Its icon. Its launcher entry is not here: it names the video, which is
# fetched, so xtask writes it beside the video when it carries that.
[[package.files]]
from = "share/badapple.svg"
source = "folder"
to = "usr/share/icons/hicolor/scalable/apps/badapple.svg"
mode = "644"

[build]
kind = "cargo"

[image]
default = false

# The player's arithmetic -- its command line, its clock, its scaling and its
# frame stepping -- and the video format, on the host.
[check]
host-tests = true

# Started from a shell with nothing to play: it reads its command line, says
# what it wants, and, not being init, exits. That is the program started and
# speaking; playing is test-badapple's.
[[smoke]]
run = "badapple"
expect = "badapple: failed: usage: badapple VIDEO.bav SONG.m4a"
