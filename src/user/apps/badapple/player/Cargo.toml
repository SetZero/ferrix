[package]
name = "badapple"
description = "Bad Apple!! on Ferrix: the shadow-art video on the screen, its song through /dev/snd, kept in step by the sound card's clock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The arithmetic -- command line, clock, scaling, stepping -- which the host
# tests (app.toml's `host-tests`).
[lib]
name = "badapple"
path = "src/lib.rs"

# The program: the screen, the card and the window, on Linux.
[[bin]]
name = "badapple"
path = "src/main.rs"
test = false

# Show every frame's shades inverted, so `xtask test-badapple` can show that
# its picture check reads the screen rather than the program's shape.
[features]
negative-control = []

[dependencies]
bav = { path = "../bav" }
# The system's playback through /dev/snd and its resampler, shared with the
# sound server.
media-pcm = { path = "../../../system/linux/media/pcm" }
media-resample = { path = "../../../system/linux/media/resample" }
# The song is decoded here, from the original's own AAC track, in Rust:
# MP4 demuxing and AAC-LC only. MPL-2.0, used unmodified.
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "isomp4"] }
libc = "0.2.189"

[target.'cfg(target_os = "linux")'.dependencies]
# The screen: /dev/dri/card0's dumb buffers, as the compositor's `blank`
# shows them. Linux-only code, so only a Linux build pulls it in.
compositor-drm = { path = "../../../system/linux/compositor/drm" }
# The window, when a compositor is running: the desktop clients' Wayland
# runtime, whose toplevel this was the first client of.
compositor-toolkit = { path = "../../../system/linux/compositor/toolkit" }
