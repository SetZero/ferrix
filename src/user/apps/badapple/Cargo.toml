# Bad Apple!!, an app (docs/APPS.md): a workspace of its own, of two crates.
#
# `player` is the program, a Linux program built with std that speaks only
# the Linux ABI; `bav` is its video format and `bav-pack`, the host's
# converter, which xtask runs on the build machine and no image carries. The
# player plays through the system's own pieces -- media's `pcm` and
# `resample`, the compositor's `drm` and `toolkit` -- by relative path, as a
# native app links the runtime.
[workspace]
resolver = "3"
members = ["bav", "player"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Matches Ferrix's rust-toolchain.toml, which rustup finds from here.
rust-version = "1.97"
license = "MIT"
publish = false

[profile.dev]
overflow-checks = true
# The player keeps time with the sound card; unoptimised, decoding a second of
# AAC takes longer than a second and the gate would test the machine.
opt-level = 2

[profile.release]
overflow-checks = true
