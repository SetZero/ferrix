[package]
name = "bav"
description = "A grey-scale run-length video format: what a shadow-art video such as Bad Apple!! compresses to"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "bav"
path = "src/lib.rs"

# The host half: grey frames from ffmpeg on standard input, a `.bav` file out.
# xtask runs it on the build machine; it never goes into an image.
[[bin]]
name = "bav-pack"
path = "src/pack.rs"
