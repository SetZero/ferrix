[package]
name = "pixel7-monitor"
description = "A desktop window on the Pixel 7 while it runs Ferrix: boot status, the console, and the phone's live stats"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

# A workspace of its own: a desktop program with a web view, built for the
# host, which none of Ferrix's own gates or targets are about.
[workspace]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.10", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
