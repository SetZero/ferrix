[alias]
xtask = "run --quiet --package xtask --"

# Flags for the freestanding targets. Set here rather than in an environment
# variable so that `cargo build`, `cargo clippy` and `cargo xtask` all agree,
# and so CI needs no wrapper.
#
# **The link script is not here, and must not be moved back.** Cargo merges
# every `.cargo/config.toml` between the invocation directory and the
# filesystem root, joining `rustflags` arrays rather than letting the nearest
# win -- so a checkout inside another checkout gets `-T` twice, the script is
# evaluated twice, and the kernel links with a wrapped segment the loader
# rejects. `kernel/build.rs` emits it instead, once, and argues it at length.
#
# What is left below is codegen flags, where being passed twice means nothing.

[target.x86_64-unknown-none]
rustflags = [
    # lld defaults to a 4 KiB maximum page size here, but say so anyway: the
    # AArch64 side below genuinely needs it and the two should not silently
    # disagree about segment alignment.
    "-C", "link-arg=-zmax-page-size=4096",
    "-C", "relocation-model=static",
    # A panic report walks the frame-pointer chain for its backtrace, and
    # without this the compiler is free to use the register for anything.
    "-C", "force-frame-pointers=yes",
]

[target.aarch64-unknown-none-softfloat]
rustflags = [
    # **Required, not cosmetic.** lld defaults `max-page-size` to 64 KiB on
    # AArch64, which pads every segment to a 64 KiB boundary and produces a
    # kernel image several times larger with segments the 4 KiB granule cannot
    # map at the alignment the headers claim.
    "-C", "link-arg=-zmax-page-size=4096",
    "-C", "relocation-model=static",
    # A panic report walks the frame-pointer chain for its backtrace, and
    # without this the compiler is free to use the register for anything.
    "-C", "force-frame-pointers=yes",
]

[target.armv7a-none-eabi]
rustflags = [
    "-C", "link-arg=-zmax-page-size=4096",
    "-C", "relocation-model=static",
    # A panic report walks the frame-pointer chain for its backtrace, and
    # without this the compiler is free to use the register for anything.
    "-C", "force-frame-pointers=yes",
]

# The ARMv7-A loader: an ELF32 static PIE, laid out for `xtask/src/pe.rs` to
# turn into a UEFI application. Every flag here is load-bearing:
#
#   * rust-lld as a plain ELF linker, and `link-self-contained=no`, so that
#     the target's C runtime and musl's libc — which a UEFI application must
#     not contain — are never linked. The target is used for its
#     position-independent `core`, not for anything Linux about it;
#   * `-pie` and `--no-dynamic-linker`, so every absolute address is a
#     relocation firmware can apply, and nothing asks for an interpreter;
#   * `-znotext`, because read-only data holds absolute pointers too, and a PE
#     loader applies relocations before it applies section permissions.
[target.armv7-unknown-linux-musleabi]
linker = "rust-lld"
rustflags = [
    "-C", "linker-flavor=ld.lld",
    "-C", "link-self-contained=no",
    "-C", "link-arg=-Tboot/linker/armv7a.ld",
    "-C", "link-arg=-pie",
    "-C", "link-arg=--no-dynamic-linker",
    "-C", "link-arg=-znotext",
    "-C", "link-arg=-zmax-page-size=4096",
]
