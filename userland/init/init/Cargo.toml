[package]
name = "init"
description = "/sbin/init: the event loop and the Linux backends around libs/init/svc's manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Declarations only, as in zinc: clone3, mount, epoll and signalfd are the C
# library std already links, or raw system calls through its `syscall`.
libc = "0.2.189"
# The manager: unit files, the graph, operations, every kind's state machine.
ferrix-svc = { path = "../../../libs/init/svc" }
# The control socket's records and the readiness lines.
ferrix-svc-proto = { path = "../../../libs/init/svc-proto" }
# The native calls, for bootstrap channels, native services and the
# directory (docs/INIT.md §6): the numbers and layouts, and the typed
# wrappers over them.
ferrix-native = { path = "../../../libs/proto/native" }
ferrix-native-abi = { path = "../../../libs/proto/native-abi" }

[lints]
workspace = true
