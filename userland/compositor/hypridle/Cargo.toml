[package]
name = "compositor-hypridle"
description = "hypridle: run commands when the seat goes idle and when it comes back, and loginctl's lock-session to reach it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "hypridle"
path = "src/main.rs"

# Ferrix has no logind: `loginctl lock-session`, which the user's
# hypridle.conf calls, reaches hypridle over its own socket instead
# (src/session.rs, docs/DESKTOP-CLIENTS.md).
[[bin]]
name = "loginctl"
path = "src/bin/loginctl.rs"

[lib]
name = "compositor_hypridle"
path = "src/lib.rs"

[dependencies]
# Declarations only, as in `socket` and `hyprix`: `poll` is not in std, and
# an idle daemon that woke on a timer to look would never be idle itself.
libc = "0.2.189"
compositor-protocol = { path = "../protocol" }
compositor-socket = { path = "../socket" }
compositor-wire = { path = "../wire" }

[lints]
workspace = true
