# The hyprlock.conf `cargo xtask test-compositor --boot hyprlock` locks the
# screen with, and the expected images in this directory are drawn from.
# Shaped like the customer's file -- the clock panel, a label, their input
# field -- with the fonts the tree carries, no clock (a picture of a time is
# a picture of one minute) and no animation, so that every frame is one an
# expected image can hold. The password is `gatez`, seeded for root in authd,
# typed on a German keyboard: the last key pressed is the one an American
# keyboard calls Y, so the screen only unlocks if the layout is German.

$font = Liberation Sans

general {
    hide_cursor = true
    ignore_empty_input = true
    # Long enough for a screendump to find the fail text.
    fail_timeout = 60000
}

auth {
    pam {
        enabled = true
    }
}

animations {
    enabled = false
}

background {
    monitor =
    color = rgb(1c1b22)
    blur_passes = 0
}

shape {
    monitor =
    size = 520, 190
    color = rgba(0, 0, 0, 0.35)
    rounding = 24
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = Locked for $USER
    color = rgba(255, 255, 255, 0.95)
    font_size = 28
    font_family = $font
    shadow_passes = 2
    shadow_size = 4
    position = 0, 200
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.35)
    inner_color = rgba(0, 0, 0, 0.45)
    font_color = rgb(240, 240, 240)
    font_family = $font
    fade_on_empty = false
    placeholder_text = <span foreground="##cccccc">Password</span>
    fail_text = <span foreground="##ff8888">$PAMFAIL</span>
    check_color = rgba(255, 255, 255, 0.7)
    fail_color = rgba(255, 100, 100, 0.9)
    rounding = 28
    hide_input = false
    position = 0, -60
    halign = center
    valign = center
}
