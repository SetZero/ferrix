[package]
name = "compositor-blank"
description = "Iteration 1 of the compositor: show one colour on /dev/dri/card0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "blank"
path = "src/main.rs"

[features]
# Draw the first pixel in another colour, so the display test can show its
# pixel check fails on exactly that pixel.
negative-control = []

[dependencies]
# Declarations only, as in zinc: open, ioctl, mmap and pause are the C library
# std already links.
libc = "0.2.189"
# The DRM numbers and structure layouts, checked against the UAPI headers.
ferrix-linux-abi = { path = "../../libs/linux-abi" }

[lints]
workspace = true
