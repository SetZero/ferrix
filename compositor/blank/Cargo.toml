[package]
name = "compositor-blank"
description = "Iteration 1 of the compositor: show one colour on /dev/dri/card0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "blank"
path = "src/main.rs"

[features]
# Draw the first pixel in another colour, so the display test can show its
# pixel check fails on exactly that pixel. The drawing is the card crate's,
# so the feature is passed on to it.
negative-control = ["compositor-drm/negative-control"]

[dependencies]
# Declarations only, as in zinc: `pause` is the C library std already links.
libc = "0.2.189"
# The card, which `hyprix` drives through the same crate.
compositor-drm = { path = "../drm" }

[lints]
workspace = true
