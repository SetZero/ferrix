[package]
name = "compositor-term"
description = "A terminal emulator: a pseudoterminal, a character grid, and a window to draw it in"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The code is the workspace's licence. The fonts in `font/`, and the coverage
# cells `src/font.rs` holds, are Hack: MIT and the Bitstream Vera License, see
# LICENSE-hack, which a binary shipping this crate must reproduce.
license.workspace = true
publish.workspace = true

[[bin]]
name = "term"
path = "src/main.rs"

[lib]
name = "compositor_term"
path = "src/lib.rs"

[dependencies]
compositor-evecho = { path = "../evecho" }
compositor-protocol = { path = "../protocol" }
compositor-shm = { path = "../shm" }
compositor-socket = { path = "../socket" }
compositor-wire = { path = "../wire" }
compositor-xkb = { path = "../xkb" }
ferrix-fbtext = { path = "../../libs/fbtext" }
# Declarations only: the pseudoterminal's `open`, `ioctl`, `fork` and `execve`.
libc = "0.2.189"

[dev-dependencies]
compositor-layout = { path = "../layout" }
compositor-render = { path = "../render" }

[lints]
workspace = true
