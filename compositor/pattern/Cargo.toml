[package]
name = "compositor-pattern"
description = "A Wayland client that draws one of the test patterns and nothing else"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "compositor_pattern"
path = "src/lib.rs"

[[bin]]
name = "pattern"
path = "src/main.rs"

[dependencies]
compositor-protocol = { path = "../protocol" }
compositor-render = { path = "../render" }
compositor-socket = { path = "../socket" }
compositor-wire = { path = "../wire" }
# Declarations only: `memfd_create` and `mmap` for the shared buffer.
libc = "0.2.189"

[lints]
workspace = true
