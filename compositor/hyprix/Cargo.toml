[package]
name = "hyprix"
description = "The compositor: a Hyprland-shaped Wayland compositor for Ferrix"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "hyprix"
path = "src/lib.rs"

[[bin]]
name = "hyprix"
path = "src/main.rs"

[dependencies]
# The evdev nodes the seat reads, and the rule for a program started as init.
compositor-evecho = { path = "../evecho" }
# The keymap the seat hands every client.
compositor-xkb = { path = "../xkb" }
compositor-anim = { path = "../anim" }
compositor-config = { path = "../config" }
compositor-drm = { path = "../drm" }
compositor-ipc = { path = "../ipc" }
compositor-layout = { path = "../layout" }
compositor-protocol = { path = "../protocol" }
compositor-render = { path = "../render" }
compositor-server = { path = "../server" }
compositor-socket = { path = "../socket" }
compositor-wire = { path = "../wire" }
# The evdev numbers the devices report.
ferrix-linux-abi = { path = "../../libs/linux-abi" }
# Declarations only: `mmap` of a client's pool, and `pause`.
libc = "0.2.189"

[dev-dependencies]
# The test runs the compositor and two clients in threads of one process and
# compares the pixels, which is the everyday gate compositor/README.md names.
compositor-pattern = { path = "../pattern" }
# And a subscriber on the event socket, which is what a bar is.
compositor-ctl = { path = "../ctl" }
# The two halves of a clipboard, for the copy-and-paste test.
compositor-clip = { path = "../clip" }
# A taskbar with the drawing taken out, for the foreign-toplevel test.
compositor-lswt = { path = "../lswt" }

[lints]
workspace = true
